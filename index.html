        // --- Error Boundary (Prevent White Screen) ---
        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true };
            }
            componentDidCatch(error, errorInfo) {
                console.error("Widget Crash Prevented:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="bg-red-50 p-6 rounded-[24px] border border-red-100 flex flex-col items-center justify-center h-full min-h-[200px] text-center">

                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const SafeWidget = ({ children }) => <ErrorBoundary>{children}</ErrorBoundary>;

        // --- Hooks ---
        function useDebounce(value, delay) {
            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => {
                const handler = setTimeout(() => setDebouncedValue(value), delay);
                return () => clearTimeout(handler);
            }, [value, delay]);
            return debouncedValue;
        }

        // --- Helpers ---
        const cleanCurrency = (val) => {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            return parseFloat(val.toString().replace(/[฿",]/g, '').trim()) || 0;
        };

        const isChainBasedChannel = (channel) => {
            const upper = channel?.toUpperCase() || '';
            return ['MT', 'INTER COMPANY', 'ONLINE', 'BJC'].includes(upper);
        };

        const getImgFilename = (groupName) => {
            return `image/${(groupName || '').toLowerCase().replace(/&/g, '')}.png`;
        };

        const getParetoTopItems = (dataObj, maxItems = 5, threshold = 0.8) => {
            if(!dataObj) return [];
            const entries = Object.entries(dataObj).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]);
            const total = entries.reduce((sum, [, val]) => sum + val, 0);
            if (total === 0) return [];
            
            let cumulative = 0;
            const result = [];
            for (let i = 0; i < entries.length; i++) {
                const pct = ((entries[i][1] / total) * 100).toFixed(1);
                result.push({ name: entries[i][0], pct });
                cumulative += entries[i][1];
                if (cumulative / total >= threshold || result.length >= maxItems) break;
            }
            return result;
        };

        // --- 3. Dynamic Projection Logic ---
        const calculateDynamicForecast = (ytd26, ytd25, fy25, target26, monthsCount26) => {
            const validYtd26 = ytd26 || 0;
            const validYtd25 = ytd25 || 0;
            const validFy25 = fy25 || 0;
            const validTarget26 = target26 || 0;
            const validMonths = monthsCount26 || 1; // ป้องกันการหารด้วยศูนย์

            let forecast26 = 0;
            if (validYtd25 > 0 && validFy25 > 0) {
                // กรณีมีประวัติปีที่แล้ว: คำนวณแบบ Seasonality
                forecast26 = validYtd26 * (validFy25 / validYtd25);
            } else {
                // กรณีไม่มีประวัติ หรือเป็นสินค้าใหม่: คำนวณแบบ Linear Run Rate
                forecast26 = (validYtd26 / validMonths) * 12;
            }

            const percent = validTarget26 > 0 ? (forecast26 / validTarget26) * 100 : 0;
            const isMissing = percent < 100;

            return {
                forecast26,
                forecastStatus: { percent, isMissing }
            };
        };

            }
        };

        const requestCache = new Map();

        const fetchCSV = async (url) => {
            if (!url) return null;
            if (requestCache.has(url)) return requestCache.get(url);

            const fetchPromise = (async () => {
                let retries = 3;
                let lastError;
                while (retries > 0) {
                    try {
                        const response = await fetch(url);
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        const csvText = await response.text();
                        return new Promise((resolve) => {
                            window.Papa.parse(csvText, {
                                header: true, skipEmptyLines: true,
                                complete: (results) => resolve(results.data)
                            });
                        });
                    } catch (error) {
                        lastError = error;
                        retries--;
                        if (retries > 0) await new Promise(r => setTimeout(r, 500 * (4 - retries)));
                    }
                }
                console.error('Fetch CSV Error:', lastError);
                throw lastError;
            })();

            requestCache.set(url, fetchPromise);
            return fetchPromise;
        };

        const FilterDropdown = ({ label, value, options, onChange, icon }) => {
            const [isOpen, setIsOpen] = useState(false);
            const dropdownRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setIsOpen(false);
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            return (
                <div className="relative" ref={dropdownRef}>
                    <button 
                        onClick={() => setIsOpen(!isOpen)} 
                        className="flex items-center gap-2 text-sm font-medium text-[#1d1d1f] bg-[#e8e8ed] hover:bg-[#d1d1d6] px-4 py-2 rounded-xl transition-colors min-w-[160px] justify-between"

                        </div>
                        <ChevronDown className={`w-4 h-4 text-[#86868b] transition-transform ${isOpen ? 'rotate-180' : ''}`} />
                    </button>
                    {isOpen && (

                                    const isSelected = optVal === value;
                                    
                                    const prevOptGroup = index > 0 ? (typeof options[index-1] === 'string' ? null : options[index-1].group) : null;
                                    const showGroupHeader = optGroup && optGroup !== prevOptGroup;

                                    return (
                                        <React.Fragment key={optVal || index}>
                                            {showGroupHeader && (
                                                <div className={`px-4 py-1.5 mt-2 mb-1 mx-2 text-[10px] font-extrabold uppercase tracking-wider rounded-lg ${GROUP_COLORS[optGroup] || 'text-[#86868b] bg-[#f5f5f7]'}`}>
                                                    {optGroup}
                                                </div>
                                            )}
                                            <button 
                                                className={`w-full text-left px-5 py-2.5 text-sm font-medium hover:bg-[#f5f5f7] transition-colors flex justify-between items-center ${isSelected ? 'text-[#0071e3]' : 'text-[#1d1d1f]'}`} 
                                                onClick={() => { onChange(optVal); setIsOpen(false); }}

            const levelNames = ['Product Group', 'Sub-Product Group', 'Group SKU', 'Product Name'];
            const currentLevelIdx = breadcrumbs.length;

            const rawData = useMemo(() => {

                if (breadcrumbs.length > 0) data = data.filter(d => d.ProductGroup === breadcrumbs[0]);
                if (breadcrumbs.length > 1) data = data.filter(d => d.SubProductGroup === breadcrumbs[1]);
                if (breadcrumbs.length > 2) data = data.filter(d => d.GroupSKU === breadcrumbs[2]);

                const map = {};
                let overallTotalSales = 0, overallValidSales = 0, overallValidCost = 0;

                    const key = d[groupBy] || 'Unknown';
                    if (!map[key]) map[key] = { name: key, totalSales: 0, validSales: 0, validCost: 0, fallbackMockMargin: 0.3 + (((d.ProductName || '').length || 10) % 40) / 100 };
                    
                    const sales = d.NetPrice || 0;
                    let cost = cleanCurrency(d.Cost || d.COGS || d['Standard Cost'] || d['Total Cost'] || d['Standard Price'] || 0);

                    if (cost === 0 && sales > 0) {
                        const mockMargin = 0.3 + ((d.ProductName?.length || 10) % 40) / 100;
                        cost = sales * (1 - mockMargin);
                    }

                    map[key].totalSales += sales;
                    overallTotalSales += sales;

                        overallValidCost += cost;

                                        <td className="py-4 px-4 font-semibold text-[#1d1d1f] sticky left-0 z-10 bg-inherit max-w-[250px] truncate">{sku}</td>

                                                            if (pct < 100) {
                                                                const allCust = Array.from(grid.subChannelCustomers[col] || []);
                                                                const boughtCust = grid.matrix[sku]?.[col] || new Set();
                                                                const missed = allCust.filter(c => !boughtCust.has(c)).sort();
                                                                setSelectedGap({ sku, subCh: col, missed });

                                                        </div>
                                                        <div className="w-full h-1.5 bg-[#e5e5ea] rounded-full"><div className={`h-full rounded-full ${pct === 100 ? 'bg-[#34c759]' : 'bg-[#ff3b30]'}`} style={{ width: `${pct}%` }}></div></div>

                        </table>
                    </div>
                    
                    {/* --- 1. Target List Modal UI --- */}
                    {selectedGap && (
                        <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-in fade-in duration-200" onClick={(e) => {if(e.target === e.currentTarget) setSelectedGap(null);}}>
                            <div className="bg-white/95 backdrop-blur-xl rounded-[24px] shadow-2xl w-full max-w-md overflow-hidden border border-white/20 flex flex-col max-h-[80vh]">
                                <div className="p-5 border-b border-black/5 flex justify-between items-start bg-[#f5f5f7]/50">
                                    <div>
                                        <h3 className="text-[10px] font-bold text-[#ff2d55] uppercase tracking-wider mb-1">Actionable Insight</h3>
                                        <h2 className="text-lg font-bold text-[#1d1d1f] leading-tight">Target List for Sales Team</h2>
                                        <p className="text-xs text-[#86868b] mt-1 font-medium">{selectedGap.sku} <span className="mx-1">•</span> {selectedGap.subCh}</p>
                                    </div>
                                    <button onClick={() => setSelectedGap(null)} className="text-[#86868b] hover:text-[#1d1d1f] bg-[#e8e8ed] hover:bg-[#d1d1d6] p-1.5 rounded-full transition-colors"><X className="w-4 h-4" /></button>
                                </div>
                                <div className="p-4 overflow-y-auto custom-scrollbar flex-1 bg-white">
                                    <div className="text-xs font-bold text-[#1d1d1f] mb-3 flex items-center gap-2">
                                        <Users className="w-4 h-4 text-[#86868b]" /> {selectedGap.missed.length} Missed Customers
                                    </div>
                                    <ul className="space-y-2">
                                        {selectedGap.missed.map((cust, i) => (
                                            <li key={i} className="text-sm text-[#1d1d1f] flex items-center gap-2 p-2 bg-[#f5f5f7] rounded-lg border border-black/5">
                                                <div className="w-1.5 h-1.5 rounded-full bg-[#ff2d55] flex-shrink-0"></div>
                                                <span className="truncate">{cust}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                                <div className="p-4 bg-white border-t border-black/5">
                                    <button 
                                        onClick={handleCopy}
                                        className={`w-full py-3 rounded-xl flex items-center justify-center gap-2 text-sm font-bold transition-all ${isCopied ? 'bg-[#34c759] text-white shadow-[0_0_10px_rgba(52,199,89,0.3)]' : 'bg-[#1d1d1f] hover:bg-black text-white shadow-md hover:shadow-lg'}`}
                                    >
                                        {isCopied ? <><Check className="w-4 h-4" /> Copied!</> : <><Copy className="w-4 h-4" /> Copy to Clipboard</>}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        function Dashboard() {
            const [activeTab, setActiveTab] = useState('Overview');
            const tabs = [
                { id: 'Overview', label: 'Executive Overview', icon: <LayoutDashboard className="w-4 h-4" /> },
                { id: 'Core', label: 'Core Portfolio & Health', icon: <Package className="w-4 h-4" /> },
                { id: 'Innovation', label: 'Innovation & NPD', icon: <Sparkles className="w-4 h-4" /> },
                { id: 'Distribution', label: 'Distribution & Expansion', icon: <MapPin className="w-4 h-4" /> }
            ];

            const [salesData, setSalesData] = useState([]);
            const [budgetChannel, setBudgetChannel] = useState([]);
            const [budgetProduct, setBudgetProduct] = useState([]);
            
            const [selectedGroups, setSelectedGroups] = useState(['ALL']); 
            const [showUpload, setShowUpload] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const [show2025Trend, setShow2025Trend] = useState(true);
            const [showForecast, setShowForecast] = useState(false); 
            
            const [topPerfSearch, setTopPerfSearch] = useState('');
            const [whiteSpaceSearch, setWhiteSpaceSearch] = useState('');
            const [customerSearch, setCustomerSearch] = useState('');

            const debouncedTopPerfSearch = useDebounce(topPerfSearch, 300);
            const debouncedWhiteSpaceSearch = useDebounce(whiteSpaceSearch, 300);
            const debouncedCustomerSearch = useDebounce(customerSearch, 300);
            
            const [topPerfSortMode, setTopPerfSortMode] = useState('sales');
            const [topCustomerSortMode, setTopCustomerSortMode] = useState('sales');

            const [filterSubProduct, setFilterSubProduct] = useState('All');
            const [filterChannel, setFilterChannel] = useState('All');
            const [filterMonth, setFilterMonth] = useState('All');
            
            const [topPerfDrillDown, setTopPerfDrillDown] = useState(null);
            const [topCustomerDrillDown, setTopCustomerDrillDown] = useState(null);
            
            const [filesStatus, setFilesStatus] = useState({
                DACARE: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DATISSUE: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DAOS: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DABATTERY: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DASP: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DANB: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                QUALITY: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DALIFESTYLE: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
            });
            const [uploadTab, setUploadTab] = useState('DACARE');

            const syncAllData = async () => {
                if (isSyncing) return;
                setIsSyncing(true);
                setShowUpload(true);

                requestCache.clear();

                let initialStatus = { ...filesStatus };
                for (const groupName of Object.keys(DATA_SOURCES)) initialStatus[groupName] = { s25: 'loading', s26: 'loading', bCh: 'loading', bPr: 'loading' };
                setFilesStatus(initialStatus);

                let finalSales = [], finalBudgetChannel = [], finalBudgetProduct = [];

                const groupPromises = Object.entries(DATA_SOURCES).map(async ([groupName, sources]) => {
                    const groupSales = [], groupBudgetChannel = [], groupBudgetProduct = [];

                    setFilesStatus(prev => ({ ...prev, [groupName]: { s25: 'loading', s26: 'loading', bCh: 'loading', bPr: 'loading' } }));

                    try {
                        const [s25Raw, s26Raw, bChRaw, bPrRaw] = await Promise.all([
                            fetchCSV(sources.s25).catch(() => null),
                            fetchCSV(sources.s26).catch(() => null),
                            fetchCSV(sources.bCh).catch(() => null),
                            fetchCSV(sources.bPr).catch(() => null)
                        ]);

                        if (s25Raw) {
                            for (let i=0; i<s25Raw.length; i++) {
                                const row = s25Raw[i];
                                const rawGrp = row['Product Group'] || row['ProductGroup'];
                                if (rawGrp && rawGrp.toUpperCase().trim() !== groupName) continue; 
                                if (row['Product Name'] && row['Month']) {
                                    groupSales.push({
                                        Month: row['Month'], ProductGroup: groupName, Channel: row['Channel'], SubChannel: row['Sub-channel'] || row['Sub-Channel'],
                                        SoldToParty: row['Sold-to party'] || row['Sold-To Party'], MaterialNumber: row['Material Number'], ProductName: row['Product Name'],
                                        SubProductGroup: row['Sub-product group'] || row['Sub-Product Group'], GroupSKU: row['Group SKU'] || row['Sub-product group'] || row['Sub-Product Group'],
                                        NetPrice: cleanCurrency(row['Net Price']), 
                                        Cost: cleanCurrency(row['Cost'] || row['COGS'] || row['Standard Cost'] || row['Total Cost'] || row['Standard Price'] || 0),
                                        Year: '2025'
                                    });
                                }
                            }
                            setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], s25: 'success' } }));
                        } else setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], s25: 'error' } }));

                        if (s26Raw) {
                            for (let i=0; i<s26Raw.length; i++) {
                                const row = s26Raw[i];
                                const rawGrp = row['Product Group'] || row['ProductGroup'];
                                if (rawGrp && rawGrp.toUpperCase().trim() !== groupName) continue;
                                if (row['Product Name'] && row['Month']) {
                                    groupSales.push({
                                        Month: row['Month'], ProductGroup: groupName, Channel: row['Channel'], SubChannel: row['Sub-channel'] || row['Sub-Channel'],
                                        SoldToParty: row['Sold-to party'] || row['Sold-To Party'], MaterialNumber: row['Material Number'], ProductName: row['Product Name'],
                                        SubProductGroup: row['Sub-product group'] || row['Sub-Product Group'], GroupSKU: row['Group SKU'] || row['Sub-product group'] || row['Sub-Product Group'],
                                        NetPrice: cleanCurrency(row['Net Price']), 
                                        Cost: cleanCurrency(row['Cost'] || row['COGS'] || row['Standard Cost'] || row['Total Cost'] || row['Standard Price'] || 0),
                                        Year: '2026'
                                    });
                                }
                            }
                            setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], s26: 'success' } }));
                        } else setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], s26: 'error' } }));

                        if (bChRaw) {
                            for (let i=0; i<bChRaw.length; i++) {
                                const row = bChRaw[i];
                                const rawGrp = row['Product Group'] || row['ProductGroup'];
                                if (rawGrp && rawGrp.toUpperCase().trim() !== groupName) continue;
                                if (row['Channel'] && row['Channel'] !== 'TOTAL') {
                                    groupBudgetChannel.push({
                                        ProductGroup: groupName, Channel: row['Channel'], 
                                        Target2026: cleanCurrency(row['Target 2026 (Plan)'] || row['Target 2026 (Budget)'] || row['Target 2026']),
                                        Plan2027: cleanCurrency(row['Target 2027 (Plan)'] || row['Target 2027 (Budget)'] || row['Plan 2027'] || 0),
                                        Forecast2026: cleanCurrency(row['L.E. 2026 (Forecast)'] || row['Forecast 2026'] || row['L.E. 2026'] || 0)
                                    });
                                }
                            }
                            setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], bCh: 'success' } }));
                        } else setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], bCh: 'error' } }));

                        if (bPrRaw) {
                            for (let i=0; i<bPrRaw.length; i++) {
                                const row = bPrRaw[i];
                                const rawGrp = row['Product Group'] || row['ProductGroup'];
                                if (rawGrp && rawGrp.toUpperCase().trim() !== groupName) continue;
                                const subGroup = row['Sub-product Group'] || row['Sub-Product Group'];
                                if (subGroup && subGroup !== 'TOTAL') {
                                    groupBudgetProduct.push({
                                        ProductGroup: groupName, SubProductGroup: subGroup, 
                                        Target2026: cleanCurrency(row['Target 2026 (Plan)'] || row['Target 2026 (Budget)'] || row['Target 2026']),
                                        Plan2027: cleanCurrency(row['Target 2027 (Plan)'] || row['Target 2027 (Budget)'] || row['Plan 2027'] || 0),
                                        Forecast2026: cleanCurrency(row['L.E. 2026 (Forecast)'] || row['Forecast 2026'] || row['L.E. 2026'] || 0)
                                    });
                                }
                            }
                            setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], bPr: 'success' } }));
                        } else setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], bPr: 'error' } }));

                        return { groupSales, groupBudgetChannel, groupBudgetProduct };
                    } catch (error) {
                        console.error(`Unexpected error syncing ${groupName}:`, error);
                        setFilesStatus(prev => ({ ...prev, [groupName]: { s25: 'error', s26: 'error', bCh: 'error', bPr: 'error' } }));
                        return { groupSales: [], groupBudgetChannel: [], groupBudgetProduct: [] };
                    }
                });

                const results = await Promise.all(groupPromises);

                results.forEach(res => {
                    for (let i = 0; i < res.groupSales.length; i++) finalSales.push(res.groupSales[i]);
                    for (let i = 0; i < res.groupBudgetChannel.length; i++) finalBudgetChannel.push(res.groupBudgetChannel[i]);
                    for (let i = 0; i < res.groupBudgetProduct.length; i++) finalBudgetProduct.push(res.groupBudgetProduct[i]);
                });

                setSalesData(finalSales);
                setBudgetChannel(finalBudgetChannel);
                setBudgetProduct(finalBudgetProduct);
                setIsSyncing(false);
                setTimeout(() => setShowUpload(false), 1200);
            };

            useEffect(() => { syncAllData(); }, []);

            const toggleGroup = (group) => {
                if (group === 'ALL') setSelectedGroups(['ALL']);
                else {
                    let newGroups = selectedGroups.filter(g => g !== 'ALL');
                    if (newGroups.includes(group)) {
                        newGroups = newGroups.filter(g => g !== group);
                        if (newGroups.length === 0) newGroups = ['ALL'];
                    } else newGroups.push(group);
                    newGroups.sort((a, b) => GROUP_ORDER.indexOf(a) - GROUP_ORDER.indexOf(b));
                    setSelectedGroups(newGroups);
                }
                setFilterSubProduct('All');
            };

            const availableSubProducts = useMemo(() => {
                const base = selectedGroups.includes('ALL') ? salesData : salesData.filter(d => selectedGroups.includes(d.ProductGroup));
                const subProdMap = new Map();
                base.forEach(d => { if (d.SubProductGroup && !subProdMap.has(d.SubProductGroup)) subProdMap.set(d.SubProductGroup, d.ProductGroup); });
                const list = Array.from(subProdMap.entries()).map(([name, group]) => ({ val: name, group }));
                list.sort((a, b) => {
                    const gA = GROUP_ORDER.indexOf(a.group), gB = GROUP_ORDER.indexOf(b.group);
                    if (gA !== gB) return gA - gB;
                    return a.val.localeCompare(b.val);
                });
                return list;
            }, [salesData, selectedGroups]);

            const availableChannels = useMemo(() => {
                const base = selectedGroups.includes('ALL') ? salesData : salesData.filter(d => selectedGroups.includes(d.ProductGroup));
                const channelSalesMap = {};
                base.forEach(d => {
                    if (d.Channel && d.Year === '2026') channelSalesMap[d.Channel] = (channelSalesMap[d.Channel] || 0) + (d.NetPrice || 0);
                });
                return Object.entries(channelSalesMap).sort((a, b) => b[1] - a[1]).map(item => item[0]);
            }, [salesData, selectedGroups]);

            const monthsList = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            const filteredData = useMemo(() => {
                return salesData.filter(d => {
                    const matchGroup = selectedGroups.includes('ALL') || selectedGroups.includes(d.ProductGroup);
                    const matchSub = filterSubProduct === 'All' || d.SubProductGroup === filterSubProduct;
                    const matchChannel = filterChannel === 'All' || d.Channel === filterChannel;
                    const matchMonth = filterMonth === 'All' || (d.Month && d.Month.startsWith(filterMonth));
                    return matchGroup && matchSub && matchChannel && matchMonth;
                });
            }, [salesData, selectedGroups, filterSubProduct, filterChannel, filterMonth]);

            const kpi = useMemo(() => {
                const filterFn = (d) => {
                    const matchGroup = selectedGroups.includes('ALL') || selectedGroups.includes(d.ProductGroup);
                    const matchSub = filterSubProduct === 'All' || d.SubProductGroup === filterSubProduct;
                    const matchChannel = filterChannel === 'All' || d.Channel === filterChannel;
                    const matchMonth = filterMonth === 'All' || (d.Month && d.Month.startsWith(filterMonth));
                    return matchGroup && matchSub && matchChannel && matchMonth;
                };
                
                const valid2026Months = new Set(salesData.filter(d => d.Year === '2026').map(d => d.Month?.split('-')[0])); 
                const monthsCount26 = valid2026Months.size || 1; // ส่งค่าให้ Dynamic Projection
                
                const data2026 = salesData.filter(d => d.Year === '2026' && filterFn(d));
                const s26 = data2026.reduce((a, b) => a + (b.NetPrice || 0), 0);
                
                const data2025 = salesData.filter(d => d.Year === '2025' && filterFn(d));
                const fy25 = data2025.reduce((a, b) => a + (b.NetPrice || 0), 0);
                const s25_YTD = data2025.filter(d => valid2026Months.has(d.Month?.split('-')[0])).reduce((a, b) => a + (b.NetPrice || 0), 0);
                
                const growthYoY = s25_YTD > 0 ? ((s26 - s25_YTD) / s25_YTD) * 100 : 0;

                const isSubFiltered = filterSubProduct !== 'All', isChannelFiltered = filterChannel !== 'All';
                let relevantBudgets = [];

                if (!(isSubFiltered && isChannelFiltered)) {
                    if (isSubFiltered) relevantBudgets = budgetProduct.filter(b => (selectedGroups.includes('ALL') || selectedGroups.includes(b.ProductGroup)) && b.SubProductGroup === filterSubProduct);
                    else if (isChannelFiltered) relevantBudgets = budgetChannel.filter(b => (selectedGroups.includes('ALL') || selectedGroups.includes(b.ProductGroup)) && b.Channel === filterChannel);
                    else relevantBudgets = budgetChannel.filter(b => selectedGroups.includes('ALL') || selectedGroups.includes(b.ProductGroup));
                }

                const target26 = relevantBudgets.length ? relevantBudgets.reduce((a,b) => a + (b.Target2026 || 0), 0) : null;
                const plan27 = relevantBudgets.length ? relevantBudgets.reduce((a,b) => a + (b.Plan2027 || 0), 0) : null;
                
                // --- Inject Dynamic Projection Logic ---
                const { forecast26, forecastStatus } = calculateDynamicForecast(s26, s25_YTD, fy25, target26, monthsCount26);

                const progress = (target26 && target26 > 0) ? (s26 / target26) * 100 : 0;
                const growthPlan = (target26 && plan27 && target26 > 0) ? ((plan27 - target26) / target26) * 100 : 0;

                return { s26, s25_YTD, growthYoY, target26, forecast26, forecastStatus, plan27, progress, growthPlan, monthsCount26 }; // Export monthsCount26 for Insight math
            }, [salesData, budgetChannel, budgetProduct, selectedGroups, filterSubProduct, filterChannel, filterMonth]);

            const trendChartData = useMemo(() => {
                const base2025 = filteredData.filter(d => d.Year === '2025');
                const base2026 = filteredData.filter(d => d.Year === '2026');
                return monthsList.map(m => {
                    const val2025 = base2025.filter(d => d.Month && d.Month.startsWith(m)).reduce((s, r) => s + (r.NetPrice || 0), 0);
                    const val2026 = base2026.filter(d => d.Month && d.Month.startsWith(m)).reduce((s, r) => s + (r.NetPrice || 0), 0);
                    return { name: m, sales25: val2025 === 0 ? null : val2025, sales26: val2026 === 0 ? null : val2026 };
                });
            }, [filteredData, monthsList]);

            const yAxisTicks = useMemo(() => {
                const maxVal = (trendChartData || []).reduce((max, d) => Math.max(max, d.sales25 || 0, d.sales26 || 0), 0);
                if (maxVal === 0) return [0, 5000000];
                const targetMax = maxVal * 1.15;
                const roughStep = targetMax / 4; 
                const magnitude = Math.pow(10, Math.floor(Math.log10(roughStep || 1)));
                const normalized = roughStep / magnitude;
                const niceNorm = normalized <= 1 ? 1 : (normalized <= 2 ? 2 : (normalized <= 2.5 ? 2.5 : (normalized <= 5 ? 5 : 10)));
                const step = niceNorm * magnitude;
                const maxTick = Math.ceil(targetMax / step) * step;
                const ticks = [];
                for (let current = 0; current <= maxTick + (step * 0.1); current += step) ticks.push(current);
                return ticks;
            }, [trendChartData]);

            const channelMix = useMemo(() => {
                const data = {};
                filteredData.filter(d => d.Year === '2026').forEach(d => { data[d.Channel || 'Unknown'] = (data[d.Channel || 'Unknown'] || 0) + (d.NetPrice || 0); });
                return Object.keys(data).map(k => ({ name: k, value: data[k] })).sort((a, b) => b.value - a.value);
            }, [filteredData]);

            const rawTopPerformers = useMemo(() => {
                const skuMap = {};
                const valid2026Months = new Set(salesData.filter(d => d.Year === '2026').map(d => d.Month?.split('-')[0]));
                filteredData.forEach(d => {
                    const key = d.GroupSKU || 'Unknown';
                    if (!skuMap[key]) skuMap[key] = { totalSales26: 0, totalSales25: 0, products: {}, channels: {} };
                    if (d.Year === '2026') {
                        skuMap[key].totalSales26 += (d.NetPrice || 0);
                        const pName = d.ProductName || 'Unknown';
                        if (!skuMap[key].products[pName]) skuMap[key].products[pName] = { val26: 0, val25: 0, channels: {} };
                        skuMap[key].products[pName].val26 += (d.NetPrice || 0);
                        const channelName = isChainBasedChannel(d.Channel) ? (d.SubChannel || 'Unknown') : (d.SoldToParty || 'Unknown');
                        skuMap[key].channels[channelName] = (skuMap[key].channels[channelName] || 0) + (d.NetPrice || 0);
                        skuMap[key].products[pName].channels[channelName] = (skuMap[key].products[pName].channels[channelName] || 0) + (d.NetPrice || 0);
                    } else if (d.Year === '2025') {
                        const monthPrefix = d.Month ? d.Month.split('-')[0] : '';
                        if (filterMonth !== 'All' || valid2026Months.has(monthPrefix)) {
                            skuMap[key].totalSales25 += (d.NetPrice || 0);
                            const pName = d.ProductName || 'Unknown';
                            if (!skuMap[key].products[pName]) skuMap[key].products[pName] = { val26: 0, val25: 0, channels: {} };
                            skuMap[key].products[pName].val25 += (d.NetPrice || 0);
                        }
                    }
                });
                return Object.entries(skuMap).map(([sku, data]) => {
                    const sortedProducts = Object.entries(data.products).map(([pName, pData]) => ({ name: pName, value: pData.val26, sales25: pData.val25, topChannels: getParetoTopItems(pData.channels) })).filter(p => p.value > 0 || p.sales25 > 0).sort((a, b) => b.value - a.value);
                    return { sku, name: sortedProducts.length > 0 ? sortedProducts[0].name : sku, value: data.totalSales26, sales25: data.totalSales25, allProducts: sortedProducts, topChannels: getParetoTopItems(data.channels) };
                }).filter(item => item.value > 0 || item.sales25 > 0);
            }, [filteredData, salesData, filterMonth]);

            const topPerformers = useMemo(() => {
                let list = [...(rawTopPerformers || [])];
                if (debouncedTopPerfSearch.length >= 2) list = list.filter(item => item.sku.toLowerCase().includes(debouncedTopPerfSearch.toLowerCase()) || item.name.toLowerCase().includes(debouncedTopPerfSearch.toLowerCase()));
                if (topPerfSortMode === 'yoy') return list.sort((a, b) => { const yoyA = a.sales25 > 0 ? (a.value - a.sales25) / a.sales25 : -Infinity; const yoyB = b.sales25 > 0 ? (b.value - b.sales25) / b.sales25 : -Infinity; return yoyB - yoyA; }).slice(0, 10);
                else return list.sort((a, b) => b.value - a.value).slice(0, 10);
            }, [rawTopPerformers, debouncedTopPerfSearch, topPerfSortMode]);

            const rawTopCustomers = useMemo(() => {
                const customerMap = {};
                const valid2026Months = new Set(salesData.filter(d => d.Year === '2026').map(d => d.Month?.split('-')[0]));
                filteredData.forEach(d => {
                    const customerName = ['MT', 'ONLINE'].includes(d.Channel?.toUpperCase() || '') ? (d.SubChannel || 'Unknown') : (d.SoldToParty || 'Unknown');
                    const key = `${customerName}|${d.Channel || 'Unknown'}`;
                    if (!customerMap[key]) customerMap[key] = { name: customerName, channel: d.Channel || 'Unknown', totalSales26: 0, totalSales25: 0, products: {}, productDetails: {} };
                    
                    const pName = d.ProductName || 'Unknown';
                    if (!customerMap[key].productDetails[pName]) customerMap[key].productDetails[pName] = { val26: 0, val25: 0 };

                    if (d.Year === '2026') {
                        customerMap[key].totalSales26 += (d.NetPrice || 0);
                        const prodKey = d.GroupSKU || 'Unknown';
                        customerMap[key].products[prodKey] = (customerMap[key].products[prodKey] || 0) + (d.NetPrice || 0);
                        customerMap[key].productDetails[pName].val26 += (d.NetPrice || 0);
                    } else if (d.Year === '2025') {
                        const monthPrefix = d.Month ? d.Month.split('-')[0] : '';
                        if (filterMonth !== 'All' || valid2026Months.has(monthPrefix)) {
                            customerMap[key].totalSales25 += (d.NetPrice || 0);
                            customerMap[key].productDetails[pName].val25 += (d.NetPrice || 0);
                        }
                    }
                });
                
                return Object.values(customerMap).filter(item => item.totalSales26 > 0 || item.totalSales25 > 0).map(item => {
                    const allProducts = Object.entries(item.productDetails).map(([name, data]) => ({ name, value: data.val26, sales25: data.val25 })).filter(p => p.value > 0 || p.sales25 > 0).sort((a, b) => b.value - a.value);
                    return { ...item, topProducts: getParetoTopItems(item.products), allProducts };
                });
            }, [filteredData, salesData, filterMonth]);

            const topCustomers = useMemo(() => {
                let list = [...(rawTopCustomers || [])];
                if (debouncedCustomerSearch.length >= 2) list = list.filter(item => item.name.toLowerCase().includes(debouncedCustomerSearch.toLowerCase()) || item.channel.toLowerCase().includes(debouncedCustomerSearch.toLowerCase()));
                if (topCustomerSortMode === 'yoy') return list.sort((a, b) => { const yoyA = a.totalSales25 > 0 ? (a.totalSales26 - a.totalSales25) / a.totalSales25 : -Infinity; const yoyB = b.totalSales25 > 0 ? (b.totalSales26 - b.totalSales25) / b.totalSales25 : -Infinity; return yoyB - yoyA; }).slice(0, 50);
                else return list.sort((a, b) => b.totalSales26 - a.totalSales26).slice(0, 50);
            }, [rawTopCustomers, debouncedCustomerSearch, topCustomerSortMode]);

            const uniqueCustomersCount = useMemo(() => {
                const unique = new Set();
                filteredData.filter(d => d.Year === '2026').forEach(d => {
                    const customerName = ['MT', 'ONLINE'].includes(d.Channel?.toUpperCase() || '') ? d.SubChannel : d.SoldToParty;
                    if (customerName) unique.add(`${customerName}|${d.Channel}`);
                });
                return unique.size;
            }, [filteredData]);

            const npdData = useMemo(() => {
                const productStats = {};
                const monthMap = { 'Jan': 0, 'Feb': 1, 'Mar': 2, 'Apr': 3, 'May': 4, 'Jun': 5, 'Jul': 6, 'Aug': 7, 'Sep': 8, 'Oct': 9, 'Nov': 10, 'Dec': 11 };
                
                salesData.forEach(d => {
                    const m = d.Month ? d.Month.substring(0, 3) : null;
                    if (!m || !d.ProductName) return;
                    const mIdx = monthMap[m];
                    if (mIdx === undefined) return;
                    const absMonth = (parseInt(d.Year) - 2025) * 12 + mIdx;
                    if (!productStats[d.ProductName]) productStats[d.ProductName] = { firstAbsMonth: absMonth };
                    else if (absMonth < productStats[d.ProductName].firstAbsMonth) productStats[d.ProductName].firstAbsMonth = absMonth;
                });

                let maxAbsMonth = 16; 
                const npdProducts = new Set();
                Object.entries(productStats).forEach(([pName, stats]) => { if (stats.firstAbsMonth >= (maxAbsMonth - 11)) npdProducts.add(pName); });

                let totalNPDSales26 = 0;
                const npdList = {};

                filteredData.filter(d => d.Year === '2026').forEach(d => {
                    if (npdProducts.has(d.ProductName)) {
                        totalNPDSales26 += (d.NetPrice || 0);
                        if (!npdList[d.ProductName]) npdList[d.ProductName] = { name: d.ProductName, sku: d.GroupSKU, sales26: 0, channels: {} };
                        npdList[d.ProductName].sales26 += (d.NetPrice || 0);
                    }
                });

                return {
                    totalNPDSales26,
                    topNPDs: Object.values(npdList).sort((a, b) => b.sales26 - a.sales26),
                    vitalityIndex: kpi.s26 > 0 ? (totalNPDSales26 / kpi.s26) * 100 : 0
                };
            }, [salesData, filteredData, kpi.s26]);

            return (
                <div className="min-h-screen pb-10 w-full relative">
                    <header className="bg-white/85 backdrop-blur-xl border-b border-black/5 sticky top-0 z-30 shadow-[0_1px_10px_rgba(0,0,0,0.02)]">
                        <div className="w-full px-6 py-3.5 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 min-h-[4rem]">
                            <div className="flex items-center gap-3 shrink-0">
                                <div className="bg-[#0071e3] p-1.5 rounded-lg shadow-sm">
                                    <Activity className="w-5 h-5 text-white" />
                                </div>
                                <h1 className="text-[19px] font-semibold tracking-tight text-[#1d1d1f]">Non-paper Performance Dashboard <span className="text-[#0071e3] font-bold">2026</span></h1>
                            </div>
                            <div className="flex flex-wrap items-center gap-3 w-full xl:w-auto justify-start xl:justify-end">
                                <div className="flex flex-wrap bg-[#e3e3e8] rounded-xl p-1 gap-1">
                                    {['ALL', ...GROUP_ORDER].map(group => (
                                        <button key={group} onClick={() => toggleGroup(group)} className={`px-4 py-1.5 text-sm font-medium rounded-[8px] transition-all ${selectedGroups.includes(group) ? 'bg-white text-[#1d1d1f] shadow-[0_1px_4px_rgba(0,0,0,0.12)]' : 'text-[#86868b] hover:text-[#1d1d1f]'}`}>
                                            {group}
                                        </button>
                                    ))}
                                </div>
                                <button onClick={() => syncAllData()} disabled={isSyncing} className={`flex items-center gap-2 text-white px-5 py-2 rounded-full text-sm font-semibold transition-all shrink-0 shadow-sm hover:shadow-md ${isSyncing ? 'bg-[#0071e3]/70 cursor-not-allowed' : 'bg-[#0071e3] hover:bg-[#0077ED] active:scale-95'}`}>
                                    <RefreshCw className={`w-4 h-4 ${isSyncing ? 'animate-spin' : ''}`} /> <span className="hidden md:inline">{isSyncing ? 'Syncing...' : 'Sync Data'}</span>
                                </button>
                            </div>
                        </div>
                        <div className="bg-white/50 border-t border-black/5 py-3 relative z-40">
                            <div className="w-full px-6 flex flex-wrap gap-4 items-center">
                                <span className="text-sm font-semibold text-[#86868b] flex items-center gap-2 tracking-wide"><Filter className="w-4 h-4" /> FILTERS:</span>
                                <FilterDropdown label="Product" value={filterSubProduct} options={[{val: 'All', group: null}, ...availableSubProducts]} onChange={setFilterSubProduct} icon={<ShoppingBag />} />
                                <FilterDropdown label="Channel" value={filterChannel} options={['All', ...availableChannels]} onChange={setFilterChannel} icon={<Users />} />
                                <FilterDropdown label="Month" value={filterMonth} options={['All', ...monthsList]} onChange={setFilterMonth} icon={<Calendar />} />
                                {(filterSubProduct !== 'All' || filterChannel !== 'All' || filterMonth !== 'All' || !selectedGroups.includes('ALL')) && (
                                    <button onClick={() => { setSelectedGroups(['ALL']); setFilterSubProduct('All'); setFilterChannel('All'); setFilterMonth('All'); }} className="text-sm text-[#ff3b30] hover:text-white font-medium ml-auto flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#ff3b30]/10 hover:bg-[#ff3b30] transition-colors">
                                        <X className="w-4 h-4" /> Clear All
                                    </button>
                                )}
                            </div>
                        </div>
                        <div className="bg-[#f5f5f7] px-6 py-2 border-t border-black/5 flex overflow-x-auto custom-scrollbar shadow-inner relative z-30">
                            <div className="flex bg-[#e3e3e8] p-1 rounded-xl w-max gap-1">
                                {tabs.map(tab => (
                                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-2 px-4 py-2 text-sm font-semibold rounded-[10px] transition-all whitespace-nowrap ${activeTab === tab.id ? 'bg-white text-[#1d1d1f] shadow-[0_1px_3px_rgba(0,0,0,0.1)]' : 'text-[#86868b] hover:text-[#1d1d1f] hover:bg-black/5'}`}>
                                        {tab.icon} {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </header>

                    <main className="w-full px-6 py-8 max-w-[1920px] mx-auto overflow-hidden">
                        {activeTab === 'Overview' && (
                            <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500 fill-mode-both">
                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-6">
                                    <SafeWidget><PortfolioSummaryWidget selectedGroups={selectedGroups} toggleGroup={toggleGroup} /></SafeWidget>
                                    <SafeWidget><KPIYTDWidget kpi={kpi} /></SafeWidget>
                                    <SafeWidget><KPITargetWidget kpi={kpi} /></SafeWidget>
                                    <SafeWidget><KPIForecastWidget kpi={kpi} showForecast={showForecast} setShowForecast={setShowForecast} /></SafeWidget>
                                    <SafeWidget><KPIPlanWidget kpi={kpi} /></SafeWidget>
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <SafeWidget><TrendChartWidget trendChartData={trendChartData} selectedGroups={selectedGroups} show2025Trend={show2025Trend} setShow2025Trend={setShow2025Trend} yAxisTicks={yAxisTicks} /></SafeWidget>
                                    <SafeWidget><ChannelMixWidget channelMix={channelMix} kpi={kpi} /></SafeWidget>
                                </div>
                                
                                {/* ย้าย Executive Summary มาด้านล่าง พร้อมระบบ Tap to view */}
                                <SafeWidget><ExecutiveSummaryWidget kpi={kpi} /></SafeWidget>
                            </div>
                        )}

                        {activeTab === 'Core' && (
                            <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500 fill-mode-both">
                                <div className="grid grid-cols-1 gap-6">
                                    <SafeWidget><PortfolioMixWidget filteredData={filteredData} monthsList={monthsList} /></SafeWidget>
                                </div>
                                <SafeWidget><ProductProfitabilityWidget filteredData={filteredData} /></SafeWidget>
                                <SafeWidget><TopPerformersWidget topPerformers={topPerformers} topPerfDrillDown={topPerfDrillDown} setTopPerfDrillDown={setTopPerfDrillDown} topPerfSearch={topPerfSearch} setTopPerfSearch={setTopPerfSearch} topPerfSortMode={topPerfSortMode} setTopPerfSortMode={setTopPerfSortMode} kpi={kpi} /></SafeWidget>
                                <SafeWidget><SkuHealthWidget filteredData={filteredData} /></SafeWidget>
                            </div>
                        )}

                        {activeTab === 'Innovation' && (
                            <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500 fill-mode-both">
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <SafeWidget><NPDVitalityWidget npdData={npdData} kpi={kpi} /></SafeWidget>
                                    <SafeWidget><TopNPDWidget npdData={npdData} /></SafeWidget>
                                    <SafeWidget><NPDTrajectoryWidget salesData={salesData} npdData={npdData} /></SafeWidget>
                                </div>
                            </div>
                        )}

                        {activeTab === 'Distribution' && (
                            <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500 fill-mode-both">
                                <SafeWidget><TopCustomersWidget topCustomers={topCustomers} uniqueCustomersCount={uniqueCustomersCount} customerSearch={customerSearch} setCustomerSearch={setCustomerSearch} topCustomerSortMode={topCustomerSortMode} setTopCustomerSortMode={setTopCustomerSortMode} kpi={kpi} topCustomerDrillDown={topCustomerDrillDown} setTopCustomerDrillDown={setTopCustomerDrillDown} /></SafeWidget>
                                <SafeWidget><ProductPresenceWidget filteredData={filteredData} /></SafeWidget>
                                <SafeWidget><WhiteSpaceWidget filteredData={filteredData} searchStr={whiteSpaceSearch} setSearchStr={setWhiteSpaceSearch} debouncedSearch={debouncedWhiteSpaceSearch} /></SafeWidget>
                            </div>
                        )}
                        <footer className="w-full text-center pt-8 pb-4 text-[#86868b] font-medium text-sm">Developed by NPD Team - Version 1.3.1 (Safe Mode)</footer>
                    </main>

                    {showUpload && (
                        <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 backdrop-blur-md animate-in fade-in duration-200">
                            <div className="bg-white/95 backdrop-blur-xl rounded-[24px] shadow-2xl w-full max-w-lg overflow-hidden border border-white/20">
                                <div className="flex justify-between items-center p-5 border-b border-black/5 relative">
                                    <h2 className="text-lg font-semibold text-[#1d1d1f] w-full text-center tracking-tight">Data Sync Status</h2>
                                    <button onClick={() => setShowUpload(false)} className="text-[#86868b] hover:text-[#1d1d1f] absolute right-5 bg-[#e8e8ed] hover:bg-[#d1d1d6] p-1.5 rounded-full transition-colors"><X className="w-4 h-4" /></button>
                                </div>
                                <div className="flex border-b border-black/5 overflow-x-auto custom-scrollbar px-2 pt-2">
                                    {GROUP_ORDER.map(tab => (
                                        <button key={tab} onClick={() => setUploadTab(tab)} className={`flex-1 py-2 px-4 text-xs font-semibold transition-all mb-2 rounded-full whitespace-nowrap ${uploadTab === tab ? 'text-[#1d1d1f] bg-[#e8e8ed]' : 'text-[#86868b] hover:text-[#1d1d1f] hover:bg-[#f5f5f7]'}`}>{tab}</button>
                                    ))}
                                </div>
                                <div className="p-6 space-y-3 bg-[#f5f5f7]/50">
                                    <SyncStatusSlot label="Sales 2025" status={filesStatus[uploadTab]?.s25 || 'pending'} />
                                    <SyncStatusSlot label="Sales 2026" status={filesStatus[uploadTab]?.s26 || 'pending'} />
                                    <SyncStatusSlot label="Budget Channel" status={filesStatus[uploadTab]?.bCh || 'pending'} />
                                    <SyncStatusSlot label="Budget Product" status={filesStatus[uploadTab]?.bPr || 'pending'} />
                                </div>
                                <div className="p-5 bg-white border-t border-black/5 flex flex-col gap-4">
                                    <div className="text-[11px] text-[#86868b] flex justify-center items-center gap-1.5 font-medium uppercase tracking-wider">
                                        <div className={`w-1.5 h-1.5 rounded-full ${isSyncing ? 'bg-[#ff9500] animate-pulse' : 'bg-[#34c759]'}`}></div> Live from Google Sheets
                                    </div>
                                    <button onClick={() => setShowUpload(false)} className="bg-[#0071e3] hover:bg-[#0077ED] text-white px-6 py-3 rounded-[14px] text-base font-semibold w-full shadow-md active:scale-95 transition-transform">Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
