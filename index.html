<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-paper Performance Dashboard 2026</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Scrollbar Style to match component classes -->
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        body {
            background-color: #f8fafc;
        }
    </style>

    <!-- FIX: Disable AMD and CommonJS loaders to force UMD scripts to expose global variables natively -->
    <script>
        window.__define = window.define;
        window.__require = window.require;
        window.__module = window.module;
        window.__exports = window.exports;
        
        window.define = undefined;
        window.require = undefined;
        window.module = undefined;
        window.exports = undefined;
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- FIX: Ensure lowercase "react" is available globally for Recharts/Lucide dependencies -->
    <script>
        window.react = window.React;
        window['react-dom'] = window.ReactDOM;
    </script>

    <!-- Babel for in-browser JSX/TS transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Prop Types (Required by Recharts) -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    
    <!-- PapaParse for CSV fetching -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- Lucide React Icons -->
    <script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.min.js"></script>

    <!-- FIX: Restore loaders for the environment -->
    <script>
        if (window.__define !== undefined) window.define = window.__define;
        if (window.__require !== undefined) window.require = window.__require;
        if (window.__module !== undefined) window.module = window.__module;
        if (window.__exports !== undefined) window.exports = window.__exports;
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react,typescript">
        const { useState, useMemo, useEffect, useRef } = React;
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, 
            PieChart, Pie, Cell, AreaChart, Area, LineChart, Line, ComposedChart, LabelList 
        } = window.Recharts;
        
        // Safely extract Lucide icons with a Proxy fallback to guarantee no destructuring crashes
        const lucideGlobal = window.lucide || window.Lucide || window.lucideReact || window.LucideReact || {};
        const LucideProxy = new Proxy(lucideGlobal, {
            get: function(target, prop) {
                if (prop in target) return target[prop];
                if (typeof prop !== 'string') return undefined; // Ignore symbols like React devtools hooks
                
                // Return a graceful fallback icon if the requested icon is missing or library failed to load
                return (props) => React.createElement('svg', {
                    width: 24, height: 24, viewBox: '0 0 24 24', fill: 'none',
                    stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round',
                    ...props
                }, 
                React.createElement('circle', { cx: 12, cy: 12, r: 10 }), 
                React.createElement('line', { x1: 12, y1: 8, x2: 12, y2: 12 }), 
                React.createElement('line', { x1: 12, y1: 16, x2: 12.01, y2: 16 }));
            }
        });

        const { 
            Upload, TrendingUp, Target, Users, DollarSign, LayoutDashboard, Activity,
            PieChart: PieIcon, X, Search, ChevronDown, Calendar, Layers, ShoppingBag, 
            Trophy, Medal, Store, ArrowLeft, Grid3X3, AlertCircle, MapPin, Lightbulb, Sparkles, ArrowRightCircle, Package, Check,
            RefreshCw, Database, CheckCircle2, XCircle, Info, ArrowDown
        } = LucideProxy;

        // --- Hooks ---
        function useDebounce(value, delay) {
            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => {
                const handler = setTimeout(() => setDebouncedValue(value), delay);
                return () => clearTimeout(handler);
            }, [value, delay]);
            return debouncedValue;
        }

        // --- Helpers ---
        const cleanCurrency = (val) => {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            return parseFloat(val.toString().replace(/[฿",]/g, '').trim()) || 0;
        };

        const isChainBasedChannel = (channel) => {
            const upper = channel?.toUpperCase() || '';
            return ['MT', 'INTER COMPANY', 'ONLINE', 'BJC'].includes(upper);
        };

        // Algorithm to ensure perfectly even gaps on Y-Axis with ~15% headroom
        const getNiceMax = (dataMax) => {
            if (!dataMax || dataMax === 0) return 1000000;
            const target = dataMax * 1.15;
            const magnitude = Math.pow(10, Math.floor(Math.log10(target)));
            const normalized = target / magnitude;
            
            let nice;
            if (normalized <= 1) nice = 1;
            else if (normalized <= 1.2) nice = 1.2;
            else if (normalized <= 1.5) nice = 1.5;
            else if (normalized <= 2) nice = 2;
            else if (normalized <= 2.5) nice = 2.5;
            else if (normalized <= 3) nice = 3;
            else if (normalized <= 4) nice = 4;
            else if (normalized <= 5) nice = 5;
            else if (normalized <= 6) nice = 6;
            else if (normalized <= 8) nice = 8;
            else nice = 10;
            
            return nice * magnitude;
        };

        const DATA_SOURCES = {
            'DACARE': {
                s25: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTkxkoPt95gqqDZMeYvcSTFY5xSTLNUtoMqpUbMNLo92Ui447TqEPoXiUNs5XPIHvsR2n-L6CAtB3QF/pub?gid=0&single=true&output=csv',
                s26: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTkxkoPt95gqqDZMeYvcSTFY5xSTLNUtoMqpUbMNLo92Ui447TqEPoXiUNs5XPIHvsR2n-L6CAtB3QF/pub?gid=840326660&single=true&output=csv',
                bCh: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTkxkoPt95gqqDZMeYvcSTFY5xSTLNUtoMqpUbMNLo92Ui447TqEPoXiUNs5XPIHvsR2n-L6CAtB3QF/pub?gid=676992950&single=true&output=csv',
                bPr: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTkxkoPt95gqqDZMeYvcSTFY5xSTLNUtoMqpUbMNLo92Ui447TqEPoXiUNs5XPIHvsR2n-L6CAtB3QF/pub?gid=1671676832&single=true&output=csv'
            },
            'DAOS': {
                s25: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTqXyVL3DuTVqQnP8o7oZ-fQIU7wIeeRtRkcSbUkRHn4XTKHM-0-Xf43YqSsSUMX-7l3UHTro3XxRgu/pub?gid=0&single=true&output=csv',
                s26: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTqXyVL3DuTVqQnP8o7oZ-fQIU7wIeeRtRkcSbUkRHn4XTKHM-0-Xf43YqSsSUMX-7l3UHTro3XxRgu/pub?gid=1788634359&single=true&output=csv',
                bCh: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTqXyVL3DuTVqQnP8o7oZ-fQIU7wIeeRtRkcSbUkRHn4XTKHM-0-Xf43YqSsSUMX-7l3UHTro3XxRgu/pub?gid=1758041911&single=true&output=csv',
                bPr: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTqXyVL3DuTVqQnP8o7oZ-fQIU7wIeeRtRkcSbUkRHn4XTKHM-0-Xf43YqSsSUMX-7l3UHTro3XxRgu/pub?gid=323060654&single=true&output=csv'
            },
            'DABATTERY': {
                s25: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS29e0vG5YtTyMMPjUDyn23E6RtjI2c5dHJ4o_bfRu0qQutiuIZ_ifgh6gwnRVb2_sxImgOCsgyRLRg/pub?gid=0&single=true&output=csv',
                s26: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS29e0vG5YtTyMMPjUDyn23E6RtjI2c5dHJ4o_bfRu0qQutiuIZ_ifgh6gwnRVb2_sxImgOCsgyRLRg/pub?gid=1788634359&single=true&output=csv',
                bCh: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS29e0vG5YtTyMMPjUDyn23E6RtjI2c5dHJ4o_bfRu0qQutiuIZ_ifgh6gwnRVb2_sxImgOCsgyRLRg/pub?gid=1758041911&single=true&output=csv',
                bPr: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS29e0vG5YtTyMMPjUDyn23E6RtjI2c5dHJ4o_bfRu0qQutiuIZ_ifgh6gwnRVb2_sxImgOCsgyRLRg/pub?gid=323060654&single=true&output=csv'
            },
            'DASP&Q': {
                s25: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSc4GaqFG4Fn7_bkeKyEbmBRPW810BBiWz9AaBu5ufMRBigl9_EP0yrD6hRdtD80KO0dii9pEMPAUEa/pub?gid=1670436585&single=true&output=csv',
                s26: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSc4GaqFG4Fn7_bkeKyEbmBRPW810BBiWz9AaBu5ufMRBigl9_EP0yrD6hRdtD80KO0dii9pEMPAUEa/pub?gid=632732784&single=true&output=csv',
                bCh: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSc4GaqFG4Fn7_bkeKyEbmBRPW810BBiWz9AaBu5ufMRBigl9_EP0yrD6hRdtD80KO0dii9pEMPAUEa/pub?gid=2001882698&single=true&output=csv',
                bPr: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSc4GaqFG4Fn7_bkeKyEbmBRPW810BBiWz9AaBu5ufMRBigl9_EP0yrD6hRdtD80KO0dii9pEMPAUEa/pub?gid=503774950&single=true&output=csv'
            },
            'DALIFESTYLE': {
                s25: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWNuYqkCH8Z7pIvXMwJOnK0iwEb3kyTrJj_nF2A2WwluWOtrvFKRxiiSCLX81AgB4PJf3sZYD7lkwO/pub?gid=1241849681&single=true&output=csv',
                s26: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWNuYqkCH8Z7pIvXMwJOnK0iwEb3kyTrJj_nF2A2WwluWOtrvFKRxiiSCLX81AgB4PJf3sZYD7lkwO/pub?gid=1151038683&single=true&output=csv',
                bCh: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWNuYqkCH8Z7pIvXMwJOnK0iwEb3kyTrJj_nF2A2WwluWOtrvFKRxiiSCLX81AgB4PJf3sZYD7lkwO/pub?gid=228153519&single=true&output=csv',
                bPr: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWNuYqkCH8Z7pIvXMwJOnK0iwEb3kyTrJj_nF2A2WwluWOtrvFKRxiiSCLX81AgB4PJf3sZYD7lkwO/pub?gid=1341247115&single=true&output=csv'
            }
        };

        // --- Optimized Fetching with Web Worker ---
        const fetchCSV = (url) => {
            if (!url) return Promise.reject(new Error('No URL provided'));
            return new Promise((resolve, reject) => {
                window.Papa.parse(url, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    worker: true, // Optimize: Use background thread to unblock UI
                    complete: (results) => resolve(results.data),
                    error: (error) => reject(error)
                });
            });
        };

        // --- Sub-components ---
        const FilterDropdown = ({ label, value, options, onChange, icon }) => {
            const [isOpen, setIsOpen] = useState(false);
            const dropdownRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setIsOpen(false);
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            return (
                <div className="relative" ref={dropdownRef}>
                    <button onClick={() => setIsOpen(!isOpen)} className="flex items-center gap-2 text-sm font-medium text-slate-800 bg-white border border-slate-300 px-3 py-2 rounded hover:border-blue-500 hover:text-blue-700 transition-colors shadow-sm min-w-[160px] justify-between">
                        <div className="flex items-center gap-2">{icon}<span className="text-slate-600">{label}:</span><span className="text-blue-700 font-bold truncate max-w-[100px]">{value}</span></div>
                        <ChevronDown className={`w-4 h-4 text-slate-500 transition-transform ${isOpen ? 'rotate-180' : ''}`} />
                    </button>
                    {isOpen && (
                        <div className="absolute top-full left-0 mt-1 w-64 bg-white border border-slate-200 rounded-lg shadow-xl z-50 max-h-72 overflow-y-auto animate-in fade-in zoom-in-95 duration-100">
                            <div className="sticky top-0 bg-slate-100 px-4 py-2 text-xs font-semibold text-slate-700 uppercase tracking-wider border-b border-slate-200">Select {label}</div>
                            {options.length > 0 ? options.map((opt) => (
                                <button key={opt} className={`w-full text-left px-4 py-3 text-sm font-medium hover:bg-blue-50 transition-colors flex justify-between items-center ${opt === value ? 'text-blue-700 font-bold bg-blue-50/50' : 'text-slate-700'}`} onClick={() => { onChange(opt); setIsOpen(false); }}>
                                    {opt}{opt === value && <div className="w-2 h-2 rounded-full bg-blue-600"></div>}
                                </button>
                            )) : <div className="px-4 py-3 text-sm text-slate-500 text-center italic font-medium">No options available</div>}
                        </div>
                    )}
                </div>
            );
        };

        const SyncStatusSlot = ({ label, status }) => {
            let statusColor = 'bg-slate-300';
            let statusText = 'Pending';
            let icon = null;
            
            if (status === 'loading') {
                statusColor = 'bg-blue-400 animate-pulse';
                statusText = 'Syncing...';
                icon = <RefreshCw className="w-3.5 h-3.5 text-blue-500 animate-spin" />;
            } else if (status === 'success') {
                statusColor = 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.4)]';
                statusText = 'Synced';
                icon = <CheckCircle2 className="w-3.5 h-3.5 text-green-600" />;
            } else if (status === 'error') {
                statusColor = 'bg-red-500';
                statusText = 'Failed';
                icon = <XCircle className="w-3.5 h-3.5 text-red-600" />;
            }

            return (
                <div className={`flex items-center justify-between p-3 rounded-lg border border-slate-200 transition-all ${status === 'success' ? 'bg-green-50/50 border-green-200' : (status === 'error' ? 'bg-red-50/50 border-red-200' : 'bg-white')}`}>
                    <div className="flex items-center gap-3">
                        <div className={`w-2.5 h-2.5 rounded-full ${statusColor}`}></div>
                        <span className="text-sm font-medium text-slate-700">{label}</span>
                    </div>
                    <div className="flex items-center gap-1.5">
                        {icon}
                        <span className={`text-xs font-bold ${status === 'success' ? 'text-green-700' : (status === 'error' ? 'text-red-700' : 'text-slate-500')}`}>
                            {statusText}
                        </span>
                    </div>
                </div>
            );
        };

        // --- Main Component ---
        function Dashboard() {
            const [salesData, setSalesData] = useState([]);
            const [budgetChannel, setBudgetChannel] = useState([]);
            const [budgetProduct, setBudgetProduct] = useState([]);
            
            const [selectedGroup, setSelectedGroup] = useState('ALL'); 
            const [showUpload, setShowUpload] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            
            // Search States
            const [topPerfSearch, setTopPerfSearch] = useState('');
            const [coverageSearch, setCoverageSearch] = useState('');
            const [customerSearch, setCustomerSearch] = useState('');

            // Debounce
            const debouncedTopPerfSearch = useDebounce(topPerfSearch, 300);
            const debouncedCoverageSearch = useDebounce(coverageSearch, 300);
            const debouncedCustomerSearch = useDebounce(customerSearch, 300);
            
            // Sort States
            const [topPerfSortMode, setTopPerfSortMode] = useState('sales'); // 'sales' | 'yoy'
            const [topCustomerSortMode, setTopCustomerSortMode] = useState('sales'); // 'sales' | 'yoy'

            const [filterSubProduct, setFilterSubProduct] = useState('All');
            const [filterChannel, setFilterChannel] = useState('All');
            const [filterMonth, setFilterMonth] = useState('All');
            
            const [coverageDrillChannel, setCoverageDrillChannel] = useState(null);
            const [topPerfDrillDown, setTopPerfDrillDown] = useState(null);
            
            // Status for 5 groups x 4 files = 20 files
            const [filesStatus, setFilesStatus] = useState({
                DACARE: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DAOS: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DABATTERY: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                'DASP&Q': { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DALIFESTYLE: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
            });
            const [uploadTab, setUploadTab] = useState('DACARE');

            const dashboardRef = useRef(null);

            const syncAllData = async () => {
                if (isSyncing) return;
                setIsSyncing(true);
                setShowUpload(true); // Open monitor

                let initialStatus = { ...filesStatus };
                for (const groupName of Object.keys(DATA_SOURCES)) {
                    initialStatus[groupName] = { s25: 'loading', s26: 'loading', bCh: 'loading', bPr: 'loading' };
                }
                setFilesStatus(initialStatus);

                // Optimize: Fetch ALL groups concurrently instead of sequential loop
                const groupPromises = Object.entries(DATA_SOURCES).map(async ([groupName, sources]) => {
                    let groupSales = [];
                    let groupBudgetChannel = [];
                    let groupBudgetProduct = [];

                    try {
                        const [s25Raw, s26Raw, bChRaw, bPrRaw] = await Promise.all([
                            fetchCSV(sources.s25).catch(() => null),
                            fetchCSV(sources.s26).catch(() => null),
                            fetchCSV(sources.bCh).catch(() => null),
                            fetchCSV(sources.bPr).catch(() => null)
                        ]);

                        if (s25Raw) {
                            const mapped = s25Raw.map(row => ({
                                Month: row['Month'], ProductGroup: groupName, Channel: row['Channel'], SubChannel: row['Sub-channel'] || row['Sub-Channel'],
                                SoldToParty: row['Sold-to party'] || row['Sold-To Party'], MaterialNumber: row['Material Number'], ProductName: row['Product Name'],
                                SubProductGroup: row['Sub-product group'] || row['Sub-Product Group'], GroupSKU: row['Group SKU'] || row['Sub-product group'] || row['Sub-Product Group'],
                                NetPrice: cleanCurrency(row['Net Price']), Year: '2025'
                            })).filter(r => r.ProductGroup && r.Month);
                            groupSales = groupSales.concat(mapped);
                            setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], s25: 'success' } }));
                        } else setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], s25: 'error' } }));

                        if (s26Raw) {
                            const mapped = s26Raw.map(row => ({
                                Month: row['Month'], ProductGroup: groupName, Channel: row['Channel'], SubChannel: row['Sub-channel'] || row['Sub-Channel'],
                                SoldToParty: row['Sold-to party'] || row['Sold-To Party'], MaterialNumber: row['Material Number'], ProductName: row['Product Name'],
                                SubProductGroup: row['Sub-product group'] || row['Sub-Product Group'], GroupSKU: row['Group SKU'] || row['Sub-product group'] || row['Sub-Product Group'],
                                NetPrice: cleanCurrency(row['Net Price']), Year: '2026'
                            })).filter(r => r.ProductGroup && r.Month);
                            groupSales = groupSales.concat(mapped);
                            setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], s26: 'success' } }));
                        } else setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], s26: 'error' } }));

                        if (bChRaw) {
                            const mapped = bChRaw.map(row => ({
                                ProductGroup: groupName, Channel: row['Channel'], 
                                Target2026: cleanCurrency(row['Target 2026 (Plan)'] || row['Target 2026 (Budget)'] || row['Target 2026']),
                                Plan2027: cleanCurrency(row['Target 2027 (Plan)'] || row['Target 2027 (Budget)'] || row['Plan 2027'] || 0),
                                Forecast2026: cleanCurrency(row['L.E. 2026 (Forecast)'] || row['Forecast 2026'] || row['L.E. 2026'] || 0)
                            })).filter(r => r.Channel && r.Channel !== 'TOTAL');
                            groupBudgetChannel = groupBudgetChannel.concat(mapped);
                            setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], bCh: 'success' } }));
                        } else setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], bCh: 'error' } }));

                        if (bPrRaw) {
                            const mapped = bPrRaw.map(row => ({
                                ProductGroup: groupName, SubProductGroup: row['Sub-product Group'] || row['Sub-Product Group'], 
                                Target2026: cleanCurrency(row['Target 2026 (Plan)'] || row['Target 2026 (Budget)'] || row['Target 2026']),
                                Plan2027: cleanCurrency(row['Target 2027 (Plan)'] || row['Target 2027 (Budget)'] || row['Plan 2027'] || 0),
                                Forecast2026: cleanCurrency(row['L.E. 2026 (Forecast)'] || row['Forecast 2026'] || row['L.E. 2026'] || 0)
                            })).filter(r => r.SubProductGroup && r.SubProductGroup !== 'TOTAL');
                            groupBudgetProduct = groupBudgetProduct.concat(mapped);
                            setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], bPr: 'success' } }));
                        } else setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], bPr: 'error' } }));

                        return { groupSales, groupBudgetChannel, groupBudgetProduct };

                    } catch (error) {
                        console.error(`Unexpected error syncing ${groupName}:`, error);
                        setFilesStatus(prev => ({ ...prev, [groupName]: { s25: 'error', s26: 'error', bCh: 'error', bPr: 'error' } }));
                        return { groupSales: [], groupBudgetChannel: [], groupBudgetProduct: [] };
                    }
                });

                // Wait for all groups to process simultaneously
                const results = await Promise.all(groupPromises);

                let finalSales = [];
                let finalBudgetChannel = [];
                let finalBudgetProduct = [];

                results.forEach(res => {
                    finalSales = finalSales.concat(res.groupSales);
                    finalBudgetChannel = finalBudgetChannel.concat(res.groupBudgetChannel);
                    finalBudgetProduct = finalBudgetProduct.concat(res.groupBudgetProduct);
                });

                setSalesData(finalSales);
                setBudgetChannel(finalBudgetChannel);
                setBudgetProduct(finalBudgetProduct);
                setIsSyncing(false);
                setTimeout(() => setShowUpload(false), 1500); // Auto close cleanly
            };

            // Auto-fetch on mount
            useEffect(() => {
                syncAllData();
            }, []);

            const availableSubProducts = useMemo(() => {
                const base = selectedGroup === 'ALL' ? salesData : salesData.filter(d => d.ProductGroup === selectedGroup);
                return Array.from(new Set(base.map(d => d.SubProductGroup || '').filter(Boolean))).sort();
            }, [salesData, selectedGroup]);

            const kpi = useMemo(() => {

                    .filter(d => d.Year === '2025' && filterFn(d) && monthsPresentIn2026.has(d.Month.split('-')[0]))

                        plan27 = relevant.reduce((a,b) => a + b.Plan2027, 0);

                } else if (isChannelFiltered) {
                    const relevant = budgetChannel.filter(b => (selectedGroup === 'ALL' || b.ProductGroup === selectedGroup) && b.Channel === filterChannel);

                            if (isChainBasedChannel(col)) colUniqueItemsForHeader[col].add(d.SubChannel);

                        }

                                    </div>
                                    <button onClick={() => setShowUpload(false)} className="bg-slate-900 hover:bg-slate-800 text-white px-6 py-2.5 rounded-lg text-sm font-medium transition-colors shadow-sm">
                                        {isSyncing ? 'Running in background...' : 'Close'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
