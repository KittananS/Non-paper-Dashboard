            const [customerSearch, setCustomerSearch] = useState('');

            const debouncedTopPerfSearch = useDeferredValue(topPerfSearch);
            const debouncedWhiteSpaceSearch = useDeferredValue(whiteSpaceSearch);
            const debouncedCustomerSearch = useDeferredValue(customerSearch);
            
            const [topPerfSortMode, setTopPerfSortMode] = useState('sales');
            const [topCustomerSortMode, setTopCustomerSortMode] = useState('sales');

            const [filterSubProduct, setFilterSubProduct] = useState('All');
            const [filterChannel, setFilterChannel] = useState('All');
            const [filterMonth, setFilterMonth] = useState(MONTHS_LIST); 
            
            const [topPerfDrillDown, setTopPerfDrillDown] = useState(null);
            const [topCustomerDrillDown, setTopCustomerDrillDown] = useState(null);
            
            const [filesStatus, setFilesStatus] = useState({
                DACARE: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DATISSUE: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DAOS: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DABATTERY: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DASP: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DANB: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                QUALITY: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DALIFESTYLE: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
            });
            const [uploadTab, setUploadTab] = useState('DACARE');

            const syncAllData = useCallback(async () => {
                if (isSyncing) return;
                setIsSyncing(true);
                setShowUpload(true);

                requestCache.clear();

                let initialStatus = { ...filesStatus };
                for (const groupName of Object.keys(DATA_SOURCES)) initialStatus[groupName] = { s25: 'loading', s26: 'loading', bCh: 'loading', bPr: 'loading' };
                setFilesStatus(initialStatus);

                let finalSales = [], finalBudgetChannel = [], finalBudgetProduct = [];

                const urlTasks = { s25: {}, s26: {}, bCh: {}, bPr: {} };
                Object.entries(DATA_SOURCES).forEach(([groupName, sources]) => {
                    if (sources.s25) { urlTasks.s25[sources.s25] = urlTasks.s25[sources.s25] || []; urlTasks.s25[sources.s25].push(groupName); }
                    if (sources.s26) { urlTasks.s26[sources.s26] = urlTasks.s26[sources.s26] || []; urlTasks.s26[sources.s26].push(groupName); }
                    if (sources.bCh) { urlTasks.bCh[sources.bCh] = urlTasks.bCh[sources.bCh] || []; urlTasks.bCh[sources.bCh].push(groupName); }
                    if (sources.bPr) { urlTasks.bPr[sources.bPr] = urlTasks.bPr[sources.bPr] || []; urlTasks.bPr[sources.bPr].push(groupName); }
                });

                const fetchAndProcess = async (url, targetGroups, type) => {
                    try {
                        const rawData = await fetchCSV(url);
                        if (!rawData) throw new Error('Empty Data');

                        for (let i = 0; i < rawData.length; i++) {
                            const row = rawData[i];
                            const rawGrp = row['Product Group'] || row['ProductGroup'];
                            const groupName = rawGrp ? rawGrp.toUpperCase().trim() : '';

                            if (!targetGroups.includes(groupName)) continue; 

                            if (type === 's25' || type === 's26') {
                                if (row['Product Name'] && row['Month']) {
                                    finalSales.push({
                                        Month: row['Month'], ProductGroup: groupName, 
                                        Channel: normalizeText(row['Channel'], 'channel'), 
                                        SubChannel: normalizeText(row['Sub-channel'] || row['Sub-Channel'], 'channel'),
                                        SoldToParty: normalizeText(row['Sold-to party'] || row['Sold-To Party'], 'customer'), 
                                        MaterialNumber: row['Material Number'], 
                                        ProductName: normalizeText(row['Product Name'], 'product'),
                                        SubProductGroup: normalizeText(row['Sub-product group'] || row['Sub-Product Group'], 'subgroup'), 
                                        GroupSKU: normalizeText(row['Group SKU'] || row['Sub-product group'] || row['Sub-Product Group'], 'sku'),
                                        NetPrice: cleanCurrency(row['Net Price']), 
                                        Cost: cleanCurrency(row['Cost'] || row['COGS'] || row['Standard Cost'] || row['Total Cost'] || row['Standard Price'] || 0),
                                        Quantity: cleanCurrency(row['Quantity'] || row['Qty'] || 0),
                                        BaseUnit: (row['Base Unit'] || row['BaseUnit'] || row['UOM'] || 'PC').toString().toUpperCase().trim(),
                                        Year: type === 's25' ? '2025' : '2026'
                                    });
                                }
                            } else if (type === 'bCh') {
                                const rawCh = row['Channel'] ? row['Channel'].toString().toUpperCase().trim() : '';
                                if (rawCh && rawCh !== 'TOTAL') {
                                    finalBudgetChannel.push({
                                        ProductGroup: groupName, 
                                        Channel: normalizeText(row['Channel'], 'channel'), 
                                        Target2026: cleanCurrency(row['Target 2026 (Plan)'] || row['Target 2026 (Budget)'] || row['Target 2026']),
                                        Plan2027: cleanCurrency(row['Target 2027 (Plan)'] || row['Target 2027 (Budget)'] || row['Plan 2027'] || 0),
                                        Forecast2026: cleanCurrency(row['L.E. 2026 (Forecast)'] || row['Forecast 2026'] || row['L.E. 2026'] || 0)
                                    });
                                }
                            } else if (type === 'bPr') {
                                const subGroup = row['Sub-product Group'] || row['Sub-Product Group'];
                                const cleanSubGrp = subGroup ? subGroup.toString().toUpperCase().trim() : '';
                                if (cleanSubGrp && cleanSubGrp !== 'TOTAL') {
                                    finalBudgetProduct.push({
                                        ProductGroup: groupName, 
                                        SubProductGroup: normalizeText(subGroup, 'subgroup'), 
                                        Target2026: cleanCurrency(row['Target 2026 (Plan)'] || row['Target 2026 (Budget)'] || row['Target 2026']),
                                        Plan2027: cleanCurrency(row['Target 2027 (Plan)'] || row['Target 2027 (Budget)'] || row['Plan 2027'] || 0),
                                        Forecast2026: cleanCurrency(row['L.E. 2026 (Forecast)'] || row['Forecast 2026'] || row['L.E. 2026'] || 0)
                                    });
                                }
                            }
                        }

                        setFilesStatus(prev => {
                            const next = { ...prev };
                            targetGroups.forEach(g => { next[g] = { ...next[g], [type]: 'success' }; });
                            return next;
                        });
                    } catch (error) {
                        console.error(`Sync Error [${type}]:`, error);
                        setFilesStatus(prev => {
                            const next = { ...prev };
                            targetGroups.forEach(g => { next[g] = { ...next[g], [type]: 'error' }; });
                            return next;
                        });
                    }
                };

                const promises = [];
                Object.entries(urlTasks).forEach(([type, urls]) => {
                    Object.entries(urls).forEach(([url, groups]) => {
                        promises.push(fetchAndProcess(url, groups, type));
                    });
                });

                await Promise.all(promises);

                startTransition(() => {
                    setSalesData(finalSales);
                    setBudgetChannel(finalBudgetChannel);
                    setBudgetProduct(finalBudgetProduct);
                });
                setIsSyncing(false);
                setTimeout(() => setShowUpload(false), 1200);
            }, [isSyncing, filesStatus]);

            useEffect(() => { syncAllData(); }, []);

            const toggleGroup = useCallback((group) => {
                startTransition(() => {
                    if (group === 'ALL') setSelectedGroups(['ALL']);
                    else {
                        let newGroups = selectedGroups.filter(g => g !== 'ALL');
                        if (newGroups.includes(group)) {
                            newGroups = newGroups.filter(g => g !== group);
                            if (newGroups.length === 0) newGroups = ['ALL'];
                        } else newGroups.push(group);
                        newGroups.sort((a, b) => GROUP_ORDER.indexOf(a) - GROUP_ORDER.indexOf(b));
                        setSelectedGroups(newGroups);
                    }
                    setFilterSubProduct('All');
                });
            }, [selectedGroups]);

            const handleFilterChange = useCallback((setter) => (val) => {
                startTransition(() => setter(val));
            }, []);

            const availableSubProducts = useMemo(() => {
                const base = selectedGroups.includes('ALL') ? salesData : salesData.filter(d => selectedGroups.includes(d.ProductGroup));
                const subProdMap = new Map();
                base.forEach(d => { if (d.SubProductGroup && !subProdMap.has(d.SubProductGroup)) subProdMap.set(d.SubProductGroup, d.ProductGroup); });
                const list = Array.from(subProdMap.entries()).map(([name, group]) => ({ val: name, group }));
                list.sort((a, b) => {
                    const gA = GROUP_ORDER.indexOf(a.group), gB = GROUP_ORDER.indexOf(b.group);
                    if (gA !== gB) return gA - gB;
                    return a.val.localeCompare(b.val);
                });
                return list;
            }, [salesData, selectedGroups]);

            const availableChannels = useMemo(() => {
                const base = selectedGroups.includes('ALL') ? salesData : salesData.filter(d => selectedGroups.includes(d.ProductGroup));
                const channelSalesMap = {};
                base.forEach(d => {
                    if (d.Channel && d.Year === '2026') channelSalesMap[d.Channel] = (channelSalesMap[d.Channel] || 0) + (d.NetPrice || 0);
                });
                return Object.entries(channelSalesMap).sort((a, b) => b[1] - a[1]).map(item => item[0]);
            }, [salesData, selectedGroups]);

            const isAllMonthsSelected = useMemo(() => filterMonth.length === MONTHS_LIST.length, [filterMonth]);

            const filteredData = useMemo(() => {
                return salesData.filter(d => {
                    const matchGroup = selectedGroups.includes('ALL') || selectedGroups.includes(d.ProductGroup);
                    const matchSub = filterSubProduct === 'All' || d.SubProductGroup === filterSubProduct;
                    const matchChannel = filterChannel === 'All' || d.Channel === filterChannel;
                    
                    let matchMonth = true;
                    if (!isAllMonthsSelected) {
                        const mStr = d.Month ? d.Month.substring(0, 3) : null;
                        matchMonth = filterMonth.includes(mStr);
                    }

                    return matchGroup && matchSub && matchChannel && matchMonth;
                });
            }, [salesData, selectedGroups, filterSubProduct, filterChannel, filterMonth, isAllMonthsSelected]);

            const kpi = useMemo(() => {
                const valid2026MonthsData = salesData.filter(d => d.Year === '2026' && (isAllMonthsSelected || filterMonth.includes(d.Month?.substring(0,3))));
                const valid2026Months = new Set(valid2026MonthsData.map(d => d.Month?.split('-')[0])); 
                const monthsCount26 = valid2026Months.size || 1; 
                
                const data2026 = filteredData.filter(d => d.Year === '2026');
                const s26 = data2026.reduce((a, b) => a + (b.NetPrice || 0), 0);
                
                const filterFn25 = (d) => {
                    const matchGroup = selectedGroups.includes('ALL') || selectedGroups.includes(d.ProductGroup);
                    const matchSub = filterSubProduct === 'All' || d.SubProductGroup === filterSubProduct;
                    const matchChannel = filterChannel === 'All' || d.Channel === filterChannel;
                    const mStr = d.Month ? d.Month.substring(0, 3) : null;
                    const matchMonth = (isAllMonthsSelected || filterMonth.includes(mStr)) && valid2026Months.has(mStr);
                    return matchGroup && matchSub && matchChannel && matchMonth;
                };

                const data2025_filtered = salesData.filter(d => d.Year === '2025' && filterFn25(d));
                const s25_YTD = data2025_filtered.reduce((a, b) => a + (b.NetPrice || 0), 0);
                
                const fy25FilterFn = (d) => {
                     const matchGroup = selectedGroups.includes('ALL') || selectedGroups.includes(d.ProductGroup);
                    const matchSub = filterSubProduct === 'All' || d.SubProductGroup === filterSubProduct;
                    const matchChannel = filterChannel === 'All' || d.Channel === filterChannel;
                    return matchGroup && matchSub && matchChannel;
                }
                const fy25 = salesData.filter(d => d.Year === '2025' && fy25FilterFn(d)).reduce((a, b) => a + (b.NetPrice || 0), 0);
                
                const growthYoY = s25_YTD > 0 ? ((s26 - s25_YTD) / s25_YTD) * 100 : 0;

                const isSubFiltered = filterSubProduct !== 'All', isChannelFiltered = filterChannel !== 'All';
                let relevantBudgets = [];

                if (!(isSubFiltered && isChannelFiltered)) {
                    if (isSubFiltered) relevantBudgets = budgetProduct.filter(b => (selectedGroups.includes('ALL') || selectedGroups.includes(b.ProductGroup)) && b.SubProductGroup === filterSubProduct);
                    else if (isChannelFiltered) relevantBudgets = budgetChannel.filter(b => (selectedGroups.includes('ALL') || selectedGroups.includes(b.ProductGroup)) && b.Channel === filterChannel);
                    else relevantBudgets = budgetChannel.filter(b => selectedGroups.includes('ALL') || selectedGroups.includes(b.ProductGroup));
                }

                const target26 = relevantBudgets.length ? relevantBudgets.reduce((a,b) => a + (b.Target2026 || 0), 0) : null;
                const plan27 = relevantBudgets.length ? relevantBudgets.reduce((a,b) => a + (b.Plan2027 || 0), 0) : null;
                
                const { forecast26, forecastStatus } = calculateDynamicForecast(s26, s25_YTD, fy25, target26, monthsCount26);

                const progress = (target26 && target26 > 0) ? (s26 / target26) * 100 : 0;
                const growthPlan = (target26 && plan27 && target26 > 0) ? ((plan27 - target26) / target26) * 100 : 0;

                return { s26, s25_YTD, growthYoY, target26, forecast26, forecastStatus, plan27, progress, growthPlan, monthsCount26 }; 
            }, [filteredData, salesData, budgetChannel, budgetProduct, selectedGroups, filterSubProduct, filterChannel]);

            const trendChartData = useMemo(() => {
                const base2025 = filteredData.filter(d => d.Year === '2025');
                const base2026 = filteredData.filter(d => d.Year === '2026');
                
                let latestMonthIdx = -1;
                const monthlyData26 = MONTHS_LIST.map((m, idx) => {
                    const dataForMonth = base2026.filter(d => d.Month && d.Month.startsWith(m));
                    const val = dataForMonth.reduce((s, r) => s + (r.NetPrice || 0), 0);
                    if (val > 0) latestMonthIdx = idx;
                    return { name: m, val, data: dataForMonth };
                });

                let latestMonthInsights = null;
                if (latestMonthIdx >= 0) {
                    const latestData26 = monthlyData26[latestMonthIdx].data;
                    const latestData25 = base2025.filter(d => d.Month && d.Month.startsWith(MONTHS_LIST[latestMonthIdx]));
                    
                    const prodMap26 = {};
                    const prodMap25 = {};
                    const chMap26 = {};
                    const chMap25 = {};
                    
                    latestData26.forEach(d => {
                        const p = d.ProductName || 'Unknown';
                        const c = isChainBasedChannel(d.Channel) ? (d.SubChannel || d.Channel || 'Unknown') : (d.Channel || 'Unknown');
                        prodMap26[p] = (prodMap26[p] || 0) + (d.NetPrice || 0);
                        chMap26[c] = (chMap26[c] || 0) + (d.NetPrice || 0);
                    });
                    
                    latestData25.forEach(d => {
                        const p = d.ProductName || 'Unknown';
                        const c = isChainBasedChannel(d.Channel) ? (d.SubChannel || d.Channel || 'Unknown') : (d.Channel || 'Unknown');
                        prodMap25[p] = (prodMap25[p] || 0) + (d.NetPrice || 0);
                        chMap25[c] = (chMap25[c] || 0) + (d.NetPrice || 0);
                    });
                    
                    const totalMonthSales = monthlyData26[latestMonthIdx].val;

                    const formatTop = (map26, map25, total) => {
                        return Object.entries(map26)
                            .sort((a,b)=>b[1]-a[1])
                            .slice(0,3)
                            .map(([name, val26]) => {
                                const val25 = map25[name] || 0;
                                const pct = total > 0 ? (val26 / total) * 100 : 0;
                                const yoy = val25 > 0 ? ((val26 - val25) / val25) * 100 : null;
                                return { name, val26, val25, pct, yoy };
                            });
                    };

                    latestMonthInsights = {
                        month: MONTHS_LIST[latestMonthIdx],
                        topProducts: formatTop(prodMap26, prodMap25, totalMonthSales),
                        topChannels: formatTop(chMap26, chMap25, totalMonthSales),
                        sales: totalMonthSales
                    };
                }

                const fy25Total = base2025.reduce((s, r) => s + (r.NetPrice || 0), 0);
                const validMonthsCount = latestMonthIdx + 1;
                const ytd26 = monthlyData26.slice(0, validMonthsCount).reduce((s, m) => s + m.val, 0);
                
                let isSeasonality = false;
                let ytd25 = 0;
                const monthly25Sales = MONTHS_LIST.map(m => {
                    return base2025.filter(d => d.Month && d.Month.startsWith(m)).reduce((s, r) => s + (r.NetPrice || 0), 0);
                });
                
                ytd25 = monthly25Sales.slice(0, validMonthsCount).reduce((s, v) => s + v, 0);
                if (ytd25 > 0 && fy25Total > 0) isSeasonality = true;

                const activeSelectedMonthsCount = filterMonth.filter(m => {
                    const mIdx = MONTHS_LIST.indexOf(m);
                    return mIdx !== -1 && mIdx <= latestMonthIdx;
                }).length || 1;

                const runRate = activeSelectedMonthsCount > 0 ? (ytd26 / activeSelectedMonthsCount) : 0;

                return MONTHS_LIST.map((m, idx) => {
                    const sales25 = monthly25Sales[idx] === 0 ? null : monthly25Sales[idx];
                    let sales26 = null;
                    let proj26 = null;

                    if (idx <= latestMonthIdx) {
                        sales26 = monthlyData26[idx].val === 0 ? null : monthlyData26[idx].val;
                        if (idx === latestMonthIdx) proj26 = sales26;
                    } else {
                        if (isSeasonality && ytd25 > 0) {
                            proj26 = (ytd26 / ytd25) * (monthly25Sales[idx] || 0);
                        } else {
                            proj26 = runRate;
                        }
                    }

                    return { 
                        name: m, sales25, sales26, proj26,
                        isLatest: idx === latestMonthIdx,
                        insights: idx === latestMonthIdx ? latestMonthInsights : null
                    };
                });
            }, [filteredData]);

            const yAxisTicks = useMemo(() => {
                const maxVal = (trendChartData || []).reduce((max, d) => Math.max(max, d.sales25 || 0, d.sales26 || 0, d.proj26 || 0), 0);
                if (maxVal === 0) return [0, 5000000];
                const targetMax = maxVal * 1.15;
                const roughStep = targetMax / 4; 
                const magnitude = Math.pow(10, Math.floor(Math.log10(roughStep || 1)));
                const normalized = roughStep / magnitude;
                const niceNorm = normalized <= 1 ? 1 : (normalized <= 2 ? 2 : (normalized <= 2.5 ? 2.5 : (normalized <= 5 ? 5 : 10)));
                const step = niceNorm * magnitude;
                const maxTick = Math.ceil(targetMax / step) * step;
                const ticks = [];
                for (let current = 0; current <= maxTick + (step * 0.1); current += step) ticks.push(current);
                return ticks;
            }, [trendChartData]);

            const channelMix = useMemo(() => {
                const data = {};
                filteredData.filter(d => d.Year === '2026').forEach(d => { data[d.Channel || 'Unknown'] = (data[d.Channel || 'Unknown'] || 0) + (d.NetPrice || 0); });
                return Object.keys(data).map(k => ({ name: k, value: data[k] })).sort((a, b) => b.value - a.value);
            }, [filteredData]);

            const rawTopPerformers = useMemo(() => {
                const skuMap = {};
                const valid2026MonthsData = salesData.filter(d => d.Year === '2026' && (isAllMonthsSelected || filterMonth.includes(d.Month?.substring(0,3))));
                const valid2026Months = new Set(valid2026MonthsData.map(d => d.Month?.split('-')[0]));

                filteredData.forEach(d => {
                    const key = d.GroupSKU || 'Unknown';
                    if (!skuMap[key]) skuMap[key] = { totalSales26: 0, totalSales25: 0, products: {}, channels: {} };
                    if (d.Year === '2026') {
                        skuMap[key].totalSales26 += (d.NetPrice || 0);
                        const pName = d.ProductName || 'Unknown';
                        if (!skuMap[key].products[pName]) skuMap[key].products[pName] = { val26: 0, val25: 0, channels: {} };
                        skuMap[key].products[pName].val26 += (d.NetPrice || 0);
                        const channelName = isChainBasedChannel(d.Channel) ? (d.SubChannel || 'Unknown') : (d.SoldToParty || 'Unknown');
                        skuMap[key].channels[channelName] = (skuMap[key].channels[channelName] || 0) + (d.NetPrice || 0);
                        skuMap[key].products[pName].channels[channelName] = (skuMap[key].products[pName].channels[channelName] || 0) + (d.NetPrice || 0);
                    } else if (d.Year === '2025') {
                        const monthPrefix = d.Month ? d.Month.split('-')[0] : '';
                        if (valid2026Months.has(monthPrefix)) {
                            skuMap[key].totalSales25 += (d.NetPrice || 0);
                            const pName = d.ProductName || 'Unknown';
                            if (!skuMap[key].products[pName]) skuMap[key].products[pName] = { val26: 0, val25: 0, channels: {} };
                            skuMap[key].products[pName].val25 += (d.NetPrice || 0);
                        }
                    }
                });
                return Object.entries(skuMap).map(([sku, data]) => {
                    const sortedProducts = Object.entries(data.products).map(([pName, pData]) => ({ name: pName, value: pData.val26, sales25: pData.val25, topChannels: getParetoTopItems(pData.channels) })).filter(p => p.value > 0 || p.sales25 > 0).sort((a, b) => b.value - a.value);
                    return { sku, name: sortedProducts.length > 0 ? sortedProducts[0].name : sku, value: data.totalSales26, sales25: data.totalSales25, allProducts: sortedProducts, topChannels: getParetoTopItems(data.channels) };
                }).filter(item => item.value > 0 || item.sales25 > 0);
            }, [filteredData, salesData, filterMonth]);

            const topPerformers = useMemo(() => {
                let list = [...(rawTopPerformers || [])];
                if (debouncedTopPerfSearch.length >= 2) list = list.filter(item => item.sku.toLowerCase().includes(debouncedTopPerfSearch.toLowerCase()) || item.name.toLowerCase().includes(debouncedTopPerfSearch.toLowerCase()));
                if (topPerfSortMode === 'yoy') return list.sort((a, b) => { const yoyA = a.sales25 > 0 ? (a.value - a.sales25) / a.sales25 : -Infinity; const yoyB = b.sales25 > 0 ? (b.value - b.sales25) / b.sales25 : -Infinity; return yoyB - yoyA; }).slice(0, 10);
                else return list.sort((a, b) => b.value - a.value).slice(0, 10);
            }, [rawTopPerformers, debouncedTopPerfSearch, topPerfSortMode]);

            const rawTopCustomers = useMemo(() => {
                const customerMap = {};
                const valid2026MonthsData = salesData.filter(d => d.Year === '2026' && (isAllMonthsSelected || filterMonth.includes(d.Month?.substring(0,3))));
                const valid2026Months = new Set(valid2026MonthsData.map(d => d.Month?.split('-')[0]));

                filteredData.forEach(d => {
                    const customerName = ['MT', 'ONLINE'].includes(d.Channel?.toUpperCase() || '') ? (d.SubChannel || 'Unknown') : (d.SoldToParty || 'Unknown');
                    const key = `${customerName}|${d.Channel || 'Unknown'}`;
                    if (!customerMap[key]) customerMap[key] = { name: customerName, channel: d.Channel || 'Unknown', totalSales26: 0, totalSales25: 0, products: {}, productDetails: {} };
                    
                    const pName = d.ProductName || 'Unknown';
                    if (!customerMap[key].productDetails[pName]) customerMap[key].productDetails[pName] = { val26: 0, val25: 0 };

                    if (d.Year === '2026') {
                        customerMap[key].totalSales26 += (d.NetPrice || 0);
                        const prodKey = d.GroupSKU || 'Unknown';
                        customerMap[key].products[prodKey] = (customerMap[key].products[prodKey] || 0) + (d.NetPrice || 0);
                        customerMap[key].productDetails[pName].val26 += (d.NetPrice || 0);
                    } else if (d.Year === '2025') {
                        const monthPrefix = d.Month ? d.Month.split('-')[0] : '';
                        if (valid2026Months.has(monthPrefix)) {
                            customerMap[key].totalSales25 += (d.NetPrice || 0);
                            customerMap[key].productDetails[pName].val25 += (d.NetPrice || 0);
                        }
                    }
                });
                
                return Object.values(customerMap).filter(item => item.totalSales26 > 0 || item.totalSales25 > 0).map(item => {
                    const allProducts = Object.entries(item.productDetails).map(([name, data]) => ({ name, value: data.val26, sales25: data.val25 })).filter(p => p.value > 0 || p.sales25 > 0).sort((a, b) => b.value - a.value);
                    return { ...item, topProducts: getParetoTopItems(item.products), allProducts };
                });
            }, [filteredData, salesData, filterMonth]);

            const topCustomers = useMemo(() => {
                let list = [...(rawTopCustomers || [])];
                if (debouncedCustomerSearch.length >= 2) list = list.filter(item => item.name.toLowerCase().includes(debouncedCustomerSearch.toLowerCase()) || item.channel.toLowerCase().includes(debouncedCustomerSearch.toLowerCase()));
                if (topCustomerSortMode === 'yoy') return list.sort((a, b) => { const yoyA = a.totalSales25 > 0 ? (a.totalSales26 - a.totalSales25) / a.totalSales25 : -Infinity; const yoyB = b.totalSales25 > 0 ? (b.totalSales26 - b.totalSales25) / b.totalSales25 : -Infinity; return yoyB - yoyA; }).slice(0, 50);
                else return list.sort((a, b) => b.totalSales26 - a.totalSales26).slice(0, 50);
            }, [rawTopCustomers, debouncedCustomerSearch, topCustomerSortMode]);

            const uniqueCustomersCount = useMemo(() => {

                });

                const npdProducts = new Set();
                Object.entries(productStats).forEach(([pName, stats]) => { if (stats.firstAbsMonth >= (maxAbsMonth - 11)) npdProducts.add(pName); });

                const npdList = {};

                        npdList[d.ProductName].sales26 += (d.NetPrice || 0);
                    }
                });

                    totalNPDSales26,
                    topNPDs: Object.values(npdList).sort((a, b) => b.sales26 - a.sales26),
                    vitalityIndex: kpi.s26 > 0 ? (totalNPDSales26 / kpi.s26) * 100 : 0
                };
            }, [salesData, filteredData, kpi.s26]);

            return (
                <div className="flex h-screen bg-[#f5f5f7] w-full font-sans overflow-hidden text-[#1d1d1f]">

                    <aside className={`w-[280px] bg-white/95 backdrop-blur-xl border-r border-black/5 flex flex-col justify-between shrink-0 z-40 shadow-[4px_0_24px_rgba(0,0,0,0.02)] relative transition-all duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0 ml-0' : '-translate-x-full -ml-[280px]'}`}>

                            {/* Sidebar Header / Logo */}
                            <div className="p-6 border-b border-black/5">
                                <div className="flex items-center gap-3">
                                    <div className="bg-[#0071e3] p-2.5 rounded-xl shadow-[0_2px_8px_rgba(0,113,227,0.3)]">
                                        <Activity className="w-6 h-6 text-white" />
                                    </div>
                                    <div>
                                        <h1 className="text-sm font-extrabold text-[#1d1d1f] leading-tight tracking-tight">NPD Performance</h1>
                                        <p className="text-[11px] text-[#0071e3] font-bold tracking-wider uppercase mt-0.5">Dashboard 2026</p>
                                    </div>
                                </div>

                                    {isSyncing ? 'Syncing Data...' : 'Sync Data'}
                                </button>
                                <div className="text-center text-[10px] text-[#86868b] font-medium">Developed by NPD Team<br/>v1.5.0 (Sidebar Layout)</div>
                            </div>
                        </div>
                    </aside>

                    {/* --- Main Content Area --- */}
                    <div className="flex-1 flex flex-col min-w-0 overflow-hidden bg-[#f5f5f7] relative">
                        {/* Sticky Top Header */}
                        <header className="bg-white/85 backdrop-blur-xl border-b border-black/5 sticky top-0 z-30 shadow-[0_4px_24px_rgba(0,0,0,0.02)] shrink-0 transition-opacity duration-300">
                            {/* Top Row: Active Tab Title & Global Group Filters */}
                            <div className="px-8 py-5 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-5 min-h-[5rem]">

                                    <button 
                                        onClick={() => setIsSidebarOpen(!isSidebarOpen)}

                                        title="Toggle Sidebar"
                                    >
                                        <Menu className="w-5 h-5" />
                                    </button>
                                    <h2 className="text-[22px] font-extrabold text-[#1d1d1f] tracking-tight flex items-center gap-3">
                                        <div className="bg-[#f5f5f7] p-2 rounded-xl text-[#1d1d1f]">
                                            {React.cloneElement(tabs.find(t => t.id === activeTab)?.icon, { className: 'w-6 h-6' })}

                                <div className="flex justify-between items-center p-5 border-b border-black/5 relative">

                                    <button onClick={() => setShowPasswordModal(false)} className="text-[#86868b] hover:text-[#1d1d1f] absolute right-5 bg-[#e8e8ed] hover:bg-[#d1d1d6] p-1.5 rounded-full transition-colors"><X className="w-4 h-4" /></button>
                                </div>
                                <div className="p-6">
                                    <p className="text-sm text-[#86868b] text-center mb-5 font-medium">Please enter the 4-digit PIN to access Volume & Pricing dynamics.</p>
                                    <form onSubmit={handlePasswordSubmit}>
                                        <input 
                                            type="password" 
                                            autoFocus
                                            maxLength={4}
                                            value={passwordInput}
                                            onChange={(e) => { setPasswordInput(e.target.value); setPasswordError(false); }}
                                            className={`w-full text-center text-2xl tracking-[0.5em] font-bold py-3 rounded-[14px] bg-[#f5f5f7] border focus:outline-none focus:ring-4 transition-all ${passwordError ? 'border-[#ff3b30] focus:ring-[#ff3b30]/10 text-[#ff3b30]' : 'border-black/5 focus:border-[#0071e3]/30 focus:ring-[#0071e3]/10 text-[#1d1d1f]'}`}
                                            placeholder="••••"
                                        />
                                        {passwordError && <p className="text-xs text-[#ff3b30] text-center mt-2 font-bold animate-in slide-in-from-top-1">Incorrect PIN. Please try again.</p>}
                                        <button type="submit" className="mt-5 bg-[#0071e3] hover:bg-[#0077ED] text-white px-6 py-3 rounded-[14px] text-sm font-bold w-full shadow-md active:scale-95 transition-transform">Unlock Menu</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
