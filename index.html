<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-paper Performance Dashboard 2026 (BETA)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Pinned to stable 18.2.0) -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Dependencies for Recharts (Crucial for UMD build) -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js"></script>
    
    <!-- Recharts (Pinned to 2.1.9, which is rock-solid for standalone HTML files) -->
    <script src="https://unpkg.com/recharts@2.1.9/umd/Recharts.min.js"></script>

    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom Scrollbar for better UI */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        
        // Safety Check for Recharts loading
        const Recharts = window.Recharts;
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, 
            PieChart, Pie, Cell, LineChart, Line, ComposedChart, LabelList 
        } = Recharts || {};

        // --- SVG Icons (Replacement for lucide-react to work standalone) ---
        const IconBase = ({ children, className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Icons = {
            LayoutDashboard: ({className}) => <IconBase className={className}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></IconBase>,
            Upload: ({className}) => <IconBase className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></IconBase>,
            Layers: ({className}) => <IconBase className={className}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></IconBase>,
            ShoppingBag: ({className}) => <IconBase className={className}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></IconBase>,
            Users: ({className}) => <IconBase className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>,
            Calendar: ({className}) => <IconBase className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></IconBase>,
            X: ({className}) => <IconBase className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>,
            DollarSign: ({className}) => <IconBase className={className}><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></IconBase>,
            TrendingUp: ({className}) => <IconBase className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></IconBase>,
            Target: ({className}) => <IconBase className={className}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></IconBase>,
            PieChart: ({className}) => <IconBase className={className}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></IconBase>,
            Search: ({className}) => <IconBase className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></IconBase>,
            Trophy: ({className}) => <IconBase className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></IconBase>,
            Medal: ({className}) => <IconBase className={className}><path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"/><path d="M11 12 5.12 2.2"/><path d="m13 12 5.88-9.8"/><path d="M8 7h8"/><circle cx="12" cy="17" r="5"/><polyline points="12 18 10.9 15.2 8 15.2 10.35 13.5 9.4 10.8 12 12.4 14.6 10.8 13.65 13.5 16 15.2 13.1 15.2 12 18"/></IconBase>,
            MapPin: ({className}) => <IconBase className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconBase>,
            Grid3X3: ({className}) => <IconBase className={className}><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></IconBase>,
            ArrowLeft: ({className}) => <IconBase className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></IconBase>,
            ChevronDown: ({className}) => <IconBase className={className}><path d="m6 9 6 6 6-6"/></IconBase>,
            Package: ({className}) => <IconBase className={className}><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></IconBase>,
            Check: ({className}) => <IconBase className={className}><path d="M20 6 9 17l-5-5"/></IconBase>,
            AlertCircle: ({className}) => <IconBase className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconBase>,
            Sparkles: ({className}) => <IconBase className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></IconBase>,
            Lightbulb: ({className}) => <IconBase className={className}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></IconBase>
        };

        // --- Hooks ---
        function useDebounce(value, delay) {
            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => {
                const handler = setTimeout(() => setDebouncedValue(value), delay);
                return () => clearTimeout(handler);
            }, [value, delay]);
            return debouncedValue;
        }

        // --- Helpers ---
        const cleanCurrency = (val) => {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            return parseFloat(val.toString().replace(/[฿",]/g, '').trim()) || 0;
        };

        const parseCSV = (text) => {
            const lines = text.split('\n').filter(l => l.trim() !== '');
            const headers = lines[0].split(',').map(h => h.trim());
            return lines.slice(1).map(line => {
                let row = [];
                let inQuote = false;
                let current = '';
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') { inQuote = !inQuote; } 
                    else if (char === ',' && !inQuote) { row.push(current); current = ''; } 
                    else { current += char; }
                }
                row.push(current);
                const obj = {};
                headers.forEach((h, i) => {
                    obj[h] = row[i] ? row[i].replace(/^"|"$/g, '').trim() : '';
                });
                return obj;
            });
        };

        const isChainBasedChannel = (channel) => {
            const upper = channel ? channel.toUpperCase() : '';
            return ['MT', 'INTER COMPANY', 'ONLINE', 'BJC'].includes(upper);
        };

        // --- Sub-components ---
        const FilterDropdown = ({ label, value, options, onChange, icon }) => {
            const [isOpen, setIsOpen] = useState(false);
            const dropdownRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setIsOpen(false);
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            return (
                <div className="relative" ref={dropdownRef}>
                    <button onClick={() => setIsOpen(!isOpen)} className="flex items-center gap-2 text-sm font-medium text-slate-700 bg-white border border-slate-200 px-3 py-2 rounded hover:border-blue-400 hover:text-blue-600 transition-colors shadow-sm min-w-[160px] justify-between">
                        <div className="flex items-center gap-2">{icon}<span className="text-slate-500">{label}:</span><span className="text-blue-700 font-bold truncate max-w-[100px]">{value}</span></div>
                        <Icons.ChevronDown className={`w-4 h-4 text-slate-400 transition-transform ${isOpen ? 'rotate-180' : ''}`} />
                    </button>
                    {isOpen && (
                        <div className="absolute top-full left-0 mt-1 w-64 bg-white border border-slate-200 rounded-lg shadow-xl z-50 max-h-72 overflow-y-auto animate-in fade-in zoom-in-95 duration-100">
                            <div className="sticky top-0 bg-slate-50 px-4 py-2 text-xs font-bold text-slate-400 uppercase tracking-wider border-b border-slate-100">Select {label}</div>
                            {options.length > 0 ? options.map((opt) => (
                                <button key={opt} className={`w-full text-left px-4 py-3 text-sm hover:bg-blue-50 transition-colors flex justify-between items-center ${opt === value ? 'text-blue-600 font-bold bg-blue-50/50' : 'text-slate-600'}`} onClick={() => { onChange(opt); setIsOpen(false); }}>
                                    {opt}{opt === value && <div className="w-2 h-2 rounded-full bg-blue-600"></div>}
                                </button>
                            )) : <div className="px-4 py-3 text-sm text-slate-400 text-center italic">No options available</div>}
                        </div>
                    )}
                </div>
            );
        };

        const UploadSlot = ({ label, status, onChange }) => (
            <div className={`flex items-center justify-between p-3 rounded-lg border border-slate-200 transition-all ${status ? 'bg-blue-50 border-blue-200' : 'bg-white hover:border-blue-300'}`}>
                <div className="flex items-center gap-3">
                    <div className={`w-2.5 h-2.5 rounded-full ${status ? 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.4)]' : 'bg-slate-300'}`}></div>
                    <span className="text-sm font-medium text-slate-700">{label}</span>
                </div>
                <label className="cursor-pointer text-xs bg-white border border-slate-200 hover:border-blue-400 text-slate-600 hover:text-blue-600 font-medium px-3 py-1.5 rounded transition-colors">
                    {status ? 'Replace' : 'Upload'}
                    <input type="file" accept=".csv" className="hidden" onChange={onChange} />
                </label>
            </div>
        );

        // --- Main Component ---
        function Dashboard() {
            // Guard clause if Recharts failed to load
            if (!Recharts) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-slate-50 text-slate-800">
                        <Icons.AlertCircle className="w-16 h-16 text-red-500 mb-4" />
                        <h2 className="text-xl font-bold mb-2">Failed to load Recharts library</h2>
                        <p className="text-slate-500">Please check your internet connection or try refreshing the page.</p>
                    </div>
                );
            }

            // Clean Start Mode (Empty data initially)
            const [salesData, setSalesData] = useState([]);
            const [budgetChannel, setBudgetChannel] = useState([]);
            const [budgetProduct, setBudgetProduct] = useState([]);
            
            const [selectedGroup, setSelectedGroup] = useState('ALL'); 
            const [showUpload, setShowUpload] = useState(false);
            
            // Search States
            const [searchTerm, setSearchTerm] = useState('');
            const [topPerfSearch, setTopPerfSearch] = useState('');
            const [coverageSearch, setCoverageSearch] = useState('');

            // Debounce
            const debouncedSearchTerm = useDebounce(searchTerm, 300);
            const debouncedTopPerfSearch = useDebounce(topPerfSearch, 300);
            const debouncedCoverageSearch = useDebounce(coverageSearch, 300);
            
            const [filterSubProduct, setFilterSubProduct] = useState('All');
            const [filterChannel, setFilterChannel] = useState('All');
            const [filterMonth, setFilterMonth] = useState('All');
            
            const [coverageDrillChannel, setCoverageDrillChannel] = useState(null);
            
            // File Status: Strictly 2025 and 2026
            const [filesStatus, setFilesStatus] = useState({
                DACARE: { s25: false, s26: false, bCh: false, bPr: false },
                DAOS: { s25: false, s26: false, bCh: false, bPr: false },
                'DASP&Q': { s25: false, s26: false, bCh: false, bPr: false },
                DALIFESTYLE: { s25: false, s26: false, bCh: false, bPr: false },
            });
            const [uploadTab, setUploadTab] = useState('DACARE');

            const dashboardRef = useRef(null);

            const handleFileUpload = (event, groupName, type) => {
                const file = event.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    const rawData = parseCSV(text);
                    setFilesStatus(prev => ({...prev, [groupName]: { ...prev[groupName], [type]: true }}));
                    
                    // Process Data - Strictly 2025 and 2026
                    if (type === 's25' || type === 's26') {
                        const year = type === 's25' ? '2025' : '2026';
                        const formatted = rawData.map(row => ({
                            Month: row['Month'], 
                            ProductGroup: groupName, 
                            Channel: row['Channel'], SubChannel: row['Sub-channel'],
                            SoldToParty: row['Sold-to party'], MaterialNumber: row['Material Number'], ProductName: row['Product Name'],
                            SubProductGroup: row['Sub-product group'], GroupSKU: row['Group SKU'] || row['Sub-product group'],
                            NetPrice: cleanCurrency(row['Net Price']), Year: year
                        })).filter(r => r.ProductGroup);
                        
                        setSalesData(prev => {
                            const others = prev.filter(r => !(r.ProductGroup === groupName && r.Year === year));
                            return [...others, ...formatted];
                        });
                    } else if (type === 'bCh') {
                        const formatted = rawData.map(row => ({
                            ProductGroup: groupName, 
                            Channel: row['Channel'], 
                            Target2026: cleanCurrency(row['Target 2026 (Plan)'] || row['Target 2026 (Budget)'] || row['Target 2026']),
                            Plan2027: cleanCurrency(row['Target 2027 (Plan)'] || row['Target 2027 (Budget)'] || row['Plan 2027'] || 0),
                            Forecast2026: cleanCurrency(row['L.E. 2026 (Forecast)'] || row['Forecast 2026'] || row['L.E. 2026'] || 0)
                        })).filter(r => r.Channel !== 'TOTAL' && r.Channel);
                        
                        setBudgetChannel(prev => [...prev.filter(r => r.ProductGroup !== groupName), ...formatted]);
                    } else if (type === 'bPr') {
                        const formatted = rawData.map(row => ({
                            ProductGroup: groupName, 
                            SubProductGroup: row['Sub-product Group'], 
                            Target2026: cleanCurrency(row['Target 2026 (Plan)'] || row['Target 2026 (Budget)'] || row['Target 2026']),
                            Plan2027: cleanCurrency(row['Target 2027 (Plan)'] || row['Target 2027 (Budget)'] || row['Plan 2027'] || 0),
                            Forecast2026: cleanCurrency(row['L.E. 2026 (Forecast)'] || row['Forecast 2026'] || row['L.E. 2026'] || 0)
                        })).filter(r => r.SubProductGroup);
                        
                        setBudgetProduct(prev => [...prev.filter(r => r.ProductGroup !== groupName), ...formatted]);
                    }
                };
                reader.readAsText(file);
            };

            const availableSubProducts = useMemo(() => {
                const base = selectedGroup === 'ALL' ? salesData : salesData.filter(d => d.ProductGroup === selectedGroup);
                return Array.from(new Set(base.map(d => d.SubProductGroup || '').filter(Boolean))).sort();
            }, [salesData, selectedGroup]);

            const availableChannels = useMemo(() => {
                const base = selectedGroup === 'ALL' ? salesData : salesData.filter(d => d.ProductGroup === selectedGroup);
                return Array.from(new Set(base.map(d => d.Channel || '').filter(Boolean))).sort();
            }, [salesData, selectedGroup]);

            const monthsList = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            const filteredData = useMemo(() => {
                return salesData.filter(d => {
                    const matchGroup = selectedGroup === 'ALL' || d.ProductGroup === selectedGroup;
                    const matchSub = filterSubProduct === 'All' || d.SubProductGroup === filterSubProduct;
                    const matchChannel = filterChannel === 'All' || d.Channel === filterChannel;
                    const matchMonth = filterMonth === 'All' || (d.Month && d.Month.startsWith(filterMonth));
                    return matchGroup && matchSub && matchChannel && matchMonth;
                });
            }, [salesData, selectedGroup, filterSubProduct, filterChannel, filterMonth]);

            // --- KPI Calculation (Apple-to-Apple YTD) ---
            const kpi = useMemo(() => {
                const filterFn = (d) => {
                    const matchGroup = selectedGroup === 'ALL' || d.ProductGroup === selectedGroup;
                    const matchSub = filterSubProduct === 'All' || d.SubProductGroup === filterSubProduct;
                    const matchChannel = filterChannel === 'All' || d.Channel === filterChannel;
                    const matchMonth = filterMonth === 'All' || (d.Month && d.Month.startsWith(filterMonth));
                    return matchGroup && matchSub && matchChannel && matchMonth;
                };

                const data2026 = salesData.filter(d => d.Year === '2026' && filterFn(d));
                const s26 = data2026.reduce((a, b) => a + b.NetPrice, 0);

                const monthsPresentIn2026 = new Set(data2026.map(d => d.Month.split('-')[0])); 

                const s25_YTD = salesData
                    .filter(d => d.Year === '2025' && filterFn(d) && monthsPresentIn2026.has(d.Month.split('-')[0]))
                    .reduce((a, b) => a + b.NetPrice, 0);

                const growthYoY = s25_YTD > 0 ? ((s26 - s25_YTD) / s25_YTD) * 100 : 0;

                let target26 = 0;
                let forecast26 = 0;
                let plan27 = 0;

                const isSubFiltered = filterSubProduct !== 'All';
                const isChannelFiltered = filterChannel !== 'All';

                if (isSubFiltered && isChannelFiltered) {
                    target26 = null; forecast26 = null; plan27 = null;
                } else if (isSubFiltered) {
                    const relevant = budgetProduct.filter(b => (selectedGroup === 'ALL' || b.ProductGroup === selectedGroup) && b.SubProductGroup === filterSubProduct);
                    if (relevant.length === 0) { target26 = null; forecast26 = null; plan27 = null; }
                    else { 
                        target26 = relevant.reduce((a,b) => a + b.Target2026, 0); 
                        forecast26 = relevant.reduce((a,b) => a + b.Forecast2026, 0); 
                        plan27 = relevant.reduce((a,b) => a + b.Plan2027, 0); 
                    }
                } else if (isChannelFiltered) {
                    const relevant = budgetChannel.filter(b => (selectedGroup === 'ALL' || b.ProductGroup === selectedGroup) && b.Channel === filterChannel);
                    if (relevant.length === 0) { target26 = null; forecast26 = null; plan27 = null; }
                    else { 
                        target26 = relevant.reduce((a,b) => a + b.Target2026, 0); 
                        forecast26 = relevant.reduce((a,b) => a + b.Forecast2026, 0); 
                        plan27 = relevant.reduce((a,b) => a + b.Plan2027, 0); 
                    }
                } else {
                    const relevant = budgetChannel.filter(b => (selectedGroup === 'ALL' || b.ProductGroup === selectedGroup));
                    target26 = relevant.reduce((a,b) => a + b.Target2026, 0); 
                    forecast26 = relevant.reduce((a,b) => a + b.Forecast2026, 0); 
                    plan27 = relevant.reduce((a,b) => a + b.Plan2027, 0);
                }
                
                const progress = (target26 && target26 > 0) ? (s26 / target26) * 100 : 0;
                const growthPlan = (target26 && plan27 && target26 > 0) ? ((plan27 - target26) / target26) * 100 : 0;
                
                return { s26, s25_YTD, growthYoY, target26, forecast26, plan27, progress, growthPlan };
            }, [salesData, budgetChannel, budgetProduct, selectedGroup, filterSubProduct, filterChannel, filterMonth]);

            // --- Charts Logic ---
            const trendChartData = useMemo(() => {
                const base2026 = filteredData.filter(d => d.Year === '2026');
                if (selectedGroup === 'ALL') {
                    return monthsList.map(m => {
                        const monthData = base2026.filter(d => d.Month.startsWith(m));
                        const dacare = monthData.filter(d => d.ProductGroup === 'DACARE').reduce((s, r) => s + r.NetPrice, 0);
                        const daos = monthData.filter(d => d.ProductGroup === 'DAOS').reduce((s, r) => s + r.NetPrice, 0);
                        const dasp = monthData.filter(d => d.ProductGroup === 'DASP&Q').reduce((s, r) => s + r.NetPrice, 0);
                        const dalife = monthData.filter(d => d.ProductGroup === 'DALIFESTYLE').reduce((s, r) => s + r.NetPrice, 0);
                        const total = dacare + daos + dasp + dalife;
                        return {
                            name: m,
                            'DACARE': dacare,
                            'DAOS': daos,
                            'DASP&Q': dasp,
                            'DALIFESTYLE': dalife,
                            total: total === 0 ? null : total
                        };
                    });
                } else {
                    const base2025 = salesData.filter(d => d.ProductGroup === selectedGroup && d.Year === '2025' && (filterSubProduct === 'All' || d.SubProductGroup === filterSubProduct) && (filterChannel === 'All' || d.Channel === filterChannel));
                    return monthsList.map(m => {
                        const val2025 = base2025.filter(d => d.Month.startsWith(m)).reduce((s, r) => s + r.NetPrice, 0);
                        const val2026 = base2026.filter(d => d.Month.startsWith(m)).reduce((s, r) => s + r.NetPrice, 0);
                        return {
                            name: m,
                            '2025': val2025,
                            '2026': val2026 === 0 ? null : val2026,
                        };
                    });
                }
            }, [salesData, filteredData, selectedGroup, filterSubProduct, filterChannel]);

            const channelMix = useMemo(() => {
                const data = {};
                filteredData.filter(d => d.Year === '2026').forEach(d => { data[d.Channel] = (data[d.Channel] || 0) + d.NetPrice; });
                return Object.keys(data).map(k => ({ name: k, value: data[k] })).sort((a, b) => b.value - a.value);
            }, [filteredData]);

            // --- Top Performers ---
            const topPerformers = useMemo(() => {
                const skuMap = {};
                filteredData.filter(d => d.Year === '2026').forEach(d => {
                    const key = d.GroupSKU || 'Unknown';
                    if (!skuMap[key]) skuMap[key] = { totalSales: 0, products: {} };
                    skuMap[key].totalSales += d.NetPrice;
                    const pName = d.ProductName || 'Unknown';
                    skuMap[key].products[pName] = (skuMap[key].products[pName] || 0) + d.NetPrice;
                });
                let list = Object.entries(skuMap).map(([sku, data]) => {
                    let bestProd = sku;
                    let maxS = -1;
                    Object.entries(data.products).forEach(([pName, s]) => { if (s > maxS) { maxS = s; bestProd = pName; } });
                    return { sku: sku, name: bestProd, value: data.totalSales };
                });
                if (debouncedTopPerfSearch.length >= 2) {
                    const term = debouncedTopPerfSearch.toLowerCase();
                    list = list.filter(item => item.sku.toLowerCase().includes(term) || item.name.toLowerCase().includes(term));
                }
                return list.sort((a, b) => b.value - a.value).slice(0, 10);
            }, [filteredData, debouncedTopPerfSearch]);

            // --- Coverage Analysis Grid ---
            const coverageGrid = useMemo(() => {
                const base2026 = salesData.filter(d => d.Year === '2026' && (selectedGroup === 'ALL' || d.ProductGroup === selectedGroup));
                const rowsBase = filterSubProduct !== 'All' ? base2026.filter(d => d.SubProductGroup === filterSubProduct) : base2026;

                const skuStats = {};
                rowsBase.forEach(d => { if (d.GroupSKU) skuStats[d.GroupSKU] = (skuStats[d.GroupSKU] || 0) + d.NetPrice; });
                let sortedRows = Object.keys(skuStats).sort((a, b) => skuStats[b] - skuStats[a]);

                if (debouncedCoverageSearch.length >= 2) {
                    const term = debouncedCoverageSearch.toLowerCase();
                    const skuChannels = {};
                    base2026.forEach(d => {
                        const k = d.GroupSKU;
                        if(!skuChannels[k]) skuChannels[k] = new Set();
                        skuChannels[k].add(d.Channel?.toLowerCase() || '');
                        skuChannels[k].add(d.SubChannel?.toLowerCase() || '');
                    });
                    sortedRows = sortedRows.filter(sku => {
                        if (sku.toLowerCase().includes(term)) return true;
                        const chans = skuChannels[sku];
                        if (!chans) return false;
                        for (let c of chans) if (c.includes(term)) return true;
                        return false;
                    });
                }

                const colStats = {};
                if (coverageDrillChannel) {
                    const drillBase = base2026.filter(d => d.Channel === coverageDrillChannel);
                    drillBase.forEach(d => { if (d.SubChannel) colStats[d.SubChannel] = (colStats[d.SubChannel] || 0) + d.NetPrice; });
                } else {
                    base2026.forEach(d => { if (d.Channel) colStats[d.Channel] = (colStats[d.Channel] || 0) + d.NetPrice; });
                }
                const columns = Object.keys(colStats).sort((a, b) => colStats[b] - colStats[a]);

                const matrix = {};
                const columnTotals = {};
                const rowTotals = {};
                
                sortedRows.forEach(r => { matrix[r] = {}; rowTotals[r] = 0; });
                columns.forEach(c => { columnTotals[c] = { sales: 0, count: 0 }; });

                const colSet = new Set(columns);
                const rowSet = new Set(sortedRows);
                
                const colUniqueItemsForHeader = {};
                const colSalesForHeader = {};
                columns.forEach(c => { colUniqueItemsForHeader[c] = new Set(); colSalesForHeader[c] = 0; });
                const allowedSKUs = new Set(sortedRows);
                const cellUniqueItems = {};

                base2026.forEach(d => {
                    const sku = d.GroupSKU;
                    let col = '';
                    if (coverageDrillChannel) {
                        col = d.Channel === coverageDrillChannel ? d.SubChannel : '';
                    } else {
                        col = d.Channel;
                    }
                    if (!col || !colSet.has(col)) return;

                    if (allowedSKUs.has(sku)) {
                        colSalesForHeader[col] += d.NetPrice;
                        if (!coverageDrillChannel) {
                            if (isChainBasedChannel(col)) colUniqueItemsForHeader[col].add(d.SubChannel);
                            else colUniqueItemsForHeader[col].add(d.SoldToParty);
                        }
                    }

                    if (!sku || !rowSet.has(sku)) return;

                    if (!cellUniqueItems[sku]) cellUniqueItems[sku] = {};
                    if (!cellUniqueItems[sku][col]) {
                        cellUniqueItems[sku][col] = new Set();
                        matrix[sku][col] = { sales: 0, count: 0 };
                    }
                    matrix[sku][col].sales += d.NetPrice;

                    const uniqueKey = (coverageDrillChannel || isChainBasedChannel(coverageDrillChannel ? d.Channel : col)) 
                        ? (coverageDrillChannel ? d.SoldToParty : d.SubChannel)
                        : d.SoldToParty;

                    if (uniqueKey) {
                        cellUniqueItems[sku][col].add(uniqueKey);
                    }
                });

                sortedRows.forEach(sku => {
                    columns.forEach(col => {
                        if (cellUniqueItems[sku]?.[col]) {
                            const count = coverageDrillChannel ? (matrix[sku][col].sales > 0 ? 1 : 0) : cellUniqueItems[sku][col].size;
                            matrix[sku][col].count = count;
                            rowTotals[sku] += count;
                        } else {
                            matrix[sku][col] = { sales: 0, count: 0 };
                        }
                    });
                });

                columns.forEach(col => {
                    let totalCount = 0;
                    if (coverageDrillChannel) {
                        sortedRows.forEach(sku => { if (matrix[sku][col] && matrix[sku][col].sales > 0) totalCount++; });
                    } else {
                        totalCount = colUniqueItemsForHeader[col].size;
                    }
                    columnTotals[col] = { sales: colSalesForHeader[col], count: totalCount };
                });

                return { rows: sortedRows, columns, matrix, columnTotals, rowTotals };
            }, [salesData, selectedGroup, filterSubProduct, coverageDrillChannel, debouncedCoverageSearch]);

            // --- Universal Search Logic ---
            const searchResults = useMemo(() => {
                if (!debouncedSearchTerm || debouncedSearchTerm.length < 2) return [];
                const term = debouncedSearchTerm.toLowerCase();
                const agg = {};
                salesData.forEach(d => {
                    if (d.Year !== '2026') return;
                    const match = (d.GroupSKU && d.GroupSKU.toLowerCase().includes(term)) || 
                                  (d.ProductName && d.ProductName.toLowerCase().includes(term)) ||
                                  (d.SoldToParty && d.SoldToParty.toLowerCase().includes(term)) ||
                                  (d.Channel && d.Channel.toLowerCase().includes(term));
                    if (match) {
                        const pName = d.ProductName;
                        if (!agg[pName]) agg[pName] = { sales: 0, channels: new Set(), subSales: {} };
                        agg[pName].sales += d.NetPrice;
                        agg[pName].channels.add(d.Channel);
                        if (isChainBasedChannel(d.Channel) && d.SubChannel) {
                            if (!agg[pName].subSales[d.SubChannel]) agg[pName].subSales[d.SubChannel] = 0;
                            agg[pName].subSales[d.SubChannel] += d.NetPrice;
                        }
                    }
                });
                return Object.entries(agg)
                    .map(([name, data]) => {
                        const channelList = Array.from(data.channels);
                        const chainChannels = channelList.filter(c => isChainBasedChannel(c));
                        const otherChannels = channelList.filter(c => !isChainBasedChannel(c));
                        let locText = "";
                        if (chainChannels.length > 0) {
                            const topSubs = Object.entries(data.subSales).sort((a, b) => b[1] - a[1]).slice(0, 3).map(e => e[0]).join(', ');
                            const chainText = `${chainChannels.join('/')} (${topSubs}${Object.keys(data.subSales).length > 3 ? '...' : ''})`;
                            locText = otherChannels.length > 0 ? `${otherChannels.join(', ')}, ${chainText}` : chainText;
                        } else {
                            locText = channelList.join(', ');
                        }
                        return { name, val: data.sales, location: locText };
                    })
                    .sort((a, b) => b.val - a.val);
            }, [salesData, debouncedSearchTerm]);

            // --- Dynamic Recommendations ---

                        { head: "Precision Application", desc: "พัฒกาวหัวปากกาหรือกาวเทป (Glue Tape) สำหรับงานประดิษฐ์และ Planner ที่ต้องการความเนี้ยบ ไม่เลอะเทอะ" },

                    ]
                };

                const getGenericProductRecs = (prodName) => [
                    { head: `Expand ${prodName} Distribution`, desc: `สินค้า ${prodName} มีศักยภาพในการขยายไปยังช่องทาง ${topCh} เพิ่มเติม ตรวจสอบ Gap Analysis เพื่อดูสาขาที่ยังไม่วางจำหน่าย` },
                    { head: `${prodName} Value Pack`, desc: `กระตุ้นยอดขายต่อบิลด้วยการทำ Bundle Pack หรือ Family Pack สำหรับ ${prodName} ในช่องทาง Online และ Hypermarket` },

                let items = [];

                    items = subProductRecs[filterSubProduct] || getGenericProductRecs(filterSubProduct);

                    const getGeneralRecs = () => [
                        { head: isGrowthPositive ? "2026 Growth Momentum" : "2026 Turnaround", desc: isGrowthPositive ? `ปี 2026 เริ่มต้นดีโต ${growthVal}% YoY. รักษา Momentum ในช่องทาง ${topCh} แล้วขยายสินค้า Hero ไปยังช่องทางรอง` : `ปี 2026 ยอดขายชะลอตัว ${growthVal}%. ต้องเร่งทบทวนแผนช่องทางหลักและอัดโปรโมชั่นดึงยอดคืนในไตรมาสถัดไป` },
                        { head: "Channel Optimization", desc: `ช่องทาง ${topCh} ยังคงเป็นเส้นเลือดใหญ่ (${kpi.s26 ? (channelMix[0]?.value/kpi.s26*100).toFixed(0) : 0}%). ควรกระจายความเสี่ยงไป Online หรือ MT อื่นๆ` },

                    ];

                    const groupRecs = {

                            { head: "Premium Hygiene 2026", desc: "เทรนด์ปีนี้คือ Premium Hygiene ผู้บริโภคยอมจ่ายแพงเพื่อสินค้าที่ดูดีและอ่อนโยนกว่าเดิม" },

                        ],

                            { head: "Smart Hybrid Work", desc: "สินค้าออฟฟิศต้องเบาและพกพาได้ ตอบโจทย์การทำงานแบบ Hybrid Work ที่ยังคงอยู่" },

                    items = selectedGroup === 'ALL' ? getGeneralRecs() : (groupRecs[selectedGroup] || getGeneralRecs());

            }, [selectedGroup, filterSubProduct, kpi, channelMix]);

                return <text x={cx} y={cy} fill="#64748b" textAnchor="middle" fontSize={10}>{formatted}</text>;

            return (

                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {dynamicRecommendations.items.map((item, idx) => (
                                    <div key={idx} className="bg-slate-800/40 p-5 rounded-xl border border-slate-700 hover:border-blue-500/40 hover:bg-slate-800/60 transition-all duration-300 group">
                                        <h3 className="text-base font-bold text-blue-400 mb-3 flex items-center gap-2 group-hover:text-blue-300">
                                            <Icons.Lightbulb className="w-5 h-5" /> {item.head}
                                        </h3>
                                        <p className="text-sm text-slate-300 leading-relaxed font-light">
                                            {item.desc}
                                        </p>
                                    </div>
                                ))}
                            </div>
                        </div>

                    </main>

                    {/* Upload Modal */}
                    {showUpload && (
                        <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-md">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg p-0 animate-in fade-in zoom-in duration-200 overflow-hidden border border-slate-200">
                                <div className="flex justify-between items-center p-5 border-b border-slate-100 bg-slate-50/50">
                                    <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        <Icons.Upload className="w-5 h-5 text-blue-600" /> Data Import Center
                                    </h2>
                                    <button onClick={() => setShowUpload(false)} className="text-slate-400 hover:text-slate-600 transition-colors"><Icons.X className="w-5 h-5" /></button>
                                </div>
                                <div className="flex border-b border-slate-200">
                                    {['DACARE', 'DAOS', 'DASP&Q', 'DALIFESTYLE'].map(tab => (
                                        <button key={tab} onClick={() => setUploadTab(tab)} className={`flex-1 py-3 text-sm font-medium transition-colors border-b-2 ${uploadTab === tab ? 'border-blue-600 text-blue-600 bg-blue-50/50' : 'border-transparent text-slate-500 hover:bg-slate-50'}`}>{tab}</button>
                                    ))}
                                </div>
                                <div className="p-6 space-y-4">
                                    <UploadSlot label="Sales 2025 (.csv)" status={filesStatus[uploadTab].s25} onChange={(e) => handleFileUpload(e, uploadTab, 's25')} />
                                    <UploadSlot label="Sales 2026 (.csv)" status={filesStatus[uploadTab].s26} onChange={(e) => handleFileUpload(e, uploadTab, 's26')} />
                                    <UploadSlot label="Budget Channel (.csv)" status={filesStatus[uploadTab].bCh} onChange={(e) => handleFileUpload(e, uploadTab, 'bCh')} />
                                    <UploadSlot label="Budget Product (.csv)" status={filesStatus[uploadTab].bPr} onChange={(e) => handleFileUpload(e, uploadTab, 'bPr')} />
                                </div>
                                <div className="p-5 bg-slate-50 border-t border-slate-100 flex justify-end">
                                    <button onClick={() => setShowUpload(false)} className="bg-slate-900 hover:bg-slate-800 text-white px-6 py-2.5 rounded-lg text-sm font-medium transition-colors shadow-sm">Done</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
