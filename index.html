        // Safely extract Lucide icons with a Proxy fallback to guarantee no destructuring crashes
        const lucideGlobal = window.lucide || window.Lucide || window.lucideReact || window.LucideReact || {};
        const LucideProxy = new Proxy(lucideGlobal, {
            get: function(target, prop) {
                if (prop in target) return target[prop];
                if (typeof prop !== 'string') return undefined;
                return (props) => React.createElement('svg', {
                    width: 24, height: 24, viewBox: '0 0 24 24', fill: 'none',
                    stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round',
                    ...props
                }, 
                React.createElement('circle', { cx: 12, cy: 12, r: 10 }), 
                React.createElement('line', { x1: 12, y1: 8, x2: 12, y2: 12 }), 
                React.createElement('line', { x1: 12, y1: 16, x2: 12.01, y2: 16 }));
            }
        });

        const { 
            Upload, TrendingUp, Target, Users, DollarSign, LayoutDashboard, Activity,
            PieChart: PieIcon, X, Search, ChevronDown, Calendar, Layers, ShoppingBag, 
            Trophy, Medal, Store, ArrowLeft, Grid3X3, AlertCircle, MapPin, Lightbulb, Sparkles, ArrowRightCircle, Package, Check,
            RefreshCw, Database, CheckCircle2, XCircle, Info, ArrowDown
        } = LucideProxy;

        // --- Hooks ---
        function useDebounce(value, delay) {
            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => {
                const handler = setTimeout(() => setDebouncedValue(value), delay);
                return () => clearTimeout(handler);
            }, [value, delay]);
            return debouncedValue;
        }

        // --- Helpers ---
        const cleanCurrency = (val) => {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            return parseFloat(val.toString().replace(/[฿",]/g, '').trim()) || 0;
        };

        const isChainBasedChannel = (channel) => {
            const upper = channel?.toUpperCase() || '';
            return ['MT', 'INTER COMPANY', 'ONLINE', 'BJC'].includes(upper);
        };

        const getImgFilename = (groupName) => {
            return `image/${groupName.toLowerCase().replace(/&/g, '')}.png`;

                bPr: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSc4GaqFG4Fn7_bkeKyEbmBRPW810BBiWz9AaBu5ufMRBigl9_EP0yrD6hRdtD80KO0dii9pEMPAUEa/pub?gid=503774950&single=true&output=csv'
            },
            'DANB': {
                s25: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSc4GaqFG4Fn7_bkeKyEbmBRPW810BBiWz9AaBu5ufMRBigl9_EP0yrD6hRdtD80KO0dii9pEMPAUEa/pub?gid=1670436585&single=true&output=csv',
                s26: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSc4GaqFG4Fn7_bkeKyEbmBRPW810BBiWz9AaBu5ufMRBigl9_EP0yrD6hRdtD80KO0dii9pEMPAUEa/pub?gid=632732784&single=true&output=csv',
                bCh: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSc4GaqFG4Fn7_bkeKyEbmBRPW810BBiWz9AaBu5ufMRBigl9_EP0yrD6hRdtD80KO0dii9pEMPAUEa/pub?gid=2001882698&single=true&output=csv',
                bPr: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSc4GaqFG4Fn7_bkeKyEbmBRPW810BBiWz9AaBu5ufMRBigl9_EP0yrD6hRdtD80KO0dii9pEMPAUEa/pub?gid=503774950&single=true&output=csv'
            },
            'QUALITY': {
                s25: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSc4GaqFG4Fn7_bkeKyEbmBRPW810BBiWz9AaBu5ufMRBigl9_EP0yrD6hRdtD80KO0dii9pEMPAUEa/pub?gid=1670436585&single=true&output=csv',

                s26: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWNuYqkCH8Z7pIvXMwJOnK0iwEb3kyTrJj_nF2A2WwluWOtrvFKRxiiSCLX81AgB4PJf3sZYD7lkwO/pub?gid=1151038683&single=true&output=csv',
                bCh: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWNuYqkCH8Z7pIvXMwJOnK0iwEb3kyTrJj_nF2A2WwluWOtrvFKRxiiSCLX81AgB4PJf3sZYD7lkwO/pub?gid=228153519&single=true&output=csv',
                bPr: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWNuYqkCH8Z7pIvXMwJOnK0iwEb3kyTrJj_nF2A2WwluWOtrvFKRxiiSCLX81AgB4PJf3sZYD7lkwO/pub?gid=1341247115&single=true&output=csv'
            }
        };

        const fetchCSV = (url) => {
            if (!url) return Promise.reject(new Error('No URL provided'));
            return new Promise((resolve, reject) => {
                window.Papa.parse(url, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    worker: true,
                    complete: (results) => resolve(results.data),
                    error: (error) => reject(error)
                });
            });
        };

        // --- Sub-components ---
        const FilterDropdown = ({ label, value, options, onChange, icon }) => {
            const [isOpen, setIsOpen] = useState(false);
            const dropdownRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setIsOpen(false);
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            return (
                <div className="relative" ref={dropdownRef}>
                    <button onClick={() => setIsOpen(!isOpen)} className="flex items-center gap-2 text-sm font-medium text-slate-800 bg-white border border-slate-300 px-3 py-2 rounded hover:border-blue-500 hover:text-blue-700 transition-colors shadow-sm min-w-[160px] justify-between">
                        <div className="flex items-center gap-2">{icon}<span className="text-slate-600">{label}:</span><span className="text-blue-700 font-bold truncate max-w-[100px]">{value}</span></div>
                        <ChevronDown className={`w-4 h-4 text-slate-500 transition-transform ${isOpen ? 'rotate-180' : ''}`} />
                    </button>
                    {isOpen && (
                        <div className="absolute top-full left-0 mt-1 w-64 bg-white border border-slate-200 rounded-lg shadow-xl z-50 max-h-[400px] overflow-y-auto animate-in fade-in zoom-in-95 duration-100 custom-scrollbar">
                            <div className="sticky top-0 bg-slate-100 px-4 py-2 text-xs font-semibold text-slate-700 uppercase tracking-wider border-b border-slate-200 z-10">Select {label}</div>
                            <div className="py-1">
                                {options.length > 0 ? options.map((opt, index) => {
                                    const optVal = typeof opt === 'string' ? opt : opt.val;
                                    const optGroup = typeof opt === 'string' ? null : opt.group;
                                    const isSelected = optVal === value;
                                    
                                    const prevOptGroup = index > 0 ? (typeof options[index-1] === 'string' ? null : options[index-1].group) : null;
                                    const showGroupHeader = optGroup && optGroup !== prevOptGroup;

                                    return (
                                        <React.Fragment key={optVal}>
                                            {showGroupHeader && (
                                                <div className={`px-3 py-1.5 mt-2 mb-1 mx-2 text-[10px] font-extrabold uppercase tracking-wider rounded ${GROUP_COLORS[optGroup] || 'text-slate-500 bg-slate-100'}`}>
                                                    {optGroup}
                                                </div>
                                            )}
                                            <button 
                                                className={`w-full text-left px-4 py-2.5 text-sm font-medium hover:bg-slate-50 transition-colors flex justify-between items-center ${isSelected ? 'bg-blue-50/50 text-blue-700' : 'text-slate-700'}`} 
                                                onClick={() => { onChange(optVal); setIsOpen(false); }}
                                            >
                                                <span className={`${isSelected ? 'font-bold' : ''} ${optGroup ? 'pl-2' : ''} truncate`}>{optVal}</span>
                                                {isSelected && <div className="w-2 h-2 rounded-full bg-blue-600 flex-shrink-0"></div>}
                                            </button>
                                        </React.Fragment>
                                    );
                                }) : <div className="px-4 py-3 text-sm text-slate-500 text-center italic font-medium">No options available</div>}
                            </div>

        const SyncStatusSlot = ({ label, status }) => {
            let statusColor = 'bg-slate-300';
            let statusText = 'Pending';
            let icon = null;
            
            if (status === 'loading') {
                statusColor = 'bg-blue-400 animate-pulse';
                statusText = 'Syncing...';
                icon = <RefreshCw className="w-3.5 h-3.5 text-blue-500 animate-spin" />;
            } else if (status === 'success') {
                statusColor = 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.4)]';
                statusText = 'Synced';
                icon = <CheckCircle2 className="w-3.5 h-3.5 text-green-600" />;
            } else if (status === 'error') {
                statusColor = 'bg-red-500';
                statusText = 'Failed';
                icon = <XCircle className="w-3.5 h-3.5 text-red-600" />;
            }

            return (
                <div className={`flex items-center justify-between p-3 rounded-lg border border-slate-200 transition-all ${status === 'success' ? 'bg-green-50/50 border-green-200' : (status === 'error' ? 'bg-red-50/50 border-red-200' : 'bg-white')}`}>
                    <div className="flex items-center gap-3">
                        <div className={`w-2.5 h-2.5 rounded-full ${statusColor}`}></div>
                        <span className="text-sm font-medium text-slate-700">{label}</span>
                    </div>
                    <div className="flex items-center gap-1.5">
                        {icon}
                        <span className={`text-xs font-bold ${status === 'success' ? 'text-green-700' : (status === 'error' ? 'text-red-700' : 'text-slate-500')}`}>
                            {statusText}
                        </span>
                    </div>
                </div>
            );
        };

        // --- Main Component ---
        function Dashboard() {
            const [salesData, setSalesData] = useState([]);
            const [budgetChannel, setBudgetChannel] = useState([]);
            const [budgetProduct, setBudgetProduct] = useState([]);
            
            const [selectedGroup, setSelectedGroup] = useState('ALL'); 
            const [showUpload, setShowUpload] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            
            // Search States
            const [topPerfSearch, setTopPerfSearch] = useState('');
            const [coverageSearch, setCoverageSearch] = useState('');
            const [customerSearch, setCustomerSearch] = useState('');

            // Debounce
            const debouncedTopPerfSearch = useDebounce(topPerfSearch, 300);
            const debouncedCoverageSearch = useDebounce(coverageSearch, 300);
            const debouncedCustomerSearch = useDebounce(customerSearch, 300);
            
            // Sort States
            const [topPerfSortMode, setTopPerfSortMode] = useState('sales'); // 'sales' | 'yoy'
            const [topCustomerSortMode, setTopCustomerSortMode] = useState('sales'); // 'sales' | 'yoy'

            const [filterSubProduct, setFilterSubProduct] = useState('All');
            const [filterChannel, setFilterChannel] = useState('All');
            const [filterMonth, setFilterMonth] = useState('All');
            
            const [coverageDrillChannel, setCoverageDrillChannel] = useState(null);
            const [topPerfDrillDown, setTopPerfDrillDown] = useState(null);
            
            // Status for all groups
            const [filesStatus, setFilesStatus] = useState({
                DACARE: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DATISSUE: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DAOS: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DABATTERY: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DASP: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DANB: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                QUALITY: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DALIFESTYLE: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
            });
            const [uploadTab, setUploadTab] = useState('DACARE');

            const dashboardRef = useRef(null);

            const syncAllData = async () => {
                if (isSyncing) return;
                setIsSyncing(true);
                setShowUpload(true);

                let initialStatus = { ...filesStatus };
                for (const groupName of Object.keys(DATA_SOURCES)) {
                    initialStatus[groupName] = { s25: 'loading', s26: 'loading', bCh: 'loading', bPr: 'loading' };
                }
                setFilesStatus(initialStatus);

                const groupPromises = Object.entries(DATA_SOURCES).map(async ([groupName, sources]) => {
                    const groupSales = [];
                    const groupBudgetChannel = [];
                    const groupBudgetProduct = [];

                    try {
                        const [s25Raw, s26Raw, bChRaw, bPrRaw] = await Promise.all([
                            fetchCSV(sources.s25).catch(() => null),
                            fetchCSV(sources.s26).catch(() => null),
                            fetchCSV(sources.bCh).catch(() => null),
                            fetchCSV(sources.bPr).catch(() => null)
                        ]);

                        if (s25Raw) {
                            for (let i=0; i<s25Raw.length; i++) {
                                const row = s25Raw[i];
                                const rawGrp = row['Product Group'] || row['ProductGroup'];
                                if (rawGrp && rawGrp.toUpperCase().trim() !== groupName) continue; // Skip rows meant for other groups

                    ]

                const items = selectedGroup !== 'ALL' && groupRecs[selectedGroup] ? groupRecs[selectedGroup] : [
                    { head: "Peak Season & Momentum", desc: `ภาพรวม ${isGrowthPositive ? `โต +${growthVal}%` : `ติดลบ ${growthVal}%`} (Top Ch: ${topCh}). ข้อมูลปีที่แล้วชี้ว่าเดือน ${peakMonth25 || 'N/A'} คือช่วง High Season ของพอร์ตนี้ เตรียมแผน Supply Chain และ Marketing ให้พร้อมกอบโกยยอด` },

            }, [selectedGroup, filterSubProduct, kpi, channelMix, salesData, filteredData]);

                                                return (
                                                    <tr key={idx} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                        <td className="py-3.5 pl-3 font-semibold text-slate-400">#{idx + 1}</td>
                                                        <td className="py-3.5 font-semibold text-slate-800">{prod.name}</td>
                                                        <td className="py-3.5 text-right font-bold text-blue-700">฿{prod.value.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 0})}</td>
                                                        <td className="py-3.5 pr-3 text-right font-bold">
                                                            {yoy !== null ? (
                                                                <span className={yoy >= 0 ? 'text-green-600' : 'text-red-600'}>
                                                                    {yoy >= 0 ? '▲' : '▼'} {Math.abs(yoy).toFixed(1)}%
                                                                </span>
                                                            ) : (
                                                                <span className="text-slate-400 font-medium">N/A</span>
                                                            )}
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        ) : (
                                            topPerformers.map((item, idx) => {
                                                const yoy = item.sales25 > 0 ? ((item.value - item.sales25) / item.sales25) * 100 : null;
                                                return (
                                                    <tr key={idx} className="border-b border-slate-100 hover:bg-slate-50 transition-colors cursor-pointer" onClick={() => setTopPerfDrillDown(item)}>
                                                        <td className="py-3.5 pl-3 font-semibold">#{idx+1}</td>
                                                        <td className="py-3.5"><div className="font-semibold text-slate-800">{item.sku}</div><div className="text-xs text-slate-500 truncate max-w-xs">{item.name}</div></td>
                                                        <td className="py-3.5 text-right font-bold text-blue-700">฿{item.value.toLocaleString()}</td>
                                                        <td className="py-3.5 pr-3 text-right font-bold">
                                                            {yoy !== null ? (
                                                                <span className={yoy >= 0 ? 'text-green-600' : 'text-red-600'}>
                                                                    {yoy >= 0 ? '▲' : '▼'} {Math.abs(yoy).toFixed(1)}%
                                                                </span>
                                                            ) : (
                                                                <span className="text-slate-400 font-medium">N/A</span>
                                                            )}
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4"><div className="flex items-center gap-3"><Store className="w-6 h-6 text-purple-600" /><div><h3 className="text-base font-extrabold text-slate-800">Top Sold-To Party (2026)</h3><p className="text-xs text-slate-500 font-medium">Showing <span className="font-bold text-blue-600">{uniqueCustomersCount}</span> unique active outlets/chains</p></div></div><div className="relative w-64"><input type="text" placeholder="Filter Customer..." className="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-medium focus:outline-none focus:border-blue-500" value={customerSearch} onChange={(e) => setCustomerSearch(e.target.value)} /><Search className="w-4 h-4 text-slate-400 absolute left-3 top-2.5" /></div></div>
                            <div className="overflow-x-auto custom-scrollbar max-h-80"><table className="w-full text-sm text-left border-collapse min-w-[700px]"><thead className="sticky top-0 bg-slate-100 z-10 shadow-sm border-b border-slate-200"><tr><th className="py-3 px-4 font-bold text-slate-700 w-16 text-center">Rank</th><th className="py-3 px-4 font-bold text-slate-700">Sold-To Party / Chain</th><th className="py-3 px-4 font-bold text-slate-700 w-40">Channel</th><th className="py-3 px-4 font-bold text-slate-700 text-right w-40 cursor-pointer" onClick={() => setTopCustomerSortMode('sales')}>Sales {topCustomerSortMode === 'sales' && <ArrowDown className="w-3 h-3 inline" />}</th><th className="py-3 px-4 font-bold text-slate-700 text-right w-32 cursor-pointer" onClick={() => setTopCustomerSortMode('yoy')}>%Growth {topCustomerSortMode === 'yoy' && <ArrowDown className="w-3 h-3 inline" />}</th><th className="py-3 px-4 font-bold text-slate-700 text-right w-32">% Proportion</th></tr></thead><tbody>{topCustomers.map((item, idx) => {
                                const proportion = kpi.s26 > 0 ? ((item.totalSales26 / kpi.s26) * 100).toFixed(1) : "0.0";
                                const yoy = item.totalSales25 > 0 ? ((item.totalSales26 - item.totalSales25) / item.totalSales25) * 100 : null;
                                return (<tr key={idx} className={`border-b border-slate-100 hover:bg-blue-50/50 transition-colors ${idx % 2 === 0 ? 'bg-white' : 'bg-slate-50/50'}`}><td className="py-3 px-4 text-center font-semibold text-slate-500">#{idx + 1}</td><td className="py-3 px-4 font-semibold text-slate-800">{item.name}</td><td className="py-3 px-4"><span className="bg-slate-100 text-slate-600 border border-slate-200 px-2 py-1 rounded text-xs font-bold">{item.channel}</span></td><td className="py-3 px-4 text-right font-extrabold text-blue-700">฿{item.totalSales26.toLocaleString()}</td>
                                    <td className="py-3 px-4 text-right font-bold">
                                        {yoy !== null ? (
                                            <span className={yoy >= 0 ? 'text-green-600' : 'text-red-600'}>
                                                {yoy >= 0 ? '▲' : '▼'} {Math.abs(yoy).toFixed(1)}%
                                            </span>
                                        ) : (
                                            <span className="text-slate-400 font-medium">N/A</span>
                                        )}
                                    </td>
                                    <td className="py-3 px-4"><div className="flex items-center justify-end gap-2"><span className="font-bold text-slate-700 text-right w-10">{proportion}%</span><div className="w-16 h-1.5 bg-slate-200 rounded-full overflow-hidden flex-shrink-0"><div className="h-full bg-blue-500 rounded-full" style={{ width: `${proportion}%` }}></div></div></div></td></tr>);
                            })}</tbody></table></div>
                        </div>

                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4"><div className="flex items-center gap-3"><Grid3X3 className="w-6 h-6 text-orange-600" /><div><h3 className="text-base font-bold text-slate-700">Channel Coverage Gap Analysis (2026)</h3><p className="text-xs text-slate-500 font-medium">{coverageDrillChannel ? `Drilled down: ${coverageDrillChannel}` : 'Overview by Main Channel'}</p></div></div><div className="flex items-center gap-3">{coverageDrillChannel && <button onClick={() => setCoverageDrillChannel(null)} className="flex items-center gap-1.5 text-sm text-blue-600 hover:bg-blue-50 px-3 py-1.5 rounded-lg transition-colors font-semibold border border-blue-200"><ArrowLeft className="w-4 h-4" /> Back</button>}<div className="relative"><input type="text" placeholder="Search SKU..." className="w-56 pl-9 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-medium focus:outline-none focus:border-blue-500" value={coverageSearch} onChange={(e) => setCoverageSearch(e.target.value)} /><Search className="w-4 h-4 text-slate-400 absolute left-3 top-2.5" /></div></div></div>
                            <div className="overflow-x-auto custom-scrollbar max-h-[600px]"><table className="w-full text-sm text-left border-collapse min-w-[800px]"><thead className="sticky top-0 bg-slate-100 z-10 shadow-sm border-b border-slate-200"><tr><th className="py-4 px-4 font-bold text-slate-700 w-1/3 min-w-[250px]">Group SKU</th>{coverageGrid.columns.map(col => { const total = coverageGrid.columnTotals[col]; return (<th key={col} className={`py-4 px-3 font-bold text-center min-w-[120px] ${!coverageDrillChannel ? 'cursor-pointer hover:bg-blue-50 text-blue-600' : 'text-slate-700'}`} onClick={() => !coverageDrillChannel && setCoverageDrillChannel(col)}><div className="flex flex-col items-center"><div className="flex items-center gap-1.5 mb-1">{col} {!coverageDrillChannel && <ChevronDown className="w-3.5 h-3.5 opacity-60" />}</div><div className="text-xs font-semibold text-slate-500">฿{(total.sales/1000000).toFixed(1)}M</div><div className="flex items-center gap-1 text-[10px] font-semibold text-slate-500 bg-white border border-slate-200 px-1.5 py-0.5 rounded mt-1 shadow-sm">{coverageDrillChannel ? <Package className="w-3 h-3 text-slate-400" /> : <Users className="w-3 h-3 text-slate-400" />} {total.count}</div></div></th>); })}</tr></thead><tbody>{coverageGrid.rows.map((sku, idx) => (<tr key={sku} className={`border-b border-slate-100 hover:bg-blue-50/50 transition-colors ${idx % 2 === 0 ? 'bg-white' : 'bg-slate-50/50'}`}><td className="py-3 px-4 font-semibold text-slate-800 truncate max-w-[250px]"><div className="text-sm">{sku}</div><div className="text-xs text-slate-500 font-medium mt-1">Total Avail: {coverageGrid.rowTotals[sku] || 0}</div></td>{coverageGrid.columns.map(col => { const data = coverageGrid.matrix[sku][col] || { sales: 0, count: 0 }; return (<td key={col} className="py-3 px-3 text-center border-l border-slate-50">{data.count === 0 ? <span className="text-slate-300 text-lg">-</span> : (coverageDrillChannel ? <Check className="w-5 h-5 text-green-500 mx-auto" /> : <div className="flex flex-col items-center gap-1"><span className="font-medium text-slate-600 text-xs">฿{(data.sales/1000000).toFixed(2)}M</span><span className="bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full text-[10px] font-bold flex items-center gap-1 border border-blue-200"><Users className="w-2.5 h-2.5" /> {data.count}</span></div>)}</td>); })}</tr>))}</tbody></table></div>
                        </div>

                        <div className="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 p-8 rounded-xl shadow-lg text-white mt-8 border border-slate-700">
                            <div className="flex flex-col md:flex-row md:items-center justify-between mb-6 border-b border-slate-700/50 pb-6 gap-4">
                                <div className="flex items-center gap-4"><div className="bg-blue-500/20 p-3 rounded-xl border border-blue-500/30"><Sparkles className="w-8 h-8 text-blue-400" /></div><div><h2 className="text-xl font-semibold">{dynamicRecommendations.title}</h2><p className="text-sm text-slate-300">Generated based on real-time sales performance</p></div></div>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">{dynamicRecommendations.items.map((item, idx) => (<div key={idx} className="bg-slate-800/60 p-5 rounded-xl border border-slate-600 hover:border-blue-400/50 hover:bg-slate-700 transition-all duration-300 group"><h3 className="text-base font-semibold text-blue-300 mb-3 flex items-center gap-2"><Lightbulb className="w-5 h-5" /> {item.head}</h3><p className="text-sm text-slate-200 leading-relaxed">{item.desc}</p></div>))}</div>
                        </div>

                        <footer className="w-full text-center pt-8 pb-4 text-slate-400 font-medium text-sm">Developed by NPD Team - Version 1.1</footer>
                    </main>

                    {showUpload && (
                        <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-md">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-200">
                                <div className="flex justify-between items-center p-5 border-b border-slate-100 bg-slate-50/50"><h2 className="text-lg font-bold text-slate-800 flex items-center gap-2"><Database className="w-5 h-5 text-blue-600" /> Data Sync Status</h2><button onClick={() => setShowUpload(false)} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5" /></button></div>
                                <div className="flex border-b border-slate-200 overflow-x-auto custom-scrollbar">{GROUP_ORDER.map(tab => (<button key={tab} onClick={() => setUploadTab(tab)} className={`flex-1 py-3 px-4 text-sm font-medium transition-colors border-b-2 whitespace-nowrap ${uploadTab === tab ? 'border-blue-600 text-blue-600 bg-blue-50/50' : 'border-transparent text-slate-500 hover:bg-slate-50'}`}>{tab}</button>))}</div>
                                <div className="p-6 space-y-4 bg-slate-50/30">
                                    <SyncStatusSlot label="Sales 2025" status={filesStatus[uploadTab].s25} />
                                    <SyncStatusSlot label="Sales 2026" status={filesStatus[uploadTab].s26} />
                                    <SyncStatusSlot label="Budget Channel" status={filesStatus[uploadTab].bCh} />
                                    <SyncStatusSlot label="Budget Product" status={filesStatus[uploadTab].bPr} />
                                </div>
                                <div className="p-5 bg-slate-50 border-t border-slate-100 flex justify-between items-center"><div className="text-xs text-slate-500 flex items-center gap-2 font-medium"><div className={`w-2 h-2 rounded-full ${isSyncing ? 'bg-orange-500 animate-pulse' : 'bg-green-500'}`}></div> Live from Google Sheets</div><button onClick={() => setShowUpload(false)} className="bg-slate-900 text-white px-6 py-2.5 rounded-lg text-sm font-medium">Close</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
