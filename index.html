            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => {

                return () => clearTimeout(handler);

        const getParetoTopItems = (dataObj, maxItems = 5, threshold = 0.8) => {
            const entries = Object.entries(dataObj).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]);
            const total = entries.reduce((sum, [, val]) => sum + val, 0);
            if (total === 0) return [];
            
            let cumulative = 0;
            const result = [];
            for (let i = 0; i < entries.length; i++) {
                const pct = ((entries[i][1] / total) * 100).toFixed(1);
                result.push({ name: entries[i][0], pct });
                cumulative += entries[i][1];
                if (cumulative / total >= threshold || result.length >= maxItems) break;
            }
            return result;
        };

        const requestCache = new Map();

        const fetchCSV = async (url) => {
            if (!url) return null;
            if (requestCache.has(url)) return requestCache.get(url);

            const fetchPromise = (async () => {
                let retries = 3;
                let lastError;
                while (retries > 0) {
                    try {
                        const response = await fetch(url);
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        const csvText = await response.text();
                        return new Promise((resolve) => {
                            window.Papa.parse(csvText, {
                                header: true, skipEmptyLines: true,
                                complete: (results) => resolve(results.data)
                            });
                        });
                    } catch (error) {
                        lastError = error;
                        retries--;
                        if (retries > 0) await new Promise(r => setTimeout(r, 500 * (4 - retries)));
                    }
                }
                console.error('Fetch CSV Error:', lastError);
                throw lastError;
            })();

            requestCache.set(url, fetchPromise);
            return fetchPromise;
        };

        const FilterDropdown = ({ label, value, options, onChange, icon }) => {

                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            return (
                <div className="relative" ref={dropdownRef}>
                    <button 
                        onClick={() => setIsOpen(!isOpen)} 
                        className="flex items-center gap-2 text-sm font-medium text-[#1d1d1f] bg-[#e8e8ed] hover:bg-[#d1d1d6] px-4 py-2 rounded-xl transition-colors min-w-[160px] justify-between"

                                    const isSelected = optVal === value;
                                    
                                    const prevOptGroup = index > 0 ? (typeof options[index-1] === 'string' ? null : options[index-1].group) : null;

                                    return (
                                        <React.Fragment key={optVal}>
                                            {showGroupHeader && (
                                                <div className={`px-4 py-1.5 mt-2 mb-1 mx-2 text-[10px] font-extrabold uppercase tracking-wider rounded-lg ${GROUP_COLORS[optGroup] || 'text-[#86868b] bg-[#f5f5f7]'}`}>

                                                className={`w-full text-left px-5 py-2.5 text-sm font-medium hover:bg-[#f5f5f7] transition-colors flex justify-between items-center ${isSelected ? 'text-[#0071e3]' : 'text-[#1d1d1f]'}`}

                    ) : (

                            <Package className="w-12 h-12 mb-3 opacity-30 text-indigo-500" />

            </div>
        );

        // --- Main Component ---
        function Dashboard() {
            const [salesData, setSalesData] = useState([]);
            const [budgetChannel, setBudgetChannel] = useState([]);
            const [budgetProduct, setBudgetProduct] = useState([]);
            
            // Multiple Selection State
            const [selectedGroups, setSelectedGroups] = useState(['ALL']); 
            
            const [showUpload, setShowUpload] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const [show2025Trend, setShow2025Trend] = useState(true);
            const [showForecast, setShowForecast] = useState(false); 
            
            // Search States
            const [topPerfSearch, setTopPerfSearch] = useState('');
            const [coverageSearch, setCoverageSearch] = useState('');
            const [customerSearch, setCustomerSearch] = useState('');

            // Debounce
            const debouncedTopPerfSearch = useDebounce(topPerfSearch, 300);
            const debouncedCoverageSearch = useDebounce(coverageSearch, 300);
            const debouncedCustomerSearch = useDebounce(customerSearch, 300);
            
            // Sort States
            const [topPerfSortMode, setTopPerfSortMode] = useState('sales');
            const [topCustomerSortMode, setTopCustomerSortMode] = useState('sales');

            const [filterSubProduct, setFilterSubProduct] = useState('All');
            const [filterChannel, setFilterChannel] = useState('All');
            const [filterMonth, setFilterMonth] = useState('All');
            
            const [coverageDrillChannel, setCoverageDrillChannel] = useState(null);
            const [topPerfDrillDown, setTopPerfDrillDown] = useState(null);
            const [topCustomerDrillDown, setTopCustomerDrillDown] = useState(null);
            
            // Status for all groups
            const [filesStatus, setFilesStatus] = useState({
                DACARE: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DATISSUE: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DAOS: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DABATTERY: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DASP: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DANB: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                QUALITY: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
                DALIFESTYLE: { s25: 'pending', s26: 'pending', bCh: 'pending', bPr: 'pending' },
            });
            const [uploadTab, setUploadTab] = useState('DACARE');

            const dashboardRef = useRef(null);

            const syncAllData = async () => {
                if (isSyncing) return;
                setIsSyncing(true);
                setShowUpload(true);

                requestCache.clear();

                let initialStatus = { ...filesStatus };
                for (const groupName of Object.keys(DATA_SOURCES)) {
                    initialStatus[groupName] = { s25: 'loading', s26: 'loading', bCh: 'loading', bPr: 'loading' };
                }
                setFilesStatus(initialStatus);

                let finalSales = [];
                let finalBudgetChannel = [];
                let finalBudgetProduct = [];

                const groupPromises = Object.entries(DATA_SOURCES).map(async ([groupName, sources]) => {
                    const groupSales = [];
                    const groupBudgetChannel = [];
                    const groupBudgetProduct = [];

                    setFilesStatus(prev => ({
                        ...prev,
                        [groupName]: { s25: 'loading', s26: 'loading', bCh: 'loading', bPr: 'loading' }
                    }));

                    try {
                        const [s25Raw, s26Raw, bChRaw, bPrRaw] = await Promise.all([
                            fetchCSV(sources.s25).catch(() => null),
                            fetchCSV(sources.s26).catch(() => null),
                            fetchCSV(sources.bCh).catch(() => null),
                            fetchCSV(sources.bPr).catch(() => null)
                        ]);

                        if (s25Raw) {
                            for (let i=0; i<s25Raw.length; i++) {
                                const row = s25Raw[i];
                                const rawGrp = row['Product Group'] || row['ProductGroup'];
                                if (rawGrp && rawGrp.toUpperCase().trim() !== groupName) continue; 
                                
                                if (row['Product Name'] && row['Month']) {
                                    groupSales.push({
                                        Month: row['Month'], ProductGroup: groupName, Channel: row['Channel'], SubChannel: row['Sub-channel'] || row['Sub-Channel'],
                                        SoldToParty: row['Sold-to party'] || row['Sold-To Party'], MaterialNumber: row['Material Number'], ProductName: row['Product Name'],
                                        SubProductGroup: row['Sub-product group'] || row['Sub-Product Group'], GroupSKU: row['Group SKU'] || row['Sub-product group'] || row['Sub-Product Group'],
                                        NetPrice: cleanCurrency(row['Net Price']), Year: '2025'
                                    });
                                }
                            }
                            setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], s25: 'success' } }));
                        } else setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], s25: 'error' } }));

                        if (s26Raw) {
                            for (let i=0; i<s26Raw.length; i++) {
                                const row = s26Raw[i];
                                const rawGrp = row['Product Group'] || row['ProductGroup'];
                                if (rawGrp && rawGrp.toUpperCase().trim() !== groupName) continue;
                                
                                if (row['Product Name'] && row['Month']) {
                                    groupSales.push({
                                        Month: row['Month'], ProductGroup: groupName, Channel: row['Channel'], SubChannel: row['Sub-channel'] || row['Sub-Channel'],
                                        SoldToParty: row['Sold-to party'] || row['Sold-To Party'], MaterialNumber: row['Material Number'], ProductName: row['Product Name'],
                                        SubProductGroup: row['Sub-product group'] || row['Sub-Product Group'], GroupSKU: row['Group SKU'] || row['Sub-product group'] || row['Sub-Product Group'],
                                        NetPrice: cleanCurrency(row['Net Price']), Year: '2026'
                                    });
                                }
                            }
                            setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], s26: 'success' } }));
                        } else setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], s26: 'error' } }));

                        if (bChRaw) {
                            for (let i=0; i<bChRaw.length; i++) {
                                const row = bChRaw[i];
                                const rawGrp = row['Product Group'] || row['ProductGroup'];
                                if (rawGrp && rawGrp.toUpperCase().trim() !== groupName) continue;
                                
                                if (row['Channel'] && row['Channel'] !== 'TOTAL') {
                                    groupBudgetChannel.push({
                                        ProductGroup: groupName, Channel: row['Channel'], 
                                        Target2026: cleanCurrency(row['Target 2026 (Plan)'] || row['Target 2026 (Budget)'] || row['Target 2026']),
                                        Plan2027: cleanCurrency(row['Target 2027 (Plan)'] || row['Target 2027 (Budget)'] || row['Plan 2027'] || 0),
                                        Forecast2026: cleanCurrency(row['L.E. 2026 (Forecast)'] || row['Forecast 2026'] || row['L.E. 2026'] || 0)
                                    });
                                }
                            }
                            setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], bCh: 'success' } }));
                        } else setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], bCh: 'error' } }));

                        if (bPrRaw) {
                            for (let i=0; i<bPrRaw.length; i++) {
                                const row = bPrRaw[i];
                                const rawGrp = row['Product Group'] || row['ProductGroup'];
                                if (rawGrp && rawGrp.toUpperCase().trim() !== groupName) continue;
                                
                                const subGroup = row['Sub-product Group'] || row['Sub-Product Group'];
                                if (subGroup && subGroup !== 'TOTAL') {
                                    groupBudgetProduct.push({
                                        ProductGroup: groupName, SubProductGroup: subGroup, 
                                        Target2026: cleanCurrency(row['Target 2026 (Plan)'] || row['Target 2026 (Budget)'] || row['Target 2026']),
                                        Plan2027: cleanCurrency(row['Target 2027 (Plan)'] || row['Target 2027 (Budget)'] || row['Plan 2027'] || 0),
                                        Forecast2026: cleanCurrency(row['L.E. 2026 (Forecast)'] || row['Forecast 2026'] || row['L.E. 2026'] || 0)
                                    });
                                }
                            }
                            setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], bPr: 'success' } }));
                        } else setFilesStatus(prev => ({ ...prev, [groupName]: { ...prev[groupName], bPr: 'error' } }));

                        return { groupSales, groupBudgetChannel, groupBudgetProduct };

                    } catch (error) {
                        console.error(`Unexpected error syncing ${groupName}:`, error);
                        setFilesStatus(prev => ({ ...prev, [groupName]: { s25: 'error', s26: 'error', bCh: 'error', bPr: 'error' } }));
                        return { groupSales: [], groupBudgetChannel: [], groupBudgetProduct: [] };
                    }
                });

                const results = await Promise.all(groupPromises);

                results.forEach(res => {
                    for (let i = 0; i < res.groupSales.length; i++) finalSales.push(res.groupSales[i]);
                    for (let i = 0; i < res.groupBudgetChannel.length; i++) finalBudgetChannel.push(res.groupBudgetChannel[i]);
                    for (let i = 0; i < res.groupBudgetProduct.length; i++) finalBudgetProduct.push(res.groupBudgetProduct[i]);
                });

                setSalesData(finalSales);
                setBudgetChannel(finalBudgetChannel);
                setBudgetProduct(finalBudgetProduct);
                setIsSyncing(false);
                setTimeout(() => setShowUpload(false), 1200);
            };

            useEffect(() => {
                syncAllData();
            }, []);

            const toggleGroup = (group) => {
                if (group === 'ALL') {
                    setSelectedGroups(['ALL']);
                } else {
                    let newGroups = selectedGroups.filter(g => g !== 'ALL');
                    if (newGroups.includes(group)) {
                        newGroups = newGroups.filter(g => g !== group);
                        if (newGroups.length === 0) newGroups = ['ALL'];
                    } else {
                        newGroups.push(group);
                    }
                    newGroups.sort((a, b) => GROUP_ORDER.indexOf(a) - GROUP_ORDER.indexOf(b));
                    setSelectedGroups(newGroups);
                }
                setFilterSubProduct('All');
            };

            const availableSubProducts = useMemo(() => {
                const base = selectedGroups.includes('ALL') ? salesData : salesData.filter(d => selectedGroups.includes(d.ProductGroup));
                const subProdMap = new Map();
                base.forEach(d => {
                    if (d.SubProductGroup && !subProdMap.has(d.SubProductGroup)) {
                        subProdMap.set(d.SubProductGroup, d.ProductGroup);
                    }
                });
                const list = Array.from(subProdMap.entries()).map(([name, group]) => ({ val: name, group }));
                list.sort((a, b) => {
                    const gA = GROUP_ORDER.indexOf(a.group);
                    const gB = GROUP_ORDER.indexOf(b.group);
                    if (gA !== gB) return gA - gB;
                    return a.val.localeCompare(b.val);
                });
                return list;
            }, [salesData, selectedGroups]);

            const availableChannels = useMemo(() => {
                const base = selectedGroups.includes('ALL') ? salesData : salesData.filter(d => selectedGroups.includes(d.ProductGroup));
                const channelSalesMap = {};
                base.forEach(d => {
                    const ch = d.Channel;
                    if (ch) {
                        if (!channelSalesMap[ch]) channelSalesMap[ch] = 0;
                        if (d.Year === '2026') channelSalesMap[ch] += d.NetPrice;
                    }
                });
                return Object.entries(channelSalesMap)
                    .map(([name, sales]) => ({ name, sales }))
                    .sort((a, b) => b.sales - a.sales)
                    .map(item => item.name);
            }, [salesData, selectedGroups]);

            const monthsList = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            const filteredData = useMemo(() => {
                return salesData.filter(d => {
                    const matchGroup = selectedGroups.includes('ALL') || selectedGroups.includes(d.ProductGroup);
                    const matchSub = filterSubProduct === 'All' || d.SubProductGroup === filterSubProduct;
                    const matchChannel = filterChannel === 'All' || d.Channel === filterChannel;
                    const matchMonth = filterMonth === 'All' || (d.Month && d.Month.startsWith(filterMonth));
                    return matchGroup && matchSub && matchChannel && matchMonth;
                });
            }, [salesData, selectedGroups, filterSubProduct, filterChannel, filterMonth]);

            const kpi = useMemo(() => {
                const filterFn = (d) => {
                    const matchGroup = selectedGroups.includes('ALL') || selectedGroups.includes(d.ProductGroup);
                    const matchSub = filterSubProduct === 'All' || d.SubProductGroup === filterSubProduct;
                    const matchChannel = filterChannel === 'All' || d.Channel === filterChannel;
                    const matchMonth = filterMonth === 'All' || (d.Month && d.Month.startsWith(filterMonth));
                    return matchGroup && matchSub && matchChannel && matchMonth;
                };
                
                const valid2026Months = new Set(salesData.filter(d => d.Year === '2026').map(d => d.Month?.split('-')[0])); 
                
                const data2026 = salesData.filter(d => d.Year === '2026' && filterFn(d));
                const s26 = data2026.reduce((a, b) => a + b.NetPrice, 0);
                
                const s25_YTD = salesData
                    .filter(d => d.Year === '2025' && filterFn(d) && valid2026Months.has(d.Month?.split('-')[0]))
                    .reduce((a, b) => a + b.NetPrice, 0);
                    
                const growthYoY = s25_YTD > 0 ? ((s26 - s25_YTD) / s25_YTD) * 100 : 0;

                const isSubFiltered = filterSubProduct !== 'All';
                const isChannelFiltered = filterChannel !== 'All';
                let relevantBudgets = [];

                if (!(isSubFiltered && isChannelFiltered)) {
                    if (isSubFiltered) {
                        relevantBudgets = budgetProduct.filter(b => (selectedGroups.includes('ALL') || selectedGroups.includes(b.ProductGroup)) && b.SubProductGroup === filterSubProduct);
                    } else if (isChannelFiltered) {
                        relevantBudgets = budgetChannel.filter(b => (selectedGroups.includes('ALL') || selectedGroups.includes(b.ProductGroup)) && b.Channel === filterChannel);
                    } else {
                        relevantBudgets = budgetChannel.filter(b => selectedGroups.includes('ALL') || selectedGroups.includes(b.ProductGroup));
                    }
                }

                const target26 = relevantBudgets.length ? relevantBudgets.reduce((a,b) => a + b.Target2026, 0) : null;
                const forecast26 = relevantBudgets.length ? relevantBudgets.reduce((a,b) => a + b.Forecast2026, 0) : null;
                const plan27 = relevantBudgets.length ? relevantBudgets.reduce((a,b) => a + b.Plan2027, 0) : null;

                const filterFnIgnoreMonth = (d) => {
                    const matchGroup = selectedGroups.includes('ALL') || selectedGroups.includes(d.ProductGroup);
                    const matchSub = filterSubProduct === 'All' || d.SubProductGroup === filterSubProduct;
                    const matchChannel = filterChannel === 'All' || d.Channel === filterChannel;
                    return matchGroup && matchSub && matchChannel;
                };

                const total25_FullYear = salesData.filter(d => d.Year === '2025' && filterFnIgnoreMonth(d)).reduce((a, b) => a + b.NetPrice, 0);
                const ytd25_ForForecast = salesData.filter(d => d.Year === '2025' && filterFnIgnoreMonth(d) && valid2026Months.has(d.Month?.split('-')[0])).reduce((a, b) => a + b.NetPrice, 0);
                const ytd26_ForForecast = salesData.filter(d => d.Year === '2026' && filterFnIgnoreMonth(d)).reduce((a, b) => a + b.NetPrice, 0);

                let dynamicForecast26 = null;
                if (ytd25_ForForecast > 0 && total25_FullYear > 0) {
                    dynamicForecast26 = ytd26_ForForecast * (total25_FullYear / ytd25_ForForecast);
                } else if (ytd26_ForForecast > 0 && valid2026Months.size > 0) {
                    dynamicForecast26 = (ytd26_ForForecast / valid2026Months.size) * 12;
                }

                const finalForecast = dynamicForecast26 !== null ? dynamicForecast26 : forecast26;
                const progress = (target26 && target26 > 0) ? (s26 / target26) * 100 : 0;
                const growthPlan = (target26 && plan27 && target26 > 0) ? ((plan27 - target26) / target26) * 100 : 0;
                
                let forecastStatus = null;
                if (finalForecast && target26 > 0) {
                    const pct = (finalForecast / target26) * 100;
                    forecastStatus = { percent: pct, isMissing: pct < 100 };
                }

                return { s26, s25_YTD, growthYoY, target26, forecast26: finalForecast, plan27, progress, growthPlan, forecastStatus };
            }, [salesData, budgetChannel, budgetProduct, selectedGroups, filterSubProduct, filterChannel, filterMonth]);

            const trendChartData = useMemo(() => {
                const base2025 = filteredData.filter(d => d.Year === '2025');
                const base2026 = filteredData.filter(d => d.Year === '2026');
                
                if (selectedGroups.includes('ALL')) {
                    return monthsList.map(m => {
                        const m25 = base2025.filter(d => d.Month.startsWith(m));
                        const m26 = base2026.filter(d => d.Month.startsWith(m));

                        const calc = (data, group) => data.filter(d => d.ProductGroup === group).reduce((s, r) => s + r.NetPrice, 0);

                        const dacare25 = calc(m25, 'DACARE'); const dacare26 = calc(m26, 'DACARE');
                        const datissue25 = calc(m25, 'DATISSUE'); const datissue26 = calc(m26, 'DATISSUE');
                        const daos25 = calc(m25, 'DAOS'); const daos26 = calc(m26, 'DAOS');
                        const dabattery25 = calc(m25, 'DABATTERY'); const dabattery26 = calc(m26, 'DABATTERY');
                        const dasp25 = calc(m25, 'DASP'); const dasp26 = calc(m26, 'DASP');
                        const danb25 = calc(m25, 'DANB'); const danb26 = calc(m26, 'DANB');
                        const quality25 = calc(m25, 'QUALITY'); const quality26 = calc(m26, 'QUALITY');
                        const dalife25 = calc(m25, 'DALIFESTYLE'); const dalife26 = calc(m26, 'DALIFESTYLE');

                        const total25 = dacare25 + datissue25 + daos25 + dabattery25 + dasp25 + danb25 + quality25 + dalife25;
                        const total26 = dacare26 + datissue26 + daos26 + dabattery26 + dasp26 + danb26 + quality26 + dalife26;

                        return {
                            name: m, 
                            'DACARE_25': dacare25 === 0 ? null : dacare25, 'DACARE_26': dacare26 === 0 ? null : dacare26,
                            'DATISSUE_25': datissue25 === 0 ? null : datissue25, 'DATISSUE_26': datissue26 === 0 ? null : datissue26,
                            'DAOS_25': daos25 === 0 ? null : daos25, 'DAOS_26': daos26 === 0 ? null : daos26,
                            'DABATTERY_25': dabattery25 === 0 ? null : dabattery25, 'DABATTERY_26': dabattery26 === 0 ? null : dabattery26,
                            'DASP_25': dasp25 === 0 ? null : dasp25, 'DASP_26': dasp26 === 0 ? null : dasp26,
                            'DANB_25': danb25 === 0 ? null : danb25, 'DANB_26': danb26 === 0 ? null : danb26,
                            'QUALITY_25': quality25 === 0 ? null : quality25, 'QUALITY_26': quality26 === 0 ? null : quality26,
                            'DALIFESTYLE_25': dalife25 === 0 ? null : dalife25, 'DALIFESTYLE_26': dalife26 === 0 ? null : dalife26,
                            total25: total25 === 0 ? null : total25, total26: total26 === 0 ? null : total26
                        };
                    });
                } else {
                    return monthsList.map(m => {
                        const val2025 = base2025.filter(d => d.Month.startsWith(m)).reduce((s, r) => s + r.NetPrice, 0);
                        const val2026 = base2026.filter(d => d.Month.startsWith(m)).reduce((s, r) => s + r.NetPrice, 0);
                        return { name: m, '2025': val2025, '2026': val2026 === 0 ? null : val2026 };
                    });
                }
            }, [salesData, filteredData, selectedGroups, filterSubProduct, filterChannel]);

            const yAxisTicks = useMemo(() => {
                const maxVal = trendChartData.reduce((max, d) => {
                    if (selectedGroups.includes('ALL')) return Math.max(max, d.total25 || 0, d.total26 || 0);
                    else return Math.max(max, d['2025'] || 0, d['2026'] || 0);
                }, 0);
                if (maxVal === 0) return [0, 5000000];
                const targetMax = maxVal * 1.15;
                const roughStep = targetMax / 4; 
                const magnitude = Math.pow(10, Math.floor(Math.log10(roughStep || 1)));
                const normalized = roughStep / magnitude;
                let niceNorm;
                if (normalized <= 1) niceNorm = 1; else if (normalized <= 2) niceNorm = 2; else if (normalized <= 2.5) niceNorm = 2.5; else if (normalized <= 5) niceNorm = 5; else niceNorm = 10;
                const step = niceNorm * magnitude;
                const maxTick = Math.ceil(targetMax / step) * step;
                const ticks = [];
                for (let current = 0; current <= maxTick + (step * 0.1); current += step) ticks.push(current);
                return ticks;
            }, [trendChartData, selectedGroups]);

            const channelMix = useMemo(() => {
                const data = {};
                filteredData.filter(d => d.Year === '2026').forEach(d => { data[d.Channel] = (data[d.Channel] || 0) + d.NetPrice; });
                return Object.keys(data).map(k => ({ name: k, value: data[k] })).sort((a, b) => b.value - a.value);
            }, [filteredData]);

            const topPerformers = useMemo(() => {
                const skuMap = {};
                const valid2026Months = new Set(salesData.filter(d => d.Year === '2026').map(d => d.Month?.split('-')[0]));
                filteredData.forEach(d => {
                    const key = d.GroupSKU || 'Unknown';
                    if (!skuMap[key]) skuMap[key] = { totalSales26: 0, totalSales25: 0, products: {}, channels: {} };
                    if (d.Year === '2026') {
                        skuMap[key].totalSales26 += d.NetPrice;
                        const pName = d.ProductName || 'Unknown';
                        if (!skuMap[key].products[pName]) skuMap[key].products[pName] = { val26: 0, val25: 0, channels: {} };
                        skuMap[key].products[pName].val26 += d.NetPrice;

                        const upperCh = d.Channel?.toUpperCase() || '';
                        const isSubChView = ['MT', 'INTER COMPANY', 'ONLINE', 'BJC'].includes(upperCh);
                        const channelName = isSubChView ? (d.SubChannel || 'Unknown') : (d.SoldToParty || 'Unknown');
                        
                        skuMap[key].channels[channelName] = (skuMap[key].channels[channelName] || 0) + d.NetPrice;
                        skuMap[key].products[pName].channels[channelName] = (skuMap[key].products[pName].channels[channelName] || 0) + d.NetPrice;
                        
                    } else if (d.Year === '2025') {
                        const monthPrefix = d.Month ? d.Month.split('-')[0] : '';
                        if (filterMonth !== 'All' || valid2026Months.has(monthPrefix)) {
                            skuMap[key].totalSales25 += d.NetPrice;
                            const pName = d.ProductName || 'Unknown';
                            if (!skuMap[key].products[pName]) skuMap[key].products[pName] = { val26: 0, val25: 0, channels: {} };
                            skuMap[key].products[pName].val25 += d.NetPrice;
                        }
                    }
                });
                let list = Object.entries(skuMap).map(([sku, data]) => {
                    const sortedProducts = Object.entries(data.products).map(([pName, pData]) => {
                        const topChannels = getParetoTopItems(pData.channels || {});
                        return { name: pName, value: pData.val26, sales25: pData.val25, topChannels };
                    }).filter(p => p.value > 0 || p.sales25 > 0).sort((a, b) => b.value - a.value);
                    
                    const bestProd = sortedProducts.length > 0 ? sortedProducts[0].name : sku;
                    const topChannels = getParetoTopItems(data.channels || {});
                    
                    return { sku, name: bestProd, value: data.totalSales26, sales25: data.totalSales25, allProducts: sortedProducts, topChannels };
                }).filter(item => item.value > 0 || item.sales25 > 0);
                
                if (debouncedTopPerfSearch.length >= 2) {
                    const term = debouncedTopPerfSearch.toLowerCase();
                    list = list.filter(item => item.sku.toLowerCase().includes(term) || item.name.toLowerCase().includes(term));
                }
                if (topPerfSortMode === 'yoy') return list.sort((a, b) => { const yoyA = a.sales25 > 0 ? (a.value - a.sales25) / a.sales25 : -Infinity; const yoyB = b.sales25 > 0 ? (b.value - b.sales25) / b.sales25 : -Infinity; return yoyB - yoyA; }).slice(0, 10);
                else return list.sort((a, b) => b.value - a.value).slice(0, 10);
            }, [filteredData, debouncedTopPerfSearch, salesData, filterMonth, topPerfSortMode]);

            const topCustomers = useMemo(() => {
                const customerMap = {};
                const valid2026Months = new Set(salesData.filter(d => d.Year === '2026').map(d => d.Month?.split('-')[0]));
                filteredData.forEach(d => {
                    const upperCh = d.Channel?.toUpperCase() || '';
                    const isSubChView = upperCh === 'MT' || upperCh === 'ONLINE';
                    const customerName = isSubChView ? (d.SubChannel || 'Unknown') : (d.SoldToParty || 'Unknown');
                    
                    const key = `${customerName}|${d.Channel || 'Unknown'}`;
                    if (!customerMap[key]) customerMap[key] = { name: customerName, channel: d.Channel || 'Unknown', totalSales26: 0, totalSales25: 0, products: {}, productDetails: {} };
                    
                    const pName = d.ProductName || 'Unknown';
                    if (!customerMap[key].productDetails[pName]) customerMap[key].productDetails[pName] = { val26: 0, val25: 0 };

                    if (d.Year === '2026') {
                        customerMap[key].totalSales26 += d.NetPrice;
                        const prodKey = d.GroupSKU || 'Unknown';
                        customerMap[key].products[prodKey] = (customerMap[key].products[prodKey] || 0) + d.NetPrice;
                        customerMap[key].productDetails[pName].val26 += d.NetPrice;
                    }
                    else if (d.Year === '2025') {
                        const monthPrefix = d.Month ? d.Month.split('-')[0] : '';
                        if (filterMonth !== 'All' || valid2026Months.has(monthPrefix)) {
                            customerMap[key].totalSales25 += d.NetPrice;
                            customerMap[key].productDetails[pName].val25 += d.NetPrice;
                        }
                    }
                });
                
                let list = Object.values(customerMap).filter(item => item.totalSales26 > 0 || item.totalSales25 > 0).map(item => {
                    const topProducts = getParetoTopItems(item.products || {});
                    const allProducts = Object.entries(item.productDetails).map(([name, data]) => ({
                        name, value: data.val26, sales25: data.val25
                    })).filter(p => p.value > 0 || p.sales25 > 0).sort((a, b) => b.value - a.value);
                    return { ...item, topProducts, allProducts };
                });

                if (debouncedCustomerSearch.length >= 2) {
                    const term = debouncedCustomerSearch.toLowerCase();
                    list = list.filter(item => item.name.toLowerCase().includes(term) || item.channel.toLowerCase().includes(term));
                }
                if (topCustomerSortMode === 'yoy') return list.sort((a, b) => { const yoyA = a.totalSales25 > 0 ? (a.totalSales26 - a.totalSales25) / a.totalSales25 : -Infinity; const yoyB = b.totalSales25 > 0 ? (b.totalSales26 - b.totalSales25) / b.totalSales25 : -Infinity; return yoyB - yoyA; }).slice(0, 50);
                else return list.sort((a, b) => b.totalSales26 - a.totalSales26).slice(0, 50);
            }, [filteredData, debouncedCustomerSearch, salesData, filterMonth, topCustomerSortMode]);

            const uniqueCustomersCount = useMemo(() => {
                const unique = new Set();
                filteredData.filter(d => d.Year === '2026').forEach(d => {
                    const upperCh = d.Channel?.toUpperCase() || '';
                    const isSubChView = upperCh === 'MT' || upperCh === 'ONLINE';
                    const customerName = isSubChView ? d.SubChannel : d.SoldToParty;
                    
                    if (customerName) unique.add(`${customerName}|${d.Channel}`);
                });
                return unique.size;
            }, [filteredData]);

            const npdData = useMemo(() => {
                const productStats = {};
                const monthMap = { 'Jan': 0, 'Feb': 1, 'Mar': 2, 'Apr': 3, 'May': 4, 'Jun': 5, 'Jul': 6, 'Aug': 7, 'Sep': 8, 'Oct': 9, 'Nov': 10, 'Dec': 11 };
                
                // 1. Find the very first month of sale for each product across ALL historical data
                salesData.forEach(d => {
                    const m = d.Month ? d.Month.substring(0, 3) : null;
                    if (!m || !d.ProductName) return;
                    const mIdx = monthMap[m];
                    if (mIdx === undefined) return;
                    
                    // Calculate absolute month index (Base Year 2025 = 0)
                    const absMonth = (parseInt(d.Year) - 2025) * 12 + mIdx;
                    
                    if (!productStats[d.ProductName]) {
                        productStats[d.ProductName] = { firstAbsMonth: absMonth };
                    } else {
                        if (absMonth < productStats[d.ProductName].firstAbsMonth) {
                            productStats[d.ProductName].firstAbsMonth = absMonth;
                        }
                    }
                });

                // 2. Find the current latest month in the dataset to calculate the "Last 12 Months" window dynamically
                let maxAbsMonth = 0;
                salesData.forEach(d => {
                    if (d.Year === '2026') {
                        const m = d.Month ? d.Month.substring(0, 3) : null;
                        if (m && monthMap[m] !== undefined) {
                            const absMonth = 12 + monthMap[m];
                            if (absMonth > maxAbsMonth) maxAbsMonth = absMonth;
                        }
                    }
                });
                
                if (maxAbsMonth === 0) maxAbsMonth = 16; // Fallback to May 2026 if no 2026 data yet
                const thresholdMonth = maxAbsMonth - 11; // Last 12 months (e.g., if max is 16, threshold is 5 (Jun 25))

                const npdProducts = new Set();
                Object.entries(productStats).forEach(([pName, stats]) => {
                    // If the first recorded sale is within the last 12 months, flag as NPD
                    if (stats.firstAbsMonth >= thresholdMonth) {
                        npdProducts.add(pName);
                    }
                });

                let totalNPDSales26 = 0;
                const npdList = {};

                // 3. Calculate metrics based on FILTERED 2026 data
                filteredData.filter(d => d.Year === '2026').forEach(d => {
                    if (npdProducts.has(d.ProductName)) {
                        totalNPDSales26 += d.NetPrice;
                        if (!npdList[d.ProductName]) {
                            npdList[d.ProductName] = { name: d.ProductName, sku: d.GroupSKU, sales26: 0, channels: {} };
                        }
                        npdList[d.ProductName].sales26 += d.NetPrice;
                        const ch = d.Channel || 'Unknown';
                        npdList[d.ProductName].channels[ch] = (npdList[d.ProductName].channels[ch] || 0) + d.NetPrice;
                    }
                });

                const topNPDs = Object.values(npdList)
                    .sort((a, b) => b.sales26 - a.sales26)
                    .map(item => {
                        const topChannels = getParetoTopItems(item.channels, 3);
                        return { ...item, topChannels };
                    });

                return {
                    totalNPDSales26,
                    topNPDs,
                    vitalityIndex: kpi.s26 > 0 ? (totalNPDSales26 / kpi.s26) * 100 : 0
                };
            }, [salesData, filteredData, kpi.s26]);

            const coverageGrid = useMemo(() => {
                const selectedMonthIndex = filterMonth === 'All' ? 11 : monthsList.indexOf(filterMonth);
                const base2026 = salesData.filter(d => {
                    const matchYear = d.Year === '2026';
                    const matchGroup = selectedGroups.includes('ALL') || selectedGroups.includes(d.ProductGroup);
                    let matchMonth = true;
                    if (filterMonth !== 'All' && d.Month) {
                        const recordMonthIndex = monthsList.findIndex(m => d.Month.startsWith(m));
                        matchMonth = recordMonthIndex !== -1 && recordMonthIndex <= selectedMonthIndex;
                    }
                    return matchYear && matchGroup && matchMonth;
                });
                const rowsBase = filterSubProduct !== 'All' ? base2026.filter(d => d.SubProductGroup === filterSubProduct) : base2026;
                const skuStats = {};
                rowsBase.forEach(d => { if (d.GroupSKU) skuStats[d.GroupSKU] = (skuStats[d.GroupSKU] || 0) + d.NetPrice; });
                let sortedRows = Object.keys(skuStats).sort((a, b) => skuStats[b] - skuStats[a]);
                if (debouncedCoverageSearch.length >= 2) {
                    const term = debouncedCoverageSearch.toLowerCase();
                    const skuChannels = {};
                    base2026.forEach(d => {
                        const k = d.GroupSKU; if(!skuChannels[k]) skuChannels[k] = new Set();
                        skuChannels[k].add(d.Channel?.toLowerCase() || ''); skuChannels[k].add(d.SubChannel?.toLowerCase() || '');
                    });
                    sortedRows = sortedRows.filter(sku => {
                        if (sku.toLowerCase().includes(term)) return true;
                        const chans = skuChannels[sku]; if (!chans) return false;
                        for (let c of chans) if (c.includes(term)) return true; return false;
                    });
                }
                const colStats = {};
                if (coverageDrillChannel) {
                    const drillBase = base2026.filter(d => d.Channel === coverageDrillChannel);
                    drillBase.forEach(d => { if (d.SubChannel) colStats[d.SubChannel] = (colStats[d.SubChannel] || 0) + d.NetPrice; });
                } else base2026.forEach(d => { if (d.Channel) colStats[d.Channel] = (colStats[d.Channel] || 0) + d.NetPrice; });
                const columns = Object.keys(colStats).sort((a, b) => colStats[b] - colStats[a]);
                const matrix = {}; const columnTotals = {}; const rowTotals = {};
                sortedRows.forEach(r => { matrix[r] = {}; rowTotals[r] = 0; });
                columns.forEach(c => { columnTotals[c] = { sales: 0, count: 0 }; });
                const colUniqueItemsForHeader = {}; const colSalesForHeader = {};
                columns.forEach(c => { colUniqueItemsForHeader[c] = new Set(); colSalesForHeader[c] = 0; });
                const allowedSKUs = new Set(sortedRows); const cellUniqueItems = {};
                base2026.forEach(d => {
                    const sku = d.GroupSKU; let col = coverageDrillChannel ? (d.Channel === coverageDrillChannel ? d.SubChannel : '') : d.Channel;
                    if (!col || !columns.includes(col)) return;
                    if (allowedSKUs.has(sku)) { colSalesForHeader[col] += d.NetPrice; if (!coverageDrillChannel) { if (isChainBasedChannel(col)) colUniqueItemsForHeader[col].add(d.SubChannel); else colUniqueItemsForHeader[col].add(d.SoldToParty); } }
                    if (!sku || !allowedSKUs.has(sku)) return;
                    if (!cellUniqueItems[sku]) cellUniqueItems[sku] = {};
                    if (!cellUniqueItems[sku][col]) { cellUniqueItems[sku][col] = new Set(); matrix[sku][col] = { sales: 0, count: 0 }; }
                    matrix[sku][col].sales += d.NetPrice;
                    const uniqueKey = (coverageDrillChannel || isChainBasedChannel(col)) ? (coverageDrillChannel ? d.SoldToParty : d.SubChannel) : d.SoldToParty;
                    if (uniqueKey) cellUniqueItems[sku][col].add(uniqueKey);
                });
                sortedRows.forEach(sku => { columns.forEach(col => { if (cellUniqueItems[sku]?.[col]) { const count = coverageDrillChannel ? (matrix[sku][col].sales > 0 ? 1 : 0) : cellUniqueItems[sku][col].size; matrix[sku][col].count = count; rowTotals[sku] += count; } else matrix[sku][col] = { sales: 0, count: 0 }; }); });
                columns.forEach(col => { columnTotals[col] = { sales: colSalesForHeader[col], count: coverageDrillChannel ? sortedRows.filter(s => matrix[s][col] && matrix[s][col].sales > 0).length : colUniqueItemsForHeader[col].size }; });
                return { rows: sortedRows, columns, matrix, columnTotals, rowTotals };
            }, [salesData, selectedGroups, filterSubProduct, filterMonth, coverageDrillChannel, debouncedCoverageSearch]);


            return (
                <div ref={dashboardRef} className="min-h-screen pb-10 w-full relative">
                    {/* Apple-style Frosted Header */}
                    <header className="bg-white/85 backdrop-blur-xl border-b border-black/5 sticky top-0 z-30 shadow-[0_1px_10px_rgba(0,0,0,0.02)]">
                        <div className="w-full px-6 py-3.5 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 min-h-[4rem]">
                            <div className="flex items-center gap-3 shrink-0">
                                <div className="bg-[#0071e3] p-1.5 rounded-lg shadow-sm">
                                    <Activity className="w-5 h-5 text-white" />
                                </div>
                                <h1 className="text-[19px] font-semibold tracking-tight text-[#1d1d1f]">Non-paper Performance Dashboard <span className="text-[#0071e3] font-bold">2026</span></h1>
                            </div>
                            <div className="flex flex-wrap items-center gap-3 w-full xl:w-auto justify-start xl:justify-end">
                                {/* Segmented Control Style */}
                                <div className="flex flex-wrap bg-[#e3e3e8] rounded-xl p-1 gap-1">
                                    {['ALL', ...GROUP_ORDER].map(group => {
                                        const isSelected = selectedGroups.includes(group);
                                        return (
                                            <button 
                                                key={group} 
                                                onClick={() => toggleGroup(group)} 
                                                className={`px-4 py-1.5 text-sm font-medium rounded-[8px] transition-all ${isSelected ? 'bg-white text-[#1d1d1f] shadow-[0_1px_4px_rgba(0,0,0,0.12)]' : 'text-[#86868b] hover:text-[#1d1d1f]'}`}
                                            >
                                                {group}
                                            </button>
                                        );
                                    })}
                                </div>
                                <button onClick={() => syncAllData()} disabled={isSyncing} className={`flex items-center gap-2 text-white px-5 py-2 rounded-full text-sm font-semibold transition-all shrink-0 shadow-sm hover:shadow-md ${isSyncing ? 'bg-[#0071e3]/70 cursor-not-allowed' : 'bg-[#0071e3] hover:bg-[#0077ED] active:scale-95'}`}>
                                    <RefreshCw className={`w-4 h-4 ${isSyncing ? 'animate-spin' : ''}`} /> <span className="hidden md:inline">{isSyncing ? 'Syncing...' : 'Sync Data'}</span>
                                </button>
                            </div>
                        </div>
                        {/* Sub-header Filter Bar */}
                        <div className="bg-white/50 border-t border-black/5 py-3 relative z-40">
                            <div className="w-full px-6 flex flex-wrap gap-4 items-center">
                                <span className="text-sm font-semibold text-[#86868b] flex items-center gap-2 tracking-wide"><Filter className="w-4 h-4" /> FILTERS:</span>
                                <FilterDropdown label="Product" value={filterSubProduct} options={[{val: 'All', group: null}, ...availableSubProducts]} onChange={setFilterSubProduct} icon={<ShoppingBag />} />
                                <FilterDropdown label="Channel" value={filterChannel} options={['All', ...availableChannels]} onChange={setFilterChannel} icon={<Users />} />
                                <FilterDropdown label="Month" value={filterMonth} options={['All', ...monthsList]} onChange={setFilterMonth} icon={<Calendar />} />
                                {(filterSubProduct !== 'All' || filterChannel !== 'All' || filterMonth !== 'All' || !selectedGroups.includes('ALL')) && (
                                    <button onClick={() => { setSelectedGroups(['ALL']); setFilterSubProduct('All'); setFilterChannel('All'); setFilterMonth('All'); }} className="text-sm text-[#ff3b30] hover:text-white font-medium ml-auto flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#ff3b30]/10 hover:bg-[#ff3b30] transition-colors">
                                        <X className="w-4 h-4" /> Clear All
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="w-full px-6 py-8 space-y-8 max-w-[1920px] mx-auto">
                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-6">
                            <PortfolioSummaryWidget selectedGroups={selectedGroups} toggleGroup={toggleGroup} />
                            <KPIYTDWidget kpi={kpi} />
                            <KPITargetWidget kpi={kpi} />
                            <KPIForecastWidget kpi={kpi} showForecast={showForecast} setShowForecast={setShowForecast} />
                            <KPIPlanWidget kpi={kpi} />
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <TrendChartWidget trendChartData={trendChartData} selectedGroups={selectedGroups} show2025Trend={show2025Trend} setShow2025Trend={setShow2025Trend} yAxisTicks={yAxisTicks} />
                            <ChannelMixWidget channelMix={channelMix} kpi={kpi} />
                        </div>

                        {}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <NPDVitalityWidget npdData={npdData} kpi={kpi} />
                            <TopNPDWidget npdData={npdData} />
                        </div>

                        <TopPerformersWidget 
                            topPerformers={topPerformers} 
                            topPerfDrillDown={topPerfDrillDown} 
                            setTopPerfDrillDown={setTopPerfDrillDown} 
                            topPerfSearch={topPerfSearch} 
                            setTopPerfSearch={setTopPerfSearch} 
                            topPerfSortMode={topPerfSortMode} 
                            setTopPerfSortMode={setTopPerfSortMode} 
                            kpi={kpi} 
                        />
                        
                        <TopCustomersWidget 
                            topCustomers={topCustomers} 
                            uniqueCustomersCount={uniqueCustomersCount} 
                            customerSearch={customerSearch} 
                            setCustomerSearch={setCustomerSearch} 
                            topCustomerSortMode={topCustomerSortMode} 
                            setTopCustomerSortMode={setTopCustomerSortMode} 
                            kpi={kpi} 
                            topCustomerDrillDown={topCustomerDrillDown} 
                            setTopCustomerDrillDown={setTopCustomerDrillDown} 
                        />

                        <CoverageGapWidget 
                            coverageGrid={coverageGrid} 
                            coverageDrillChannel={coverageDrillChannel} 
                            setCoverageDrillChannel={setCoverageDrillChannel} 
                            coverageSearch={coverageSearch} 
                            setCoverageSearch={setCoverageSearch} 
                        />

                        <footer className="w-full text-center pt-8 pb-4 text-[#86868b] font-medium text-sm">
                            Developed by NPD Team - Version 1.2
                        </footer>
                    </main>

                    {/* Apple-style Modal */}
                    {showUpload && (
                        <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 backdrop-blur-md animate-in fade-in duration-200">
                            <div className="bg-white/95 backdrop-blur-xl rounded-[24px] shadow-2xl w-full max-w-lg overflow-hidden border border-white/20 animate-in zoom-in-95 duration-200">
                                <div className="flex justify-between items-center p-5 border-b border-black/5 relative">
                                    <h2 className="text-lg font-semibold text-[#1d1d1f] w-full text-center tracking-tight">Data Sync Status</h2>
                                    <button onClick={() => setShowUpload(false)} className="text-[#86868b] hover:text-[#1d1d1f] absolute right-5 bg-[#e8e8ed] hover:bg-[#d1d1d6] p-1.5 rounded-full transition-colors"><X className="w-4 h-4" /></button>
                                </div>
                                <div className="flex border-b border-black/5 overflow-x-auto custom-scrollbar px-2 pt-2">
                                    {GROUP_ORDER.map(tab => (
                                        <button key={tab} onClick={() => setUploadTab(tab)} className={`flex-1 py-2 px-4 text-xs font-semibold transition-all mb-2 rounded-full whitespace-nowrap ${uploadTab === tab ? 'text-[#1d1d1f] bg-[#e8e8ed]' : 'text-[#86868b] hover:text-[#1d1d1f] hover:bg-[#f5f5f7]'}`}>
                                            {tab}
                                        </button>
                                    ))}
                                </div>
                                <div className="p-6 space-y-3 bg-[#f5f5f7]/50">
                                    <SyncStatusSlot label="Sales 2025" status={filesStatus[uploadTab].s25} />
                                    <SyncStatusSlot label="Sales 2026" status={filesStatus[uploadTab].s26} />
                                    <SyncStatusSlot label="Budget Channel" status={filesStatus[uploadTab].bCh} />
                                    <SyncStatusSlot label="Budget Product" status={filesStatus[uploadTab].bPr} />
                                </div>
                                <div className="p-5 bg-white border-t border-black/5 flex flex-col gap-4">
                                    <div className="text-[11px] text-[#86868b] flex justify-center items-center gap-1.5 font-medium uppercase tracking-wider">
                                        <div className={`w-1.5 h-1.5 rounded-full ${isSyncing ? 'bg-[#ff9500] animate-pulse' : 'bg-[#34c759]'}`}></div> 
                                        Live from Google Sheets
                                    </div>
                                    <button onClick={() => setShowUpload(false)} className="bg-[#0071e3] hover:bg-[#0077ED] text-white px-6 py-3 rounded-[14px] text-base font-semibold w-full shadow-md active:scale-95 transition-transform">
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
