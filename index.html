<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f7">
    <meta name="description" content="Non-paper Performance Dashboard 2026 — Executive KPI, Portfolio Profitability, Channel Expansion, and NPD Analytics">
    <title>Non-paper Performance Dashboard 2026</title>

    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://docs.google.com" crossorigin>

    <link rel="stylesheet" href="css/styles.css">

    <!-- Pinned Production Vendor Libraries (Deferred for Instant First Paint) -->
    <script defer src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script defer src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" crossorigin></script>
    <script defer src="js/vendor-bridge.js"></script>
    <script defer src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" crossorigin></script>

    <!-- Modular Application Architecture (Zero Runtime Babel / Tailwind Compilation) -->
    <script defer src="js/config.js"></script>
    <script defer src="js/icons.js"></script>
    <script defer src="js/utils.js"></script>
    <script defer src="js/dataEngine.js"></script>
    <script defer src="js/components/common.js"></script>
    <script defer src="js/components/overview.js"></script>
    <script defer src="js/components/portfolio.js"></script>
    <script defer src="js/components/distribution.js"></script>
    <script defer src="js/components/innovation.js"></script>
    <script defer src="js/components/volume.js"></script>
    <script defer src="js/app.js"></script>
</head>
<body>
    <div id="root">
        <!-- Instant Pre-JS Skeleton Shell (0ms First Contentful Paint) -->
        <div class="flex h-screen bg-[#f5f5f7] w-full font-sans overflow-hidden">
            <div class="flex-1 p-4 sm:p-6 lg:p-8 max-w-[1600px] mx-auto w-full space-y-6">
                <div class="bg-white p-5 rounded-[24px] h-20 flex items-center justify-between border border-black/[0.04]">
                    <div class="w-48 h-6 rounded-lg skeleton-shimmer"></div>
                    <div class="w-64 h-8 rounded-xl skeleton-shimmer hidden sm:block"></div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-4 sm:gap-6">
                    <div class="bg-white p-6 rounded-[24px] h-36 skeleton-shimmer"></div>
                    <div class="bg-white p-6 rounded-[24px] h-36 skeleton-shimmer"></div>
                    <div class="bg-white p-6 rounded-[24px] h-36 skeleton-shimmer"></div>
                    <div class="bg-white p-6 rounded-[24px] h-36 skeleton-shimmer"></div>
                    <div class="bg-white p-6 rounded-[24px] h-36 skeleton-shimmer"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
